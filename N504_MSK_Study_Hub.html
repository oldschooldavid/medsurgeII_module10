SRC_CHAPTERS.push({id:'ch41',title:'Chapter 41 — Assessment of the Musculoskeletal System',html:`
<h4>Priority & Interrelated Concepts</h4><p>Priority: Mobility. Interrelated: Sensory Perception, Pain. The MSK system is the second largest body system (bones, joints, skeletal muscles, supporting structures). Mobility is a basic human need essential for ADLs; loss of mobility can diminish self-esteem. Prolonged immobility → skin breakdown, constipation, joint contractures, VTE. Nerve damage → impaired sensory perception and pain.</p>
<h4>Key Terms</h4><ul><li><b>Arthralgias</b> — joint aches and discomfort. <b>Arthritis</b> — joint inflammation.</li><li><b>Arthroscopy</b> — fiberoptic tube inserted into a joint for direct visualization of ligaments, menisci, articular surfaces.</li><li><b>Bone scan</b> — radionuclide test; radioactive material injected for viewing entire skeleton.</li><li><b>Bursitis</b> — inflammation of bursae (synovium-lined sacs at joints/bony prominences that prevent friction).</li><li><b>Dermatomyositis</b> — polymyositis with a purplish skin rash. <b>Effusion</b> — fluid accumulation, e.g., in a joint.</li><li><b>Fascia</b> — dense fibrous tissue surrounding skeletal muscle; contains blood, lymph, nerve supply.</li><li><b>Gout</b> — genetically linked arthritis from an inborn error of purine metabolism.</li><li><b>Kyphosis</b> — outward curvature of thoracic spine ("humped back"). <b>Lordosis</b> — inward abnormal curvature of lumbar spine. <b>Scoliosis</b> — abnormal lateral curvature.</li><li><b>Muscle atrophy</b> — deterioration from disuse. <b>Muscular dystrophy</b> — genetic diseases causing chronic skeletal muscle weakness and organ dysfunction (smooth muscle involvement).</li><li><b>Myopathy</b> — muscle tissue problem → weakness. <b>Neuropathy</b> — nerve tissue problem → weakness and ↓ sensory perception.</li><li><b>Neurovascular assessment (circ check)</b> — pulses below injury + sensation, movement, color, temperature, pain.</li><li><b>Osteoblasts</b> bone-forming; <b>osteoclasts</b> bone-destroying. <b>Osteomalacia</b> — adult bone softening from inadequate vitamin D. <b>Osteopenia</b> — decreased density with age. <b>Osteoporosis</b> — chronic disease of cellular regulation with significant decreased density and possible fracture.</li><li><b>Paget disease</b> — chronic metabolic disorder; bone fragile and misshapen.</li><li><b>Physical disability</b> — limitation in mobility/activity affecting ADLs (walking, transferring, bathing, toileting, dressing), often needing cane/wheelchair.</li><li><b>Polymyositis</b> — uncommon chronic rheumatic disease with inflammation of multiple muscles.</li><li><b>Synovial joints</b> — lined with synovium, which secretes synovial fluid for lubrication and shock absorption.</li></ul>
<h4>Skeletal System</h4><p>206 bones and multiple joints. Classified by shape (long bones e.g., femur — cylindric, weight bearing; short bones e.g., phalanges — little/no weight) and by structure: outer cortex = dense compact bone; inner medulla = spongy cancellous tissue. Structural unit of cortical bone = haversian system (canal network with microscopic vessels; lacunae house osteocytes). Cancellous trabeculae hold red marrow (hematopoiesis) and yellow marrow (fat cells — can dislodge → fat embolism syndrome, life-threatening). Periosteum's deepest layer has osteogenic cells → osteoblasts and osteoclasts.</p>
<h5>Table 41.1 — MSK Differences in Selected Ethnic Groups</h5><ul><li>Black: greater bone density than Whites, Asian/Pacific Islanders, Hispanics → ↓ osteoporosis.</li><li>Amish: greater incidence of dwarfism.</li><li>Chinese American: shorter, smaller bones, less density → ↑ osteoporosis.</li><li>Egyptian American: shorter than Whites and Black people.</li><li>Filipino/Vietnamese: short; adult height about 5 ft.</li><li>Irish American: taller and broader than other Whites; less density than Black people.</li></ul>
<p>Bone is very vascular: main nutrient artery enters near middle of shaft, branches up and down. Few nerve fibers: sympathetic fibers control vessel dilation; sensory fibers transmit pain from primary bone lesions (tumors).</p>
<h5>Function</h5><ul><li>Framework, weight bearing/upright</li><li>Supports surrounding tissues</li><li>Movement via muscle attachment and joints</li><li>Protects vital organs</li><li>Manufactures blood cells in red marrow</li><li>Stores mineral salts (Ca, P)</li></ul>
<p>Formation and resorption occur at equal rates until age 35; later resorption increases → ↓ bone mass, esp. older women. Bone holds ~99% of body calcium and 90% of phosphorus. Ca and P maintain an inverse relationship. Calcitonin (thyroid) ↓ serum Ca when elevated — inhibits resorption, ↑ renal excretion of Ca and P. Vitamin D promotes Ca/P absorption from small intestine and enhances PTH activity; deficiency → osteomalacia. Low Ca → ↑ PTH → osteoclastic activity releases Ca, ↓ renal excretion, ↑ intestinal absorption; high Ca → PTH ↓ (feedback loop). Adrenal glucocorticoids regulate protein metabolism and intestinal Ca/P absorption. Estrogens stimulate osteoblasts and inhibit PTH; decline at menopause → bone loss. Androgens (testosterone) promote anabolism, ↑ bone mass. Thyroxine ↑ protein synthesis incl. bone. Insulin + growth hormone build/maintain bone.</p>
<h5>Joints</h5><ul><li>Synarthrodial — immovable (cranium)</li><li>Amphiarthrodial — slightly movable (pelvis)</li><li>Diarthrodial (synovial) — freely movable (elbow, knee); most common; only type lined with synovium (does not extend onto cartilage surface)</li></ul><p>Articular cartilage = collagen matrix + ground substance. Arthritis → synovitis and cartilage breakdown. Ball-and-socket (shoulder, hip) move any direction; hinge (elbow) one plane; knee best described as condylar.</p>
<h5>Muscular System</h5><p>Skeletal muscle = striated voluntary, controlled by CNS/PNS; motor end plate = junction of motor nerve and muscle cells; fibers in fasciculi; fascia surrounds muscle. Aging ↓ fiber size and number. Tendons attach muscle to bone; ligaments attach bone to bone.</p>
<h4>Changes With Aging (Older Adult Box)</h4><ul><li>↓ Bone density → teach fall prevention; weight-bearing exercise (slows bone loss).</li><li>↑ Bony prominences → prevent pressure (less soft tissue).</li><li>Kyphosis, widened gait, shifted center of gravity → body mechanics, supportive chairs with arms, assess for cane/walker, supportive shoes.</li><li>Joint cartilage degeneration (OA) → moist heat (↑ blood flow, mobility).</li><li>↓ ROM → assess ADLs and mobility.</li><li>Muscle atrophy, ↓ strength → isometric & isotonic exercise.</li><li>Slowed movement → do not rush.</li></ul><p>Most common OA joints: hip, knee, cervical & lumbar spine (also shoulder, upper extremity, feet, hands). Aging → ↓ coordination, strength, gait changes, falls.</p>
<h4>Health Promotion</h4><p>Vitamin D and calcium supplements and dietary intake slow bone loss; weight-bearing activity (walking) and strengthening reduce osteoporosis risk. Young men: greatest risk of traumatic injury (motor vehicle/scooter) — use safely, avoid substances. Young/middle-aged adults: high-impact sports injuries. Older adults: falls. Tobacco (nicotine) slows bone healing. Excess alcohol ↓ vitamins/nutrients for bone and muscle.</p>
<h4>Assessment: History</h4><p>Mobility limitation = major cause of physical disability. Health equity: disability more common in older Hispanic, American Indian/Alaska Native and other racial groups vs Whites — social determinants (poverty, low education, unemployment). Ask about trauma/sports no matter when (lumbar injury 30 years ago; MVC → OA years later); pain management incl. cannabis. Diabetes + foot ulcer → high risk osteomyelitis; diabetes slows healing. Occupation (manual labor → fractures; computer work → carpal tunnel, neck pain). Allergies — dairy (↓ Ca); drugs (steroids → bone loss); supplements (glucosamine, chondroitin).</p>
<p>Nutrition: most women don't get enough Ca; weight change; 24-h recall; lactose intolerance; food insecurity. Inadequate protein or vitamin C/D slows healing. Obesity stresses joints, limits mobility → respiratory/circulatory complications. Anorexia/bulimia → osteoporosis risk. Family history: osteoporosis and gout run in families.</p>
<p>Current problem: date/time of onset; factors causing/worsening; course (intermittent/continuous); signs & symptoms and pattern; measures that improve (heat, ice). Most common reports = pain and/or weakness. Pain with movement → fracture/muscle/joint injury; rate with scale; quality dull/burning/aching/stabbing; location/radiation — patient's own words. Proximal weakness → myopathy; distal weakness + ↓ sensation → neuropathy.</p>
<h4>Physical Assessment</h4><p>Inspection, palpation, ROM. Posture, gait, general mobility; coordinate with PT/OT. Lordosis common with abdominal obesity; scoliosis common in children/young adults. Compare extremities side-to-side. Hand function is perhaps the most critical part: inspect/palpate MCP, PIP, DIP; active then passive ROM; quick test — make a fist, appose each finger to thumb. Note muscle size, shape, tone, strength; movement against resistance. Functional assessment with PT/OT (canes, walkers, transfers, ADLs). If patient can meet personal needs, ROM assessment not needed. Skin: redness/warmth → inflammation/pressure injury. Hip: assess mobility (deep joint); hip pain felt in groin or radiating to knee/low back. Knee: effusion easily detected; genu valgum (knock-knee), genu varum (bowlegged). Ankles/feet often neglected.</p>
<h5>Neurovascular Assessment (Action Alert)</h5><p>Beginning with injured side, compare extremities. Palpate pulses below the level of injury; assess sensation, movement, color, temperature, capillary refill, pain. If pulses not palpable, use Doppler.</p>
<h5>Psychosocial</h5><p>Job/career loss, chronic pain stress, anxiety & depression, body image (e.g., amputation); identify support systems and coping; refer for counseling if culturally appropriate.</p>
<h4>Diagnostic Assessment — Table 41.2 Laboratory Profile</h4><ul><li>Serum calcium 9.0–10.5 mg/dL (2.10–2.50 mmol/L); older ↓. ↑: bone mets, Paget, healing fx. ↓: osteoporosis, osteomalacia.</li><li>Serum phosphorus 3.0–4.5 mg/dL (0.97–1.45 mmol/L); older ↓. ↑: healing fx, bone tumors. ↓: osteomalacia.</li><li>ALP 30–120 U/L (40–160 IU/L); older slightly ↑. ↑: bone/liver mets, Paget, osteomalacia. Rises in proportion to osteoblastic activity.</li><li>CK total: men 55–170 U/L; women 30–135 U/L; CK-MM 96–100%. ↑: muscle trauma, muscular dystrophy, effects of EMG.</li><li>LDH total 100–190 U/L (older slightly ↑); LDH1 17–27%, LDH2 27–37%, LDH3 18–25%, LDH4 3–8%, LDH5 0–5%. ↑: skeletal muscle necrosis, extensive cancer, MD.</li><li>AST 0–35 U/L (older slightly ↑). ↑: skeletal muscle trauma, MD.</li><li>Aldolase 3.0–8.2 U/dL. ↑: polymyositis/dermatomyositis, MD.</li></ul><p>No special prep or follow-up for these tests. ↓ Ca could indicate bone density loss.</p>
<h4>Imaging</h4><ul><li><b>X-ray</b>: AP and lateral initial views; density, alignment, swelling, intactness; joint space, cartilage smoothness, synovial swelling.</li><li><b>CT</b>: vertebral column and joints; 3-D; ask about iodine contrast allergy; no other pre/post care.</li><li><b>MRI</b>: more accurate than CT for many spine/knee problems; best for joints and soft tissue. <b>MRA</b> (MR arthrography): shoulder/rotator cuff tears; contrast injected under fluoroscopy then MRI.</li><li><b>Ultrasonography</b>: soft-tissue masses/fluid, traumatic joint injury, osteomyelitis, hardware placement; no prep; QUS for fractures/bone density.</li><li><b>Bone scan</b>: detects tumors, arthritis, osteomyelitis, osteoporosis, vertebral compression fx, unexplained bone pain. Isotope given 4–6 h before scan (no other contrast/isotope tests during this time); scan 30–60 min lying still; may repeat at 24, 48, 72 h; excreted in stool/urine — no precautions; push fluids.</li></ul>
<h4>Other Diagnostics</h4><p><b>Bone biopsy</b> (needle/closed or incisional/open): confirms infection or neoplasm; not common today. Action Alert: watch for bleeding and for tenderness, redness, warmth (infection); mild analgesics. <b>Muscle biopsy</b>: atrophy (MD) or inflammation (polymyositis); same care.</p>
<p><b>Arthroscopy</b>: knee and shoulder most common; synovial biopsy and repair possible; ambulatory/same-day. Patient must have mobility in joint; not for immobile or infected joints. PT consult pre-op for exercises; informed consent. Local, light general, or epidural anesthesia; incision &lt; ¼ inch (0.6 cm); multiple incisions possible. <b>Priority after = neurovascular assessment</b> (distal pulses, warmth, color, cap refill, pain, movement, sensation). Diagnostic → mild analgesic (acetaminophen); surgical → short-term opioid combo (oxycodone + acetaminophen). Ice 24 h; elevate 12–24 h. Complications: swelling, severe joint/limb pain, thrombophlebitis, infection — contact provider immediately. Follow-up ~1 week.</p>
<h4>Essential Assessment Points</h4><ul><li>Bone is dynamic, vascular; continuous formation and resorption.</li><li>Three most common aging changes: ↓ bone density (osteopenia), joint cartilage degeneration, muscle atrophy.</li><li>Adequate calcium; avoid risky behaviors.</li><li>Disability more common in people of color — social determinants.</li><li>Most common symptoms: pain and weakness.</li><li>Compare extremities; mobility and functional assessment.</li><li>Anxiety, depression, body image issues common.</li><li>Teach arthroscopy patients to report severe/increased pain and swelling immediately.</li></ul>`});
SRC_CHAPTERS.push({id:'ch42',title:'Chapter 42 — Musculoskeletal Conditions (Osteoporosis, Osteomyelitis, Bone Tumors, Hand & Foot)',html:`
<h4>Concepts & Key Terms</h4><p>Priority: Mobility, Infection, Cellular Regulation (exemplar: Osteoporosis). Interrelated: Pain. Older adults at greatest risk for most; primary bone cancer most often in adolescents/young adults.</p><ul><li><b>BMD</b> — mineral amount determining bone strength; peaks 25–30 yr.</li><li><b>Bunionectomy</b> — removal of first metatarsal bony overgrowth and bursa with realignment.</li><li><b>DXA</b> — noninvasive radiographic scan of BMD.</li><li><b>Dupuytren contracture</b> — progressive thickening of palmar fascia → flexion contracture of 4th and 5th fingers.</li><li><b>Fragility fracture</b> — fracture caused by osteoporosis ("bone attack").</li><li><b>Ganglion</b> — round benign cyst on wrist/foot joint or tendon.</li><li><b>Hallux valgus</b> — great toe drifts laterally at first MTP joint.</li><li><b>Osteomyelitis</b> — bone infection (bacteria most often, viruses, parasites, fungi); acute or chronic.</li><li><b>Osteonecrosis (AVN)</b> — bone death from disrupted blood supply (trauma, chronic steroids).</li><li><b>Paget disease</b> — chronic, slowly progressive; rapid destruction and reformation → pain, arthritis, fractures, deformity.</li><li><b>Plantar fasciitis</b> — inflammation of plantar fascia (arch).</li></ul>
<h4>Osteoporosis — Pathophysiology</h4><p>"Silent disease" — often first diagnosed after a fracture; underdiagnosed and undertreated. Healthy People 2030: 50% of postmenopausal women will have a fragility fracture; 25% of men over 50. Any fracture → very high risk of future fracture, esp. women of color and Asian/Pacific Islander women. Osteomalacia = bone loss from lack of vitamin D → softening (no calcification). Osteoporosis/osteopenia occur when osteoclastic activity > osteoblastic → ↓ BMD. After peak years, resorption exceeds formation; fastest in postmenopausal women (estrogen does not build bone but prevents loss). Trabecular (cancellous) bone lost first, then cortical; hip, wrist, spine have most cancellous bone → fracture first.</p><p>T-score = SDs above/below young healthy adult mean (healthy 30-yr-old = 0). <b>Osteopenia: −1 and above −2.5. Osteoporosis: ≤ −2.5. Severe/established: osteoporosis + ≥1 fracture.</b></p><p>Generalized (many structures): primary (postmenopausal women; men in 7th–8th decade) vs secondary (hyperparathyroidism, long-term corticosteroids, prolonged immobility e.g. SCI — treat cause). Regional (localized) = secondary from limb immobilization (fracture, injury, paralysis) &gt; 8–12 weeks; also weightlessness (astronauts).</p>
<h5>Table 42.1 Osteoporosis vs Osteomalacia</h5><p>Definition: ↓ bone mass multifactorial vs softening from lack of calcification. Etiology: lack of Ca and estrogen/testosterone vs lack of vitamin D. X-ray: osteopenia, fractures vs fractures. Ca: low/normal both. Phosphate: normal vs low/normal. PTH: normal vs high/normal. ALP: normal vs high.</p>
<h5>Box 42.1 Risk Factors for Primary Osteoporosis</h5><p>Nonmodifiable: age &gt; 50; menopause or total hysterectomy with ovaries removed; parental (esp. mother) history; White or Asian; eating disorders (anorexia); rheumatoid arthritis; any fracture after age 50.<br>Potentially modifiable: low body weight/thin; chronic low Ca and/or vitamin D; estrogen or androgen deficiency; current smoking (active/passive); high alcohol (≥2 drinks/day); drugs such as chronic steroids; poor nutrition; lack of exercise or prolonged immobility.</p>
<h5>Genetics</h5><p>Vitamin D3 receptor (VDR) and calcitonin receptor (CTR) gene changes; BMP-2 gene changes in some with fractures; GH-1 gene alterations in petite Asian-American women. RANKL, its receptor RANK, and decoy receptor osteoprotegerin (OPG) control osteoclasts; disruption → rapid bone breakdown → basis for newer drugs.</p>
<h5>Gender</h5><p>Women after menopause/oophorectomy; obese women store estrogen → less osteoporosis. Men &gt; 50 — ↓ testosterone; underdiagnosed; should be screened.</p>
<h5>Nutrition</h5><p>Excess caffeine → urinary Ca loss. Low Ca/vit D → PTH releases Ca from bone. Malabsorption; homebound/institutionalized without sunlight. High phosphorus → faster Ca loss; &gt; 40 oz (1200 mL) carbonated beverages/day → high risk. 50% of serum Ca is protein bound (protein needed), but excess protein (Atkins) ↑ urinary Ca loss.</p>
<h5>Incidence & Equity</h5><p>&gt; 54 million Americans have osteoporosis or osteopenia; 1 in 10 over 50 has osteoporosis. Most often older lean White women who don't exercise. Dark-skinned individuals at risk for ↓ vitamin D; lactose intolerance (lactose-free, almond, soy milk — costly). Black, Asian/Pacific Islander, Hispanic groups receive less screening/treatment — lack of access, lower education, lower SES. Veterans often have osteopenia/osteoporosis diagnosed after low-trauma fracture — screen all veterans.</p>
<h5>Healthy People 2030 Objectives</h5><ul><li>Reduce proportion of adults with osteoporosis.</li><li>Increase screening in older adults.</li><li>Reduce hip fractures among older adults.</li><li>Increase treatment after fracture.</li></ul>
<h5>Prevention</h5><p>Dairy and dark green leafy vegetables; read labels; consider food insecurity. Sun exposure without burning; vitamin D. Smoking cessation, weight loss, avoid excess alcohol, limit carbonated drinks. Weight-bearing exercise (walking); avoid jarring (horseback riding, jogging) → vertebral compression fx. Postmenopausal women and men &gt; 50 request screening; Medicare pays BMD testing every 2 years for &gt; 65; people of color and Asian descent screened by 50.</p>
<h5>Assessment</h5><p>Fall risk assessment. Kyphosis ("dowager's hump"); height loss 2–3 inches (5–7.5 cm) in 20 years (up to 6 in, Fig. 42.1); measure height/weight. NPSG fall prevention (armbands, signs). Back pain after lifting/bending/stooping, worse with activity, relieved by rest; tenderness + voluntary restriction → compression fractures (most common and painful fragility fx). Severe deformity → constipation, abdominal distention, reflux esophagitis, respiratory compromise. Spinal fx most likely T8–L3. Also distal radius (wrist) and upper third of femur (hip). Psychosocial: body image, clothing, social avoidance, sexuality, fear of falling, depression, insomnia.</p>
<h5>Labs & Imaging</h5><p>Serum Ca (9.0–10.5 mg/dL) and vitamin D3 at least yearly for women and men &gt; 50 at high risk; total 25-hydroxyvitamin D 25–80 ng/mL (75–200 nmol/L). No definitive lab for primary osteoporosis; bone turnover markers (osteocalcin, BSAP). X-ray shows density loss only after large loss. BHOF: all postmenopausal women and men ≥ 50 evaluated. DXA most common screening/diagnostic test (spine, hip; wrist if spinal deformity); baseline in 40s often recommended; less radiation than CXR; limitations (no cellular info, system variation, very tall/obese). Height measured before; remove metal; stay dressed; no follow-up care; repeat DXA every 2 years with osteopenia/osteoporosis. QCT/pQCT/HR-pQCT — more radiation. Vertebral imaging indicated: women ≥ 70 and men ≥ 80 if T ≤ −1.0; women 65–69 and men 70–79 if T ≤ −1.5; ≥ 50 with height loss, low-trauma fracture, long-term steroids. Quantitative MRI: marrow fat (BMAT) ↑, perfusion ↓ — expensive. Community screening: pDXA (heel, forearm, finger), pQUS (heel, tibia, patella; no radiation).</p>
<h5>Analysis / Planning</h5><p>Priority problem: potential for fractures due to weak, porous bone. Outcome: avoid fractures via fall prevention, risk-factor management, adherence.</p>
<h5>Interventions</h5><p>Nutrition: Ca and vitamin D; avoid excess alcohol/caffeine; fortified soy/rice products; fruits, vegetables, low-fat dairy, protein, fiber. Exercise: abdominal/back strengthening, deep breathing, pectoral stretching, ROM, resistive; swimming, yoga; <b>walking 30 minutes 3–5 times a week = single most effective exercise</b>; avoid jarring. Avoid all tobacco. Alcohol: women ≤ 1 drink/day (5 oz), men ≤ 2.</p>
<h5>Drug Therapy</h5><p>Treat postmenopausal women and men ≥ 50 when hip or lumbar T-score ≤ −2.5 with no other risk factors, or &lt; −1.5 with risk factors or previous fracture; anyone ≥ 50 with hip or vertebral fracture. Classes: bisphosphonates, estrogen agonist/antagonists, PTH, RANKL inhibitor, sclerostin inhibitor, combinations.</p><p>Bisphosphonates = most common for osteopenia; antiresorptive (bind crystal elements, esp. cancellous bone); some approved for Paget and hypercalcemia of cancer. Drug Alert: IV zoledronic acid once a year; IV pamidronate every 3–6 months; flu-like symptoms esp. first dose; jaw osteonecrosis (low incidence). Oral: early morning with 8 oz water, wait 30–60 minutes upright before eating; chest discomfort → stop, call provider. Not for poor renal function, hypocalcemia, GERD. Oral exam/preventive dentistry first; tell dentist. Not lifelong: esophageal cancer, AFib, jaw osteonecrosis, severe MSK pain; decision at 2 years by DXA — discontinue if maintained/increased; continue up to 5 years if still losing.</p>
<p><b>Table 42.2</b> — Calcium with vitamin D: ⅓ of daily dose at bedtime; ↑ fluids; take with 6–8 oz water; assess urinary stone history; monitor Ca; hypercalcemia signs (deposits under skin, dysrhythmias, muscle tone changes, stones); check dose with provider. Bisphosphonates (alendronate, ibandronate, risedronate, pamidronate IV, zoledronic acid IV): empty stomach first thing with full glass water; 30 min before food/drink/drugs; upright 30 min; dental exam; not with aspirin sensitivity (bronchoconstriction); IV infuse 15–30 min (AFib); creatinine before and after IV (AKI). Raloxifene: teach VTE signs esp. first 4 months; monitor LFTs. Denosumab: report new MSK/back pain and skin reactions; report infection; monitor Ca, Mg, P (severe hypocalcemia, esp. renal impairment); dental exam.</p>
<p>Denosumab SubQ twice a year by a professional; inhibits osteoclast-mediated resorption. Romosozumab — first sclerostin inhibitor; antiresorptive + anabolic; not after stroke/MI in past 12 months; only women who can no longer become pregnant; avoid with hypocalcemia. Teriparatide and abaloparatide — PTH-related protein drugs; build bone; daily SubQ; not long-term; for previous fracture/multiple risks. Postmenopausal T &lt; −2.5: romosozumab 1 year or teriparatide/abaloparatide 2 years, followed by antiresorptive.</p>
<h5>Care Coordination & Evaluation</h5><p>Managed at home unless major fracture. Follow-up DXA; drug holidays with rescans. Home safety: ramps, handrails, no clutter, no slippery floors, rubber-soled shoes, no scatter rugs. Sun ≥ 5 minutes daily = most important vitamin D source. Adherence problems → more fractures and costs. Resources: Bone Health and Osteoporosis Foundation; Osteoporosis Society of Canada. Outcomes: DXA follow-up, lifestyle changes, no fragility fracture.</p>
<h4>Osteomyelitis</h4><p>Can cause chronic recurrence, loss of function, chronic pain, amputation, death (sepsis). Cycle (Fig. 42.2): pathogen invasion → inflammation → ↑ vascularity → edema → vessel thrombosis → ↓ blood flow → bone necrosis (sequestrum) → bone abscess → superimposed infection → repeat. Osteoblasts lay new bone over infection → drugs can't penetrate.</p><p>Categories: exogenous (open fracture, surgery), endogenous/hematogenous (bloodstream), contiguous (adjacent skin infection). Acute or chronic. Hematogenous: bacteremia, underlying disease, nonpenetrating trauma; UTIs in older men → lower vertebrae; long-term IV catheters; hemodialysis; IV drug use; Salmonella (sickle cell disease). Poor dental hygiene → facial bones. S. aureus most common; MRSA/MDROs — common from SSIs and implanted devices (ORIF). Older adults: slow-healing foot ulcers, multiple organisms. Penetrating trauma (bites, punctures, bone surgery) → Pseudomonas aeruginosa most common. Chronic from misdiagnosis/inadequate treatment; about half of chronic cases gram-negative.</p>
<h5>Box 42.2 Acute vs Chronic</h5><p>Acute: fever usually &gt; 101°F (38.3°C); swelling; possible erythema and heat; tenderness; constant, localized, pulsating bone pain worse with movement. Chronic: foot ulcer(s) or bone surgery; sinus tract; localized pain; drainage (bone abscess). Older adults may lack high fever. Severe vascular compromise → may have no pain. Assess distal circulation; ulcers indicate poor healing.</p>
<h5>Diagnostics & Treatment</h5><p>WBC may be double normal; ESR normal early, rises, may stay ↑ 3 months after therapy (monitors effectiveness). Aerobic and anaerobic blood cultures before drug therapy; radionuclide scans or MRI. Surgical débridement + local antimicrobial; ≥ 6 weeks IV antimicrobials by culture, then oral 4–8 weeks. Contact Precautions with copious drainage. Give on schedule for therapeutic levels; teach home administration; SNF for IV if needed. MRSA: IV vancomycin, IV daptomycin, linezolid (IV/oral — oral lets older pts stay home). Chronic: &gt; 3 months therapy, PICC. Pain management. Hyperbaric oxygen for chronic unremitting infection (tertiary centers) with drugs and débridement.</p>
<h4>Bone Tumors</h4><p>Benign often asymptomatic, found on x-ray or pathologic fracture; osteochondroma most common benign (childhood onset, grows to skeletal maturity; femur and tibia). Malignant: primary (age 10–30, small %) or secondary/metastatic (older, most adult bone cancers). Osteosarcoma — most common primary malignant; &gt; 50% distal femur, then proximal tibia, humerus; large, painful, swollen, warm; sclerotic center; "sunburst" on x-ray; metastasizes. Ewing sarcoma — most malignant; pain, swelling, low-grade fever, leukocytosis, anemia; pelvis & lower extremity; pelvic = poor prognosis; lung mets; children and young adults. Bone-seeking cancers: prostate, breast, kidney, thyroid, lung → vertebrae, pelvis, femur, ribs.</p><p>Assessment: pain most common (mild to severe; unrelenting in metastatic disease esp. with movement); local swelling; atrophy/spasm; disability. Psychosocial: young adults, loss of control, grief, denial, coping. X-ray, CT, MRI; needle biopsy under fluoroscopy; TNM staging. Labs: ↑ ALP; anemia & leukocytosis (Ewing, mets); ↑ LDH (Ewing progression); ↑ Ca (mets from breast, kidney, lung); ↑ ESR.</p><p>Interventions: benign/small primary → removal for cure; metastatic → palliation. Nonsurgical: analgesics, chemo (Ewing sensitive; chondrosarcoma resistant; best for small tumors; all chemo = high-alert), radiation (Ewing, early osteosarcoma; palliation), bracing for spinal mets. Hormone blockers for breast mets; cytokines for renal cancer. Zoledronic acid and pamidronate for bone mets from breast, lung, prostate (ONJ; monitor creatinine/electrolytes — AKI). Denosumab also for metastatic disease. Microwave ablation for spinal mets. Surgical: wide excision (low-grade) vs radical resection (high-grade); allograft with internal fixation (proximal femur, knee); pressure dressing + wound suction several days; CPM from POD 1; quadriceps strengthening; weight bearing toe-touch/partial → full by 2–3 months; bone graft → no weight bearing until incorporated. Home: remove hazards (pathologic fx), keep chemo/radiation appointments, IV catheter care, wound care, pain options (relaxation, music), fear of recurrence, palliative/hospice care. Medical aid in dying legal in 10 states, DC, and 9 countries — nurses provide information and support but cannot directly assist. Support: I Can Cope, CanSurmount, ACS, Canadian Cancer Society.</p>
<h4>Hand Disorders</h4><p>Dupuytren: 4th & 5th fingers (occasionally 3rd); older White men; familial; diabetes; may be bilateral. S&S: can't grasp, can't lay hand flat, hard collagen cords. Xiaflex injection into cord → finger straightened next day under local; not painful; no OT needed. Or partial/selective fasciectomy → splint + OT ≥ 6 weeks. Ganglion: synovium degeneration; painless on palpation; can disappear and recur; ages 15–50; aspiration ± cortisone; large → excision; avoid strenuous activity 48 h; report inflammation.</p>
<h4>Foot Disorders</h4><p>Hallux valgus: bunion; women more; narrow-toed high-heeled shoes, OA, RA, surgery, family history. Custom shoes (plaster molds) for non-surgical candidates. Surgery = treatment of choice: bunionectomy ± osteotomies/fusions, screws/wires; one foot at a time; same-day; assess NV and pain before discharge; no full weight bearing until cleared; orthopedic boot while awake; healing ≥ 12 weeks (feet get less blood flow). Lapiplasty (minimally invasive): better stabilization, boot 2–6 weeks, weight bearing 2–3 days. Plantar fasciitis: middle-aged/older, athletes (runners), obesity; severe arch pain esp. getting out of bed, worse with weight bearing; rest, ice, stretching, strapping, supportive shoes, orthotics, NSAIDs/steroids; endoscopic surgery if conservative fails.</p>`});

<h4>Concepts & Key Terms</h4><p>Priority: Mobility (exemplar OA), Immunity (exemplar RA). Interrelated: Pain, Inflammation. Arthritis categorized clinically as noninflammatory or inflammatory.</p><ul><li><b>Arthrocentesis</b> — aspirate synovial fluid for analysis and pressure relief.</li><li><b>Crepitus</b> — grating sound from loosened bone and cartilage.</li><li><b>Exacerbations</b> — flare-ups alternating with remissions.</li><li><b>Gout</b> — inflammatory response to hyperuricemia.</li><li><b>Joint coach</b> — family care partner through perioperative period.</li><li><b>Joint effusion</b> — excess joint fluid, esp. knee.</li><li><b>Mobility technician</b> — trained assistant who ambulates patients.</li><li><b>Orthopedic patient navigator</b> — nurse single point of contact.</li><li><b>Osteoarthritis</b> — progressive deterioration and loss of articular cartilage and bone.</li><li><b>Osteophytes</b> — bone spurs. <b>Paresthesias</b> — burning/tingling.</li><li><b>Peripheral nerve block (PNB)</b> — single injection or continuous pump (CFNB).</li><li><b>Primary arthroplasty</b> first-time; <b>revision</b> replaces loosened/failed implant.</li><li><b>Quad sets</b> — straighten legs, push back of knees into bed (↓ DVT).</li><li><b>Regenerative therapies</b> — stem cells, PRP.</li><li><b>RA</b> — chronic, progressive, systemic inflammatory autoimmune disease primarily of synovial joints.</li><li><b>Sjögren syndrome</b> — dry eyes (KCS/sicca), dry mouth (xerostomia), dry vagina.</li><li><b>Subcutaneous nodules</b> — soft, round, movable, ulnar side of arm.</li><li><b>Subluxation</b> — partial dislocation. <b>Synovitis</b> — synovium inflammation. <b>Vasculitis</b> — vessel wall inflammation.</li><li><b>TJA/TJR</b> — surgical creation of a functional synovial joint using implants.</li></ul>
<h4>Osteoarthritis</h4><p>Most common arthritis; major cause of impaired mobility, persistent pain, disability. Pathophysiology: ↓ proteoglycans and water; ↓ synovial fluid (↓ hyaluronic acid synthesis); stromelysin breaks down matrix; cartilage bluish-white translucent → opaque yellowish-brown; erosion, joint space narrows, osteophytes; fissures, calcifications, ulcerations; IL-1 enhances; secondary synovitis (red, warm, painful, swollen); fragments "float" → crepitus; pain/stiffness → ↓ mobility, atrophy.</p><p>Etiology: primary — aging, genetics (hips, knees, spine, hands). Secondary — joint injury, obesity, heavy manual occupations (carpet laying, construction, farming), athletes (football, runners, gymnasts), fractures years earlier, metabolic disease (DM, Paget), blood disorders (hemophilia, sickle cell). Obesity much more common in OA. Most &gt; 60 have x-ray changes; &gt; 33 million symptomatic in US; 5th most common cause of disability worldwide. Men &gt; women under 55 (athletic/trauma); women &gt; men after 55. Military: almost all from combat injury; twice as common under 40; associated with obesity, DM, HTN, PTSD, depression, anxiety.</p>
<h5>Box 43.1 Healthy People 2030</h5><ul><li>Reduce adults with arthritis causing moderate/severe joint pain.</li><li>Reduce adults whose arthritis limits work.</li><li>Reduce adults whose arthritis limits activities.</li><li>Increase counseling for physical activity.</li></ul><p>Teach: nutrition/weight reduction; avoid injuries; avoid risky behaviors; work breaks; stay active.</p>
<h5>Assessment</h5><p>Questions: where/how long stiffness; swelling; discomfort; disruption of life; control measures; loss of mobility/ADLs. Older patients underreport pain. Ask occupation, injuries, falls, weight history, sports/military, family history. Typical: middle-aged or older woman, chronic joint pain and stiffness — early relieved by rest, later with slight motion or at rest. Cartilage has no nerves — pain from joint/soft tissue, spasm, synovitis. Hip OA → groin pain referred to thigh, back, knee, buttock. Crepitus; stiffness &lt; 30 minutes after inactivity. Knees enlarged, hard (bony hypertrophy); effusions with synovitis. About half with hand involvement: Heberden (DIP) and Bouchard (PIP) nodes — bilateral, esp. women; may be red/painful; familial; cosmetic concern. Atrophy, contractures; limp. Spine: L3–4 or C4–6; facet spurs → nerve root compression → radiating pain, stiffness, spasms.</p>
<h5>Table 43.1 RA vs OA</h5><p>Onset: 35–45 vs &gt; 60. Gender: F 2–3:1 vs F 2:1. Cause: autoimmune (genetic), emotional stress triggers flares, environment vs aging, possible genetics, obesity, trauma, occupation. Process: inflammatory vs degenerative with secondary inflammation. Pattern: bilateral symmetric multiple, upper extremities first, DIP spared, systemic vs may be unilateral single, weight-bearing joints/hands/spine, MCP spared, nonsystemic. Labs: ↑ RF, ANA, ESR vs normal/slightly ↑ ESR. Drugs: NSAIDs short-term, methotrexate, biologics vs NSAIDs short-term, acetaminophen, other analgesics.</p>
<p>Psychosocial: lifestyle change, disability, role change, sexuality, depression, anxiety, body image. Labs usually normal; ESR and hsCRP slightly ↑ with synovitis (ESR also ↑ with age and infection). X-rays; MRI for vertebral/knee.</p>
<h5>Priority Problems</h5><ol><li>Persistent pain due to joint swelling, cartilage deterioration, secondary inflammation</li><li>Potential for ↓ mobility due to pain and atrophy</li></ol><p>OARSI 2019 guidelines; Arthritis Foundation self-management. Outcome: pain 2–3 or less on 0–10. No drug alters OA course; multimodal approach.</p>
<h5>Drug Therapy</h5><p>Regular acetaminophen or NSAIDs primary. Drug Alert: acetaminophen ceiling 4000 mg/day; liver risk &gt; 3000 mg/day, alcoholism, liver disease; older adults; read labels; liver enzymes. Diclofenac 1% gel for mild–moderate knee OA: dosing card; no heat; no other NSAID; ≥ 2 weeks to effect. Oral NSAIDs (COX-2 nonselective/selective) if needed; not with history of stroke/MI; baseline CBC, CMP; celecoxib preferred unless HTN, kidney disease, CV history. Drug Alert: COX-2 drugs → MI, HTN (vasoconstriction, platelet aggregation); all NSAIDs → GI effects, bleeding, AKI long-term; lowest dose; celecoxib with food; report tarry stools, SOB, edema, dyspepsia, hematemesis, urine changes. Intra-articular corticosteroid and hyaluronic acid (ask egg/poultry allergy) for knee; once or several times over months.</p>
<h5>Nonpharmacologic</h5><p>Rest balanced with exercise, positioning, heat/cold, weight control, gait aids. Structured exercise for hip/polyarticular OA; aquatic for knee OA. Functional position: small pillow under head only — large pillows under knees/head → flexion contractures; posture; supportive shoes, insoles. Heat: showers, hot packs, moist heating pads — not too heavy/hot; just above body temperature. PT: paraffin dips, diathermy, ultrasonography; 15–20 minutes. Cold limited use. Gradual weight loss. Regenerative: stem cells, PRP (growth factor → cartilage regeneration). Capsaicin: blocks substance P; burning; plastic gloves; wash hands. Glucosamine/chondroitin: inconsistent evidence; not in OARSI. Medical cannabis: growing evidence. Health equity: older African Americans — more severe OA pain, less prescription medication or surgery.</p>
<h4>Total Joint Arthroplasty</h4><p>Indicated when conservative measures fail, mobility restricted, quality of life not maintained. Hip and knee most common; shoulder/ankle increasing. Also for RA, congenital anomalies, trauma, osteonecrosis (femoral/humeral head, distal femur, proximal tibia). Contraindications: active infection anywhere, rapidly progressive inflammation; stabilize uncontrolled DM/HTN; smoking cessation. Orthopedic patient navigator: evidence-based expertise, continuum of care, advocate/educator, data for outcomes.</p>
<h5>THA — Preoperative</h5><p>Assess understanding; joint coach; Joint Academy/Camp. Evidence (Jones 2022, 707 pts, level 3): preop PT classes → shorter LOS (~$1000 saved), more flexion, longer ambulation. Health literacy: materials in appropriate language; interpreter at each appointment. Prehab: exercises, transfers, walker/crutches. Delirium risk screening (safety sitters). ERAS ("fast track") → shorter LOS, fewer readmissions. RA patients: cervical spine x-ray before general anesthesia (subluxation during intubation). CT/MRI for robotic THA. Morning meds with sip of water (antihypertensives, thyroid, antidiabetics); stop NSAIDs and anticoagulants/antiplatelets 5–10 days before.</p>
<h5>Box 43.2 Preoperative Education (THA)</h5><ul><li>Nutrition: assess for malnutrition (prolonged rehab, complications); RDN.</li><li>Pain: assess preop opioid use; teach multimodal options.</li><li>VTE: anticoagulant starting within 24 h after surgery, ≥ 14 days; interrupt anticoagulants/antiplatelets 5–10 days pre-op; frequent mobilization (also prevents constipation); compression stockings/SCDs.</li><li>Infection: IV antibiotic before and possibly up to 24 h after; nares S. aureus screening 2–4 weeks before; mupirocin twice a day × 1 week (or longer); CHG bath at least night before and morning of; clean linens, no lotions/powders, no pets in bed.</li></ul>
<h5>THA — Operative</h5><p>IV cephalosporin (cefazolin/cefuroxime) within 1 hour before incision (SCIP); β-lactam allergy → vancomycin or clindamycin 2 hours before. Anesthesia: general, neuraxial, regional blocks (relief up to 24 h), with moderate sedation. TXA reduces blood loss, improves H&H, fewer transfusions. Prevent hypothermia (↑ blood loss, infection, cardiac events; low BMI highest risk). MIS: ~4-inch incision vs 6–12 inches; not for obese/osteoporosis; primary only; less damage, pain, blood loss, shorter stay. Hip resurfacing: younger, early cartilage loss; cap over femoral head. Components: acetabular and femoral. Noncemented (press-fit) for younger; cemented with polymethyl methacrylate (often with antibiotic); hybrid = cemented femoral + noncemented acetabular. Drains not commonly used. Noncemented: protected weight bearing for ingrowth; cemented: cement can fracture → loosening → revision (worse outcomes, esp. obese). Approaches: anterior — no muscle detachment, least dislocation, quickest recovery; direct lateral and posterolateral — cut muscle, severe pain, high dislocation risk; posterolateral highest and seldom used.</p>
<h5>THA — Postoperative</h5><p>Stay ~3 days (ERAS shorter; some overnight; goal same-day). Complications: dislocation (common), VTE, infection, immobility. Action Alert: correct positioning; supine, head slightly elevated; 1–2 bed pillows to keep legs abducted for lateral approaches; abduction device straps loosened q2h and skin checked; neutral rotation; turning per policy (operative side splints; nonoperative side needs full leg support to prevent adduction). Older adult box: abduction pillow/splint for posterolateral/lateral approach, esp. restless/confused; heels off bed; infection without fever — watch mental status, WBC; move slowly (orthostatic hypotension); deep breathe, cough, IS q2h; OOB to recliner on surgical day; anticipate pain; reorient. Dislocation signs: sudden intense pain or agitation, leg rotation, shortening → closed reduction under sedation or OR. NV checks with vital signs; compare legs; report changes.</p><p>VTE = most potentially life-threatening and common complication; PAC (pharmacology, ambulation, compression). LMWH (enoxaparin, dalteparin), fondaparinux SubQ, rivaroxaban/apixaban PO — no PT/INR monitoring; warfarin requires it. Ambulate ≥ 3 times/day; heel pumps, circumduction, gluteal and quad sets, straight-leg raises. SCDs (hot/bulky) or antiembolism stockings (less effective). Incision & vitals q4h × 24 h then q8–12h; infection signs by 2–3 days; older adults → delirium; culture drainage. Pain: multimodal; short-term PCA or IV push morphine/hydromorphone; oral PCA oxycodone; CPNB (bupivacaine, ropivacaine), NSAIDs (ketorolac, celecoxib), NMDA antagonist (ketamine), gabapentinoids; cryotherapy, music. Mobility: OOB night of surgery; Action Alert — gait belt, stand on affected side, patient stands on unaffected leg and pivots; do not lift. Mobility technicians. Cemented → WBAT; noncemented → minimal then PWB → FWB over weeks with x-ray ingrowth. Walker (crutches younger); single cane/crutch at 4–6 weeks if no severe limp; right hip → longer before driving. Medicare requires 3-day qualifying stay for skilled rehab. Complete recovery ≥ 6 weeks. Readmission causes: DVT, stroke, SSI, pneumonia, sepsis — highest risk older men with HF, DM.</p>
<h5>Box 43.3 Discharge Teaching (THA)</h5><ul><li>No prolonged sitting/standing; don't cross legs beyond midline; posterolateral/lateral: no hip flexion &gt; 90°; anterior: don't hyperextend leg behind; don't twist; use walker; assistive devices (sock aids, shoehorns, dressing sticks); weight-bearing limits; call 911 for dislocation (sudden difficulty bearing weight, shortening/rotation, "pop" with intense pain); resume intercourse per surgeon.</li><li>Pain: report ↑ hip/anterior thigh pain; analgesics as needed; rest; ice/cryotherapy.</li><li>Incision: dressing instructions (clear dressings, skin sealant); inspect daily for redness, heat, drainage; don't bathe incision; shower per surgeon.</li><li>Other: continue walking/leg exercises; don't cross legs (clots); report leg pain/redness/swelling; 911 for chest pain/SOB (PE); bleeding precautions (no straight razor); outpatient PT; surgeon follow-up.</li></ul>
<h5>TKA</h5><p>Driven by OA and obesity; also RA, posttraumatic arthritis; revision for failed primary. Unilateral usually; simultaneous bilateral (BTKA) or within 3–6 months. Ambulatory surgery center for selected pts. Partial knee/MIS for younger with limited cartilage loss; contraindicated with severe bone loss, obesity, previous knee surgery. Preop similar to THA (no dislocation precautions). ERAS nutrition screening; surgeon may request losing ≥ 20 lb. Bariatric history → anemia, bone loss. Prehab; elevated toilet seat, handrails, long-handled shoehorn. Persistent preop pain (anxiety, depression, SUD, long-term opioids) → best practices: identify at-risk, build trust, comprehensive assessment, multimodal, pain team, manage mental health, plan continuing management. CHG night before + morning; mupirocin ≥ 1 week; stop NSAIDs/anticoagulants 5–10 days.</p><p>Operative: general or neuraxial; femoral nerve block (single or CFNB); ketorolac periarticular injection ↓ pain, improves mobility. Cefazolin/cefuroxime within 60 min before incision and tourniquet inflation; fluoroquinolone or vancomycin begin 2 h (120 min) before. Incision 6–8 in; femoral often press-fit, tibial cemented. Blood loss: tourniquet (↑ post-op pain), fibrin sealants, TXA (strongest evidence). Compression dressing toes to thigh. Robotic/computer guidance.</p><p>Critical Rescue (CFNB): NV q2–4h; dorsiflexion/plantar flexion without lower-leg pain; LAST signs — metallic taste, tinnitus, nervousness, slurred speech, bradycardia, hypotension, ↓ respirations, seizures → report to surgeon/anesthesia/RRT. Neutral position; no pillow under knee; don't hyperextend. Cryotherapy (ice/gel compression, circulating cold water); knee very swollen/discolored for weeks; analgesics longer than THA; IV acetaminophen for some younger; music therapy. Anticoagulant within 24 h, ≥ 14 days (fondaparinux, apixaban, dabigatran, rivaroxaban, low-dose UFH, LMWH); SCDs/stockings. Discharge goal: walk with walker/crutches, flexion adequate for stairs; WBAT unless noncemented; 1–3 days acute care; home PT 1–2 weeks; stationary bike or CPM; return to activities ~6 weeks; ≥ 6 weeks recovery, longer &gt; 75. Readmission: infection and VTE — women with longer stays discharged to rehab/SNF highest risk.</p>
<h5>Shoulder & Other</h5><p>TSA: glenohumeral joint; hemiarthroplasty alternative; abduction immobilizer — don't remove unless instructed; dislocation, infection, NV compromise; NV checks q4–8h; shorter stay, may be same-day; OT rehab several months.</p>
<h5>Improving Mobility</h5><p>Box 43.4: follow individualized exercises; do them on good and bad days; respect pain (fewer reps when inflamed); active rather than passive; don't substitute housework; avoid resistive exercise with severe inflammation. Exercise right after heat. Aquatic, aerobic (walk, bike, swim, dance). PT for gait aids; OT for ADLs. Box 43.5 (physical disability): assess mobility/ADL/IADL; refer PT/OT; ambulate daily; coping; preventive screenings; social determinants. Home: one-floor living; shower seat, handrails; elevated toilet seat several weeks after THA/TKA; remove throw rugs. Box 43.6 joint protection: large joints (purse strap on shoulder); turn doorknob counterclockwise; two hands; high straight-backed chair; push up with palms not fingers; bend knees not waist; long-handled devices; Velcro, built-up utensils; only a small pillow under head; rubber grip for jars, no wringing. Quackery: copper bracelet harmless; refer to Arthritis Foundation. Written instructions; hand-off (NPSG). Outcomes: pain 2–3; no TJA complications; independent function.</p>
<h4>Rheumatoid Arthritis</h4><p>RFs (autoantibodies) attack synovium → inflammation → cartilage, capsule, ligaments, tendons. CD4 T cells release IL-1 and TNF-α; neutrophils break down cartilage; immune complexes; osteoclasts activated; B and T cells ↑ response. Synovium thickens, hyperemic; effusion; pannus (vascular granulation tissue) erodes cartilage and bone → fibrous adhesions, bony ankylosis, calcifications, secondary osteoporosis. Early aggressive treatment may achieve remission. Vasculitis → organ failure. Etiology: environment + genetics; female hormones; Epstein-Barr virus; physical/emotional stress triggers. HLA-DR4 (more severe) and DRB1. &gt; 1.5 million; Whites more often; women 2–3×. Health equity: higher prevalence in African Americans with less than high school education and low income. Onset more common in winter.</p>
<h5>Box 43.7 Key Features</h5><p>Early — joint: inflammation; systemic: low-grade fever, fatigue, weakness, anorexia, paresthesias. Late — joint: deformities (swan neck, ulnar deviation), moderate–severe pain and morning stiffness; systemic: osteoporosis, severe fatigue, anemia, weight loss, atrophy, subcutaneous nodules, peripheral neuropathy, vasculitis, pericarditis, fibrotic lung disease, Sjögren, kidney disease.</p><p>Early: weight loss 2–3 lb (1 kg); PIP and MCP first; bilateral symmetric. One hot swollen joint out of proportion = infected until proven otherwise → immediate referral, long-term antibiotics. Advanced: morning stiffness for hours; soft puffy joints; spindlelike fingers; TMJ uncommon. Critical Rescue: cervical subluxation (C1–C2) → phrenic nerve compromise, quadriparesis/quadriplegia — keep neck straight/neutral, notify RRT. Late deformity; carpal tunnel from wrist involvement; Baker cysts; Achilles rupture. Nodules on ulnar forearm, fingers, Achilles (severe disease; may ulcerate; occasionally lungs). Vasculitis: small brownish spots around nail beds — count daily (more = worse); LE lesions → slow-healing ulcers; neuropathy → footdrop, paresthesias. Respiratory: pleurisy, pneumonitis, interstitial fibrosis, pulmonary HTN. Cardiac: pericarditis, myocarditis. Eyes: iritis, scleritis (red sclera, irregular pupils). Sjögren triad; "gritty" eyes.</p>
<h5>RA Labs & Diagnostics</h5><p>RF (IgG/IgM) positive &gt; 1:80 — not diagnostic. Anti-CCP — specific, sensitive for early RA; marker of aggressive erosive disease. ANA (FANA) positive &gt; 1:40. ESR &gt; 20 mm/hr — monitors course. hsCRP more sensitive; detects infection. CBC: mild–moderate anemia; ↑ WBC inflammation; ↓ WBC may indicate Felty syndrome ("a pulmonary complication associated with late RA"); thrombocytosis. X-ray; CT for cervical spine; arthrocentesis (↑ WBC, cloudy, ↑ volume; ice and rest 24 h; acetaminophen; report ↑ pain/swelling); MRI; nerve conduction; PFTs.</p>
<h5>Priority Problems</h5><ol><li>Chronic inflammation and persistent pain</li><li>Potential ↓ mobility (deformity, atrophy, fatigue)</li><li>Potential ↓ self-esteem</li></ol>
<h5>RA Drug Therapy</h5><p>NSAIDs early (with H2 blocker famotidine); change if no effect in 6–8 weeks. DMARDs early. Methotrexate: low once-weekly dose; mainstay; 4–6 weeks onset; monitor ↓ WBC/platelets, ↑ liver enzymes, creatinine. Drug Alert: infection risk — avoid crowds/ill; avoid alcohol (liver); report mouth sores, acute dyspnea (pneumonitis); lymphoma rare; folic acid ↓ side effects; no pregnancy — strict birth control; stop ≥ 3 months before planned pregnancy; restart after birth if not breastfeeding. Hydroxychloroquine: antimalarial for mild disease; well tolerated (mild GI, light-headedness, headache); not with cardiac disease/dysrhythmias; Drug Alert: retinal damage — eye exam before and every 6 months, report blurred vision/headache. BRMs (interleukins, TNF inhibitors, monoclonal antibodies): expensive; infection risk; not with MS, TB, positive TB test; PPD before start; mostly parenteral. JAK inhibitors newest.</p><p>Table 43.2: TNF inhibitors (etanercept, infliximab, golimumab) — etanercept injection-site reaction; report infection. IL-6 antagonists (anakinra, tocilizumab) — monitor WBC (marked ↓), liver enzymes. JAK inhibitors (tofacitinib, baricitinib, upadacitinib) — tofacitinib black box: cardiac events, cancer, blood clots; report infection. Sulfasalazine combination (no sulfa allergy; nausea, vomiting, rash). Prednisone: pulse, low chronic, or bridge therapy; chronic → DM, ↓ immunity, F&E imbalance, HTN, osteoporosis, glaucoma. Single-joint cortisone injections → ice and rest 24 h. Nonpharmacologic: rest, positioning, ice for hot joints (frozen peas), paraffin dips, hot shower for morning stiffness, grab bars, hot packs; plasmapheresis with steroid pulse for severe disease; hypnosis, acupuncture, imagery, music; nutrition — no food causes/cures arthritis; supplements under supervision.</p>
<h5>Mobility & Self-Esteem</h5><p>Don't do ADLs for patient unless asked; food packaging barriers; china/heavy plastic cups; OT (long-handled brushes, dressing sticks); IPEC collaboration. Fatigue: pain, sleep, weakness, anemia (iron, folic acid; check stool for NSAID bleeding — older White women most likely GI bleed); PT for atrophy; sleep measures. Box 43.8 energy conservation: balance activity with 1–2 naps; pace; prioritize; delegate; plan ahead; know tolerance. Self-esteem: communicate acceptance; "arthritis personality" is a myth — avoid label; emphasize strengths; mental health/spiritual referral. Home: wide doors, ramps, one floor, handrails, elevated seats. SME: seek care early; check remedies with provider; control and decision making; asking for help; work adjustments/disability filing. Resources: Arthritis Foundation, support groups, palliative care. Outcomes: pain 2–3; independent function; positive self-perception.</p>
<h4>Gout</h4><p>Primary gout = most common inflammatory disease causing arthritis; systemic complications (kidney disease). Uric acid &gt; 6.8 mg/dL → urate crystals in connective tissue/synovial fluid; tophi. Risk: men &gt; 50, genetics, chronic alcohol, obesity, diuretics (esp. thiazides); secondary gout more common in women from thiazides. Phases: 1 asymptomatic hyperuricemia; 2 acute gouty arthritis — single joint, often great toe metatarsal, excruciating pain, hours to days, triggered by alcohol, high protein, drugs; multiple attacks = chronic gout; 3 tophaceous — tophi, kidney stones, kidney disease (rare today). Goal uric acid &lt; 6 mg/dL. Acute: NSAID, steroid, or colchicine (inhibits leukocyte migration; doesn't lower uric acid; GI distress — take with food). Probenecid (uricosuric; safe with colchicine). Chronic: allopurinol or febuxostat (xanthine oxidase inhibitors; febuxostat ↑ CV risk). Pegloticase IV every 2 weeks under supervision, infused over no less than 2 hours. Avoid red meat, organ meats, shellfish, alcohol (beer); review thiazides; weight-loss referral.</p>`});
