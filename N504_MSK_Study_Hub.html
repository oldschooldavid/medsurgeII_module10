<h4>Concepts & Key Terms</h4><p>Priority: Mobility (exemplar Fracture), Perfusion (exemplar Amputation). Interrelated: Pain, Tissue Integrity, Sensory Perception. MSK trauma ≈ two-thirds of all injuries; primary cause of disability. Psychosocial: PTSD, acute stress disorder, anxiety, sleep disturbance, depression — risk factors: female, older age, high-intensity acute pain, high injury severity → refer to mental health.</p><ul><li><b>ACS</b> — ↑ pressure within compartments reduces circulation to lower leg or forearm.</li><li><b>ABI</b> — ankle systolic ÷ brachial systolic; normal ≥ 0.9.</li><li><b>AVN</b> — death of bone tissue. <b>Bone reduction</b> — realignment (closed or open).</li><li><b>CTS</b> — median nerve compression at wrist. <b>Cast</b> — rigid immobilizing device (synthetic, less often plaster).</li><li><b>Closed (simple)</b> fracture — no wound; <b>open (compound)</b> — through skin.</li><li><b>CRPS</b> — CNS/PNS dysfunction with severe persistent pain.</li><li><b>Ergonomics</b>; <b>external fixation</b> (pins/wires + external frame); <b>internal fixation</b> (pins, screws, rods, plates, prostheses).</li><li><b>FICB</b> — regional block (e.g., levobupivacaine) of femoral, lateral cutaneous, obturator nerves; avoids femoral artery/vein injury.</li><li><b>Fasciotomy</b>; <b>FES</b> — fat globules from yellow marrow within 12–48 h.</li><li><b>Fracture</b>; <b>fragility fracture</b>; <b>neuroma</b>; <b>OIC</b>; <b>PLP</b>; <b>RSI</b> (CTS most common); <b>subcutaneous emphysema</b>; <b>traction</b>; <b>vertebroplasty</b>.</li></ul>
<h4>Fracture — Pathophysiology</h4><p>Complete (entire width; displaced if alignment disrupted — more soft-tissue damage) vs incomplete (not usually displaced). Open vs closed (open graded). Fig 44.1 types: impacted, comminuted, displaced spiral, displaced transverse. Fragility (pathologic/spontaneous) after minimal trauma; fatigue (stress) from excess strain (athletes); compression — loading force on long axis of cancellous bone (vertebrae in osteoporosis; extremely painful).</p>
<h5>Stages of Bone Healing</h5><ol><li>24–72 h: hematoma forms (bone very vascular).</li><li>3 days–2 weeks: granulation tissue invades hematoma → fibrocartilage.</li><li>Callus (new vascular tissue) within 3–6 weeks — nonbony union.</li><li>Callus resorbed and transformed into bone — 3–8 weeks.</li><li>Consolidation and remodeling — from 4–6 weeks up to 1 year.</li></ol><p>Young healthy adult 4–6 weeks; &gt; 70 years 3 months or longer. Affected by severity, bone type, management, infection, AVN. Older adults: Ca, P, vitamin D, protein needed; estrogen loss; PVD ↓ oxygen/nutrients to bone.</p>
<h5>Acute Complications</h5><p>VTE (DVT, PE) — most common complication of LE surgery/trauma and most often fatal complication of MSK surgery. Infection — wound infections most common; hardware infection; Clostridia → gas gangrene or tetanus; osteomyelitis most common with open fractures and after surgical repair; MRSA.</p><p>ACS: ischemia-edema cycle — capillaries dilate, histamine ↑ permeability, ↓ venous drainage, plasma proteins leak → edema → pressure on nerves → severe pain greater than expected; ↓ perfusion; sensory deficits/paresthesia before vascular or motor signs; pallor/ashen; pulses weaken but rarely disappear; tense; severe pain with passive motion; untreated → cyanosis, tingling, numbness, paresis, necrosis. External causes: tight bulky dressings, casts; internal: blood/fluid. Also burns, bites, IV infiltration. Fasciotomy — wound left open, heals from inside out, skin graft in several days. Long-term: infection, motor weakness, contracture, myoglobinuric renal failure, amputation.</p>
<h5>Box 44.1 ACS Sequence</h5><p>↑ compartment pressure (no change) → ↑ capillary permeability (edema) → histamine (↑ edema) → ↑ blood flow (pulses present, pink) → pressure on nerves (acute pain) → ↑ tissue pressure (referred pain) → ↓ perfusion (↑ edema) → ↓ O2 (pallor/ash gray) → lactic acid (unequal pulses, flexed posture) → anaerobic metabolism (cyanosis) → vasodilation (↑ edema) → ↑ blood flow (tense muscle swelling) → ↑ tissue pressure (tingling, numbness) → ↑ edema (paresthesia) → muscle ischemia (severe pain unrelieved by drugs) → tissue necrosis (paresis/paralysis).</p>
<p>FES: fat globules from yellow marrow 12–48 h after injury clog small vessels (lungs most commonly); also pancreatitis, osteomyelitis, blunt trauma, sickle cell. Earliest: hypoxemia, dyspnea, tachypnea; then headache, lethargy, agitation, confusion, ↓ LOC, seizures, vision changes; red-brown petechial rash over neck, upper arms, chest = classic but LAST. Labs: PaO2 often &lt; 60 mm Hg; ↑ ESR; ↓ Ca; ↓ RBC and platelets; ↑ serum lipids. CXR bilateral infiltrates (may be normal); CT patchy opacities; brain MRI. Can cause respiratory failure/death (pulmonary edema); may be misdiagnosed as PE (Table 44.1: same findings except PE has no petechiae; FES origin long-bone fx within 48 h; FES tx bed rest, gentle handling, O2, IV hydration, possibly steroids, immobilization; PE tx prevention, bed rest, O2, ventilation, anticoagulants, thrombolytics, embolectomy/vena cava umbrella).</p>
<h5>Chronic Complications</h5><p>AVN (hip fx, displaced fx, hardware, long-term steroids). Delayed union (not healed within 6 months), nonunion, malunion — tibial fx, multiple treatments, pathologic fx, older adults. CRPS (formerly RSD): genetic factors; feet and hands; PT desensitization with varied textures; triad — autonomic (color, temperature, sensitivity changes, sweating, edema), motor (paresis, spasms, loss of function), sensory (intense intractable burning pain). Chronic stress disorders.</p>
<h5>Etiology, Incidence, Prevention</h5><p>Trauma (MVC, falls esp. older adults), direct blow or indirect force; sports, vigorous exercise, malnutrition; osteoporosis. Rib fractures most common in adults; femoral shaft in young/middle-aged; hip in older adults; humeral (more proximal with age); Colles wrist (FOSH — fall on outstretched hand). Military: strains, sprains, stress fractures, lumbar injuries. Airbags ↓ deaths but ↑ leg/ankle fractures. Teach osteoporosis screening, fall prevention, home safety, substance use/driving dangers, overuse prevention, helmets; smoking → more fractures, pain, slower healing.</p>
<h4>Fracture Assessment</h4><p>Delay detailed interview until comfortable. Forces: incisional, crush (hemorrhage), acceleration/deceleration (spleen, brain, kidneys), shearing, friction (contamination). Forward fall → Colles. Substance history all ages; opioid use before fracture. Occupation and recreation (construction, skiing, football, hockey; jogging → stress fx). Assess all systems first for life-threatening cues; pelvic fx → vitals, skin, LOC for hypovolemic shock; one pelvic fx usually means another; blood in urine → bladder; unable to void → bladder/urethra damage. Rib fx: pain on deep breaths, pneumothorax — manage pain before continuing exam. Shoulder/upper arm assessed sitting/standing; distal arm supine; legs/pelvis supine; impacted hip fx may walk briefly. Deformity, rotation, shortening, dislocation; ecchymosis; subcutaneous emphysema (later). Action Alert: rapid swelling → NV compromise; compare; cap refill &lt; 3 s (check skin next to brittle nails; less reliable).</p>
<h5>Box 44.2 Neurovascular Assessment</h5><ul><li>Skin color distal — no change compared with rest of body.</li><li>Temperature — warm (dorsum of hand most sensitive).</li><li>Movement — active without discomfort; passive no different from active.</li><li>Sensation — no numbness/tingling; paper clip in web space first/second toes (peroneal) or thumb/forefinger (median) — equal.</li><li>Pulses — strong, equal.</li><li>Capillary refill (least reliable) — within 3 s (5 s older).</li><li>Pain — localized, stabbing/throbbing; out of proportion and unrelieved → compartment syndrome.</li></ul>
<p>Psychosocial: single uncomplicated fx (finger, wrist, foot, toe) — no hospitalization; multiple trauma — long stays, stress, anxiety, depression; spiritual/support assessment; hope via pain management; counseling. Labs: ↓ H&H (bleeding); ↑ ESR with soft-tissue damage; ↑ ESR/WBC during healing → infection; Ca and P ↑ during healing. Imaging: x-ray (repeat with more views if symptomatic), CT (hip, pelvis, spine compression), MRI (soft tissue).</p>
<h5>Priority Problems</h5><ol><li>Acute pain</li><li>Decreased mobility</li><li>Potential neurovascular compromise</li></ol>
<h4>Fracture Management</h4><p>Emergency: call 911, ABCs (CPR: circulation first, then airway, breathing); secondary survey; IV fentanyl/hydromorphone/morphine; NSAIDs, nerve blocks; cardiac monitoring if &gt; 50 before drugs. Box 44.3: ABCs; head-to-toe; remove/cut clothing supporting above and below; don't remove shoes unless foot/ankle injured; direct pressure + proximal artery pressure for bleeding; remove jewelry; keep warm, supine; NV check distal and compare; splint including joints above and below, recheck circulation; cover open areas with sterile dressing.</p><p>Nonsurgical: primary concern NV dysfunction — assess q1h × 24 h then q1–4h; elevate above heart, ice 24–48 h. Closed reduction with manual traction under moderate sedation; monitor SpO2 and ETCO2 — if ETCO2 &lt; 30 mm Hg and RR falls to 10 → sternal rub, encourage breathing; x-ray confirms alignment. Splints (thermoplastic; preferred over casts when possible — allow swelling); immobilizers for scapula/clavicle; orthopedic shoes/boots.</p><p>Casts: fiberglass most often (dries within minutes); plaster hot then cool, ≥ 24 h to dry — wet = cold, musty, gray; dry = hard, odorless, shiny white; don't cover new plaster cast, handle with palms. Window (replace piece to prevent window edema) for wound care, pulses, drains, abdominal distention with spica. Bivalve if too tight (cast cutter won't cut skin; warmth felt). Arm cast: hand higher than heart; ice 24–48 h; sling distributes weight over shoulders/trunk; some providers stop sling after a few days; wrist fx often splinted. Leg cast: crutches/walker; cast shoe; elevate on pillows; ice 24 h. Action Alert: one finger between cast and skin; NV q1h × 24 h; ice 24–36 h. Inspect q8–12h for drainage, alignment, fit; plaster absorbs, synthetic wicks; circling drainage evidence unclear; report sudden ↑ drainage; loose cast after swelling ↓ → replace. Complications: infection from pressure necrosis ("hot spot," warmth, musty odor, fever); never put objects inside cast; circulation/nerve impairment (numbness, ↑ pain, wiggle toes); immobility complications; contracture, OA, osteoporosis, atrophy.</p><p>Traction: skin (Buck boot, belt, halter) — for spasm with hip/proximal femur fx; 5–10 lb (2.3–4.5 kg). Skeletal: screws into bone; 15–30 lb (6.8–13.6 kg); pressure reduction; pin care per protocol. Action Alert: don't remove weights without order; never lift or rest on floor; hang freely; teach UAP, radiology, visitors; inspect skin q8h; remove boot/belt q8h; circulation q1h × 24 h then q4h.</p><p>Drugs: opioid and nonopioid alternated or together; PCA morphine/fentanyl/hydromorphone for severe/multiple; oxycodone ± APAP, hydrocodone/APAP; NSAIDs (may slow bone healing); muscle relaxants; time strong doses before dressing changes, PT, bedtime; OIC — stool softeners/laxatives, fluids, fiber, activity; medication-induced constipation from anticholinergics, CCBs, antidepressants, diuretics. PT: ice/heat, e-stim, dexamethasone iontophoresis (pinch/slight sting). Inadequate pain control → CRPS.</p><p>Surgical: ORIF (preferred — early mobility; hardware may be removed, most often ankle); external fixation with closed reduction for open fractures/soft-tissue injury — advantages: minimal blood loss, early ambulation, maintains alignment/stabilizes comminuted fx; disadvantage: pin site infection → osteomyelitis. Post-op: IV ketorolac in PACU; aggressive pain control; regional block 18–24 h — medicate before it wears off; nonpharmacologic measures; same-day ORIF stays up to 23 h. Pin sites q8–12h; clear drainage/crusting expected 48–72 h; don't remove crusts. Body image with bulky frame; clothing alterations. Nonunion: electrical bone stimulation (external — not on arm with pacemaker; or implanted; months), bone grafting (iliac crest chips, allografts, bone bank — femoral heads from THA with consent), low-intensity pulsed ultrasound ~20 min/day (no contraindications).</p><p>Mobility: PT (LE) and OT (UE); ankle ORIF therapy after staples removed with boot; laterality, mirror-box therapy, touch desensitization (↓ CRPS). Weight bearing ~6 weeks after LE surgery: toe-touch/partial with crutches/walker; strengthening. Crutches/knee scooter need strength and balance — not often for older adults. Crutch fit: 2–3 fingerbreadths between axilla and top when tip 6 in (15 cm) diagonally in front of foot; elbow flexed ≤ 30°; rubber tips; three-point gait (little weight on affected leg). Walker for older adults needing balance. Cane on UNAFFECTED side, elbow ≤ 30°, top at greater trochanter/wrist stylus; step forward with cane and affected leg together, then unaffected leg.</p><p>NV compromise — Critical Rescue: early cues of ACS; six Ps (pain, pressure, paralysis, paresthesia, pallor/ash gray, pulselessness); pain with passive motion, out of proportion, analgesics ineffective; paresthesia often first. Notify immediately; loosen bandages/tape; cast cutting per protocol; do NOT elevate or ice. Compartment pressure monitoring (handheld one-time or continuous) — recommended for comatose/unresponsive high-risk multiple trauma.</p><p>Care coordination: uncomplicated → home from ED; older/multiple trauma → hospital → home, rehab, or LTC; SBAR handoff. Home: stairs, bathroom access, pets, rugs, waxed floors; wheelchair space. Teach device/wound care; protein, calcium, iron (non-weight bearing ↓ RBC production); iron multivitamin with food; stool softener with stimulant; follow-up visits. Box 44.4 after cast removal: soak scaly skin (don't scrub); expect smaller, weak, stiff limb; support with pillows/orthotic; exercise slowly per PT; support stockings/elastic bandage for LE. Outcomes: pain 2–3; ambulates independently; no immobility consequences; adequate perfusion; no complications.</p>
<h4>Specific Fractures</h4><p><b>Hip</b>: most common MSK injury in older adults; high mortality; over half can't live independently; many die within 1 year; incidence decreasing (bone-loss management, less smoking). Upper third of femur; intracapsular vs extracapsular (femoral neck, subcapital, capital; intertrochanteric, subtrochanteric); femoral neck → AVN of femoral head (esp. displaced). Osteoporosis = biggest risk factor; hip may break then cause the fall. Fragility risks: sensory changes, gait/balance/strength, stiffness; osteoporosis, foot disorders, bony mets, cardiac changes; diuretics, antihypertensives, antidepressants, sedatives, opioids, alcohol (≥ 3 at once drastically ↑ falls); throw rugs, loose carpet, clutter, poor lighting, uneven surfaces, pets. Pain in groin or behind knee (or low back or none); unable to stand. Pre-op: IV morphine/hydromorphone in ED; PCA/epidural after; pain often inadequately assessed in older adults; FICB (levobupivacaine) — no opioids, low cost; skin traction ineffective for pre-op pain. ORIF (intramedullary rod, pins, hemiarthroplasty prosthesis, compression screw) under epidural/spinal/general; rarely nonsurgical (bed rest). Delirium (incl. quiet delirium) — fall prevention. Action Alert (hemiarthroplasty): prevent adduction and rotation; pillows/abduction device; check straps and skin q2h; NV checks.</p>
<h5>Box 44.5 Hip Fracture Quality Indicators</h5><ul><li>Surgery within 24–48 h.</li><li>Out of bed day of surgery; walk 1–2×/day POD 1.</li><li>Nutrition screening; daily oral supplements.</li><li>Avoid urinary catheter; remove within 24 h.</li><li>Multimodal pain management; geriatric dosing; regional blocks.</li><li>Cognitive screening on admission; daily delirium screening.</li><li>HOB ≥ 30°; dysphagia screening; mouth care.</li><li>Daily bowel assessment; bowel protocol.</li><li>VTE protocol.</li><li>Pressure injury risk assessment; daily skin checks; heels off bed.</li><li>Self-management teaching; follow-up 4–6 weeks.</li><li>Bone health follow-up.</li></ul>
<p><b>Other LE</b>: femur (lower two-thirds) — trauma/MVC; not cast (spastic thigh muscles); hemorrhage; ORIF plates, nails, rods, compression screw; ex-fix; healing ≥ 6 months; skeletal traction then brace/cast. Tib-fib: closed reduction + cast 6–10 weeks, internal fixation + long-leg cast 4–6 weeks, or ex-fix 6–10 weeks; delayed union common; fibula non–weight bearing. Ankle: bimalleolar (Pott) — medial malleolus of tibia + lateral malleolus of fibula ± talus; ORIF via two incisions. Foot/toes: painful but less serious; orthopedic shoe/boot.</p><p><b>Chest</b>: ribs/sternum — puncture of lungs, heart, arteries; lower ribs → liver, spleen, kidneys; ABCs first; heal on own; pneumonia risk from shallow breathing. <b>Pelvis</b>: second most common cause of trauma death after head injuries; MVC/falls from buildings (young), falls (older); venous oozing/arterial bleeding → hypovolemic shock. Action Alert: blood in urine and stool, abdominal rigidity/swelling; CT/ultrasound (bedside, rapid, cheap). Non–weight-bearing (pubic rami, iliac crest): bed rest on firm mattress, stool softeners, heal ~2 months. Weight-bearing (pelvic ring, acetabulum): ex-fix and/or ORIF; weight bearing days to 12 weeks.</p><p><b>Vertebral compression</b>: osteoporosis or metastatic cancer; severe pain, kyphosis, neuro compromise. Bed rest, analgesics, nerve blocks, PT; vertebroplasty/kyphoplasty (balloon) or vertebral augmentation (preferred); moderate sedation or general; IV ketorolac before; fluoroscopy/CT guidance; home in 2–4 h or overnight. Box 44.6: pre — platelets &gt; 100,000/mm³; anticoagulants stopped; neuro status; pain; able to lie prone ≥ 1 h; IV line; vitals. Post — flat supine 1–2 h; vitals and neuro checks; ice to puncture site; compare pain; mild analgesic; watch bleeding, SOB; assist ambulation. Teach: no driving/machinery 24 h; monitor infection; keep dressing dry, remove next day; usual activities next day; avoid soaking bath 1 week.</p>
<h4>Amputation</h4><p>Removal of a body part; limb salvage advances ↓ elective amputations; loss is complete and permanent; interprofessional team (prosthetists, therapists, psychologists, case managers, physiatrists). Elective (most; PAD → ischemia) vs traumatic (accidents, war). Levels: toes (great toe affects balance, gait, push-off); midfoot and Syme (most of foot, ankle remains — weight bearing without prosthesis, less pain); BKA (preserve knee); above-knee; hip disarticulation; hemipelvectomy (younger; cancer, osteomyelitis, trauma). Higher level = more energy for mobility. UE more incapacitating; save length; early prosthesis.</p><p>Complications: hemorrhage → hypovolemic shock; infection (confused, malnourished older adults); PLP (burning, crushing, cramping; distorted position; phantom sensation — numbness/tingling; telescoping; triggers — touching limb, temperature/barometric changes, illness, fatigue, anxiety, stress, urination; more common with preop chronic limb pain, less with traumatic; usually after AKA); neuroma (most often UE; sonography; surgery may regrow; nerve blocks, steroid injections, hypnosis); flexion contractures of hip/knee (positioning, active ROM).</p><p>Etiology: DM → PAD most; trauma second and primary cause of UE amputation (lawn mowers, MVCs, machinery). &gt; 2 million live with amputation. Equity: Black individuals less likely to get limb salvage → twice as likely to have DM-related amputation; Hispanics 30% more likely (diabetic foot infection); Indigenous people 70% more likely; low income, lack of access. Veterans: IEDs, bombs, multiple limbs, TBI, PTSD. Prevention: typical elective patient middle-aged/older person of color with diabetes and long smoking history; foot care; healthy weight, exercise, no smoking; young men — safety, no speeding/drinking and driving.</p><p>Assessment: NV status; both legs in vascular disease; skin near nail bed for cap refill; discoloration, edema, ulcers, necrosis, hair distribution. Psychosocial: loss of even part of a finger/thumb is traumatic; grieving; traumatic harder than planned; motivation for rehab; body image, intimacy, independence; chaplain/social worker; VA counseling. Family response correlates with progress; rehab 9–15 months for multiple limb trauma; cultural rituals (e.g., Jewish — store part for burial or bury immediately). Diagnostics: segmental limb pressures, ABI (≥ 0.9 normal), Doppler ultrasonography, laser Doppler, TcPO2 (reliable for healing).</p>
<h5>Amputation Priority Problems & Care</h5><ol><li>Potential ↓ tissue perfusion in residual limb</li><li>Acute/persistent pain</li><li>↓ Mobility</li><li>↓ Self-esteem</li></ol><p>Emergency traumatic: call 911; airway/breathing; direct pressure with dry gauze (gloves); elevate above heart; don't remove dressing. Finger: wrap in dry sterile gauze/clean cloth → watertight sealed plastic bag → ice water 1 part ice : 3 parts water, never directly on ice; avoid finger-water contact; don't remove semidetached parts; part travels with patient. Elective: skin flap pink (light skin) or not discolored (dark skin); warm not hot; proximal pulse vs other side; Doppler if bilateral disease; vitals. Critical Rescue: ↓ perfusion → surgeon/RRT; BP ↓ + pulse ↑ → covert bleeding; lift limb to feel under dressing; direct pressure.</p><p>Pain: Action Alert — PLP is real; manage promptly; never tell patient limb can't hurt; handle limb carefully. Opioids less effective for PLP; IV calcitonin during week after amputation; propranolol for constant dull burning; pregabalin/gabapentin for knifelike/sharp burning; baclofen for spasms/cramping; antidepressants adjuvant. PT: massage, heat, TENS, mirror therapy (Yildirim & Sen 2020), ultrasound. Chaplain, social worker, psychologist.</p><p>Mobility: pre-op strengthening and crutch practice; ROM to prevent hip/knee flexion contractures; trapeze; turn q2h; move slowly; firm mattress; prone 20–30 min every 3–4 h if tolerated; adduct residual limb and contract gluteals; resistive exercise after staples out; push residual limb into soft → firmer → hard surface (prepares for prosthesis, ↓ PLP). Elevating residual limb controversial (some allow 24–48 h); inspect daily that it lies flat. CPO before elective surgery; bring sturdy shoes to fitting (heel height). Rigid removable dressings preferred; air splint (leaks); elastic bandages — rewrap q4–6h, figure-eight, less tight distal→proximal, anchor to highest joint. CAD-CAM; Flex-Foot ankle-foot prosthesis; osseointegration (metal implant in residual bone + transcutaneous connector).</p><p>Self-esteem: meet a rehabilitated amputee of similar age; "stump" vs "residual limb" — ask preference; euphoria ≠ acceptance; refusing to look while verbalizing acceptance — document; athletes and sports; vocational rehab; sexuality; realistic outcomes one day at a time.</p><p>Care coordination: home, SNF, rehab, LTC (dementia); wheelchair room, toileting, kitchen access. Limb care: rewrap several times/day or shrinker sock; wash daily with soap and water once healed; inspect daily. Box 44.7 home: circulation, infection, healing, flexion contracture, dressing/wrap; ADLs; ambulatory aids/prosthesis care; pain; nutrition; body image coping. Action Alert: prosthesis teaching with prosthetist — custom-made; clean socket and inserts; correct liners; footwear; follow-up schedule. Resources: Amputee Coalition (ACA), Amputation Foundation; Table 44.2 veteran resources — Hope for the Warriors, Military OneSource, Veterans Affairs, Amputee Coalition of America, Wounded Warrior Project, American Amputee Foundation, Amputee Coalition of Canada. Outcomes: perfusion; pain 2–3; independent mobility; positive self-esteem.</p>
<h4>Carpal Tunnel Syndrome</h4><p>Median nerve compressed in rigid canal (carpal bones + fibrous sheet) when synovium swells/thickens; median nerve supplies thumb, index, middle fingers and palmar half of ring finger. Wrist flexion → impingement; extension → ↑ pressure. Most common RSI; fastest-growing occupational injury (factory, computer, jackhammer; texting/cell phones in young adults; golf, tennis, racquetball). Usually chronic; acute rare (excess exercise, edema/hemorrhage, median artery thrombosis; hand burns, Colles fx). Complication of RA (synovitis) and DM (↓ blood supply → neuropathy). Women &gt; 50 much more likely; dominant hand, may be bilateral. Prevention: OSHA/state laws; Joint Commission safe environment; Canada health & safety committees. Box 44.8: know laws; ergonomic wrist rests, keyboards, chair height; short breaks; stretch fingers/wrists; stay relaxed.</p><p>Assessment: often diagnosed by history; "pins and needles" in first three fingers; nocturnal burning pain relieved by activity on waking; strenuous activity worsens. Phalen test — paresthesia within 60 seconds (positive in most). Inspect atrophy, swelling; autonomic changes (skin discoloration, brittle nails, sweating). Nonsurgical: NSAIDs (don't slow progression; take with/after meals), corticosteroid injection into tunnel (repeat weekly/monthly), splint/brace in neutral or slight extension, yoga, wrist-stretching. Surgical: carpal tunnel release (resect transverse carpal ligament) — endoscopic (ECTR, &lt; ½ in / 1.2 cm incision; less invasive, cheaper, may have longer pain/numbness), mini-open, ultrasound-guided — none proven better. Post-op: vitals, dressing drainage/tightness; elevate hand above heart for days; NV checks hourly initially; move fingers; discomfort 24–72 h; restrict hand movements/lifting 4–6 weeks; weakness weeks–months; report NV changes, bleeding, infection; may recur (RA synovitis); help at home; major complications rare.</p>
<h4>Knee & Sports Injuries</h4><p>Box 44.9 emergency: don't move until spinal cord injury ruled out; RICE — rest (splint joint above and below), ice intermittently 24–48 h (then heat), compression 24–48 h (elastic wrap), elevation; assume fracture until x-ray; NV check distal. Knee = most often injured; internal derangement; arthroscopic repair; analgesics, PT, bracing/knee immobilizer; NV monitoring.</p><p>Rotator cuff: stabilizes humeral head in glenoid during abduction; young adults — substantial trauma (fall, throwing, lifting); older — small painless tears from aging, repetition, falls, then pain limits motion. Can't maintain abduction (drop arm test); night and overhead pain worse; partial-thickness more painful, full-thickness more weakness; atrophy. X-ray, MRI, US, CT. Partial: NSAIDs, intermittent steroid injections, PT (ultrasound, e-stim, ice, heat), activity limits. No response 3–6 months or full-thickness → mini-open or arthroscopic repair; interscalene block (arm numb, can't move up to 20+ h; watch respiratory distress, NV compromise); immobilized several weeks; pendulum exercises POD 3–4 → active ~2 weeks; OT; full function takes months.</p>
<h5>Table 44.3 Acute Soft Tissue Injuries</h5><ul><li>Sprain (ligament overstretch): immobilization, RICE, surgery if severe.</li><li>Strain (muscle/tendon overstretch): heat/cold, activity limits, NSAIDs, muscle relaxants, tendon repair.</li><li>Ligament tear (e.g., ACL): RICE, arthroscopic surgery if severe/not healing.</li><li>Meniscus tear: RICE, bracing, splinting, NSAIDs, arthroscopic surgery.</li><li>Tendon rupture (Achilles; high heels; fluoroquinolones such as ciprofloxacin): RICE, NSAIDs, orthotics, ultrasound, surgery.</li><li>Patellofemoral pain syndrome (runner's knee): rest, splint, brace, NSAIDs, surgery last resort.</li><li>Joint dislocation: manual relocation; possible surgery.</li></ul>`});
SRC_CHAPTERS.push({id:"lec",title:"Module 10 Lecture — Slides + Voice-Over Transcript (extracted text)",html:"<p class=\"small\">Extracted text of the uploaded lecture PDF (slides 1–52 and voice-over transcript pages). Image-only slides show only their titles.</p><div class=\"srcpre\">NURS 504 Medical Surgical\nNursing II\nAltered\nMusculoskeletal Functions\n\n1\n\n\fAge Related Changes in\nMusculoskeletal Function\n•\n•\n•\n\nMuscles\nJoints\nBones\n\n2\n\n\f• Affected by\n• Disease,\n• Surgery\n• Trauma\n• Age\n\nLoading…\n\n• Assessment often overlooked\n\n3\n\n\fMusculoskeletal Assessment\n\n4\n\n\fNeurovascular Assessment\n• Neurovascular assessment of an injured extremity.\nA. Skin colorB. Response to painful stimuli C. Reflexes D. Ability to follow commands to move extremity\nE. Pulse present/absent in extremity\n\nLoading…\n\n5\n\n\fNursing diagnosis\n• Alteration in comfort\n• Impaired mobility\n• Activity intolerance\n• Disturbance in body image\n• Self care deficit\n• Potential infection\n6\n\n\fLabs\n• Phosphate - 3-4.5 mg/dL\n\n• Hyperphosphatemia: bone fx. in healing stage, tumors\n• Hypophosphatemia: Osteomalacia\n\n• Calcium - 9-10.5 mg/dL\n•\n\nHypercalcemia: Metastatic CA to bone, bone fx. In healing stage\nphosphorus calcium (inverse relationship)\n\n• Alkaline phosphatase- 30-120 units/L\n•\n\n: Metastatic CA of the bone, Paget’s Disease, Osteomalacia\n\n• Vitamin D - RDA 400 IU/D\nCholecalciferol (D3) come from photochemical in the skin – produced in\nbody – promotes calcium &amp; phosphorus absorption in the small intestine\n\n7\n\n\fLabs\n• Enzymes affected in skeletal muscle\n• Creatine Kinase (CK)- F 26-140 units/L, M 38-174\n\nunits/L.\n•\n\nIncrease in 2-4 hours – muscle trauma, progressive muscular dystrophy,\n\n• CK molecule 2 subunits (M=muscle &amp; B=brain)\n•\n\nCK(CK-MM, or CK3 only isoenzyme = skeletal muscle damage\n\n• MB = Heart\n\n• Aspartate aminotransferase (AST)- 0-35 units/L\n•\n\n: skeletal muscle trauma, muscular dystrophy\n\n• Aldolase (ALD)- 3-8.2 units/dL\n•\n\n: muscular dystrophy\n\n• LDH – 100-190 units/L\n•\n\n: skeletal necrosis, CA, muscular dystrophy\n8\n\n\fDiagnostics\nA. X-ray: bone density, alignment, swelling, intactness\nB. Magnetic Resonance Imaging: used to diagnose musculoskeletal\ndisorders\nC. Arthroscopy: used to diagnostic or surgical procedures\n\n9\n\n\fDiagnostic Workup\n• Arthrography –\n• study of joint, air or contrast\n• Bone chips, torn ligaments, or loose bodies\n• Arthroscopy• Look into joint (shoulder &amp; knee)\n• Surgical procedures, biopsy (synovial)\n• Biopsy –\n• Bone – infection, neoplasm\n• Muscle – atrophy (muscular dystrophy)\n• Myelogram- (spinal puncture)\n• Injection of contrast into subarachnoid space\n(vertebral column, intervertebral disks, spinal nerve\nroots, blood vessels)\n• Use is with CT &amp; MRI\n\n10\n\n\fArthroscopy\n\nLoading…\n\n11\n\n\fDiagnostic workup\n• Electromyography (EMG)\n• Helps diagnose neuromuscular,\n\nlower motor neuron, peripheral\nnerve disorders\n• Helps evaluate muscle weakness\n• Low electrical currents pass\n\nthrough flat electrodes placed\nalong nerve\n•\n\nIf needles used, inspect needle\nsites for hematoma formation\n\n12\n\n\fDiagnostic Workup\n• Bone Scan\n• Radionuclide test – radioactive material is injected to visualization of\nskeleton\nDetects tumors, arthritis, osteomyelitis, osteoporosis, vertebral compression\nfractures unexplained bone pain\n• Extremely useful for hairline fractures,\n•\n\n• Gallium/Thallium Scans\n• More specific &amp; sensitive in detecting bone problem\n• Isotopes =\n•\n\ngallium citrate migrates to brain, liver &amp; breast tissue\n•\n\n•\n\nUsed to examine these structures when disease is suspected\n\nThallium good for osteosarcoma\n\n• MRI\n• Diagnose musculoskeletal disorders (appropriate for joints, soft tissue, bony\ntumors)\n• CT\n• Test of choice for injuries or pathology involving only bone\n13\n\n\fSoft Tissue Injuries\n• Soft tissue injuries\n•\n\nA. Strains: Excessive stretching of muscle or tending\nFirst degree (mild): mild inflammation, bleeding, swelling, ecchymosis, tenderness\n• Second degree (moderate): tearing of muscle or tending fibers without complete\ndisruption\n• Third degree (severe): ruptured muscle or tending with separation of muscle from\nmuscle, tendon from muscle, or tendon from bone\n•\n\n•\n\nB. Sprains: excessive stretching of ligament from twisting mechanism.\n•\n\nTX: RICE (rest, ice, compression, elevation\n\nC. Dislocations: when 2 or more bones are moved away from each other\n• D. Bursitis: Inflammation of the fluid-filled sacs in the joints\n•\n\n14\n\n\f•\n\n•\n\n•\n\nSoft Tissue Injuries\nCarpel Tunnel: Chronic problem\nmedian nerve and wrist become compressed, causing pain and numbness\nComplication of certain metabolic and connect tissue diseases\nSynovitis: inflammation of the synovium occurs in patients with rheumatoid arthritis (RA)\n\nMeniscus\n\n•\n\nknee injury, medial meniscus &amp; lateral meniscus, pads act as shock absorbers\n\n•\n\n•\n\nInjury result of twisting the leg when the knee is flexed, and the foot is placed\nfirmly on the ground\nPain tenderness &amp; swelling around the knee, clicking or snapping\nsound\nArthroscope surgery\n\n•\n\nMuscle spasms\n\n•\n\n15\n\n\fFractures\nDescribe fracture healing\nA. Normal\nB. Complications\n1. Infections\n2. Compartment syndrome\n3. Venous thrombosis\n4. Fat embolism\n\n16\n\n\fFractures\nC. Fracture reduction\n1. Open (compound) – skin broken causing external\n(grade I – III)\n2. Closed (simple) – no visible wound,\nextend through skin\n\nwound\n\nfracture does not\n\n17\n\n\fFractures\n● Complete –\n● break across width of bone; divided into sections\n● Incomplete –\n● break through part of bone but doesn’t divide\n● Pathological –\n● occurs over minimal trauma (CA, osteoporosis)\n● Stress –\n● Caused by excess stress/strain on bone\n● Compressed● Produce by a loading force applied to the long axis of cancellous bone.\nVertebrae force to long axis osteoporosis\n\n18\n\n\fCommon Fractures\n\n19\n\n\fTreatment of Fractures\nD. Immobilization\n1. Cast – complex fractures or fracture of LE, deformities,\n\ndeformities, complications, synthetic\n\nprevention of\n\ncasts, leg cast, spica cast,\n\n2. Traction (a) Types – skin, skeletal, plaster, brace, circumferential,\n(b) Care of site – skeletal points of entry, inspect q 8hrs\n\n3. External fixation – alternative modality for\n\ninitial management of fx,\nphysician makes a small percutaneous incisions so that pins can be implanted into the\nbone after fracture reductions, pins are self-drilling, pins held in place by external metal\nframe to prevent bone movement, pin-tract\ninfection\n\n20\n\n\fTraction\n\n21\n\n\fExternal Fixation\n\n22\n\n\fFractures of the Hip\n• Intracapsular or extracapsular\n• Intracapsular: within the joint capsule\n• Extracapsular: outside the joint capsule\n\n• Treatment of choice: surgical repair\n• Open reduction with internal fixation (ORIF): allows\n\nsurgeon to directly view fracture site and uses metal pins,\nscrews, rods, plates, or prostheses to immobilize the site\nwhile healing\n• Pain management\n• Early ambulation/Physical therapy\n\n23\n\n\fTypes of Hip Fractures\n\n24\n\n\fFracture Healing: Infection\n● Delay wound healing, decrease function\n● Nursing Interventions\n● Observe for S&amp;S of infection\n● Prevent infection –\n• Clostridial infection: cellulitis, myositis, clostridial myonecrosis\n\n25\n\n\fComplications\nof\nFractures\nAcute compartment syndrome\n●\n\nSerious condition\n● Increased pressure within compartment reduces circulation to the area\n● TX: Fasciotomy\n●\n\n●\n\nInfection\n●\n●\n●\n\n●\n\nHypovolemic Shock\n●\n\n●\n\nWound infection\nBone infection: osteomyelitis\nMay become severe enough causing necrosis and possible amputation\nbone is vascular, high risk of bleeding, trauma to arteries can cause hemorrhage\n\nFat embolism syndrome\nresult of fracture; fat globules released from yellow bone marrow into the blood\n● Globules clog small blood vessels that supply vital organs (most commonly lungs)\ncausing impaired organ perfusion\n• Earliest manifestation is ALOC, caused by low arterial 02 level (hypoxemia, dyspnea,\ntachypnea\n●\n\n•\n\nVenous thromboembolism\n•\n\n•\n\nDVT or PE\n\nDelayed union\nFracture that hasn’t healed within 6 months of injury\n• Nonunion: never completely heal\n• Malunion: heal incorrectly\n•\n\n26\n\n\fAmputations\n• Multidisciplinary care of a client who has had an\n\namputation.\nA. Preoperative care\nB. Postoperative management\nC. Pain relief\nPhantom limb\nD. Psychosocial problems\nE. Ambulation\nF. Age related implications\n\n27\n\n\fAmputations\n●\n\nTypes\n\nElective: related to complications such as PVD or DM\n● Considered only after other interventions haven’t restored circulation and to salvage\nlimb\n● Traumatic: result from accidents or war\n●\n\n●\n\nLevels of amputations (for LE)\n●\n●\n\n●\n\nBKA- below the knee amputation\nAKA: above the knee amputation\n\nComplications\n\nHemorrhage hypovolemic shock\nInfection\nPain\n● Phantom limb pain: unpleasant or painful sensation that’s felt after amputated\npart\n● Neuroma: sensitive tumor consisting of damaged nerve cells\n● Flexion contractures\n●\n●\n●\n\n●\n\n●\n\nMust avoid so patient can ambulate with prosthetics\n\nNursing Interventions\n●\n\nPain control, prevention of infection and contractures\n\n28\n\n\fCommon Levels of Amputations\n\nLoading…\n\n29\n\n\fOsteoarthritis/Degenerative Joint\nDisorder\n● Progressive deterioration and loss of cartilage and\n\nbone in one or more joints\n● Types\n● Primary: caused by aging and genetic factors\n● Secondary- results from joint injury and obesity\n● Can also result from certain metabolic diseases such as\n\nDM, Paget’s disease of bone\n● Can result from blood disorders such as hemophilia or\nsickle cell disease\n\n30\n\n\fOsteoarthritis (OA/DJD)\n● Risk factors\n● 1. Age\n● 2. Obesity\n● 3. Post menopause\n● 4. Comorbidity\n● 5. Sports injury\n\n31\n\n\f● Assessment\n● History\n● Labs-elevated ESR\n● May be unilateral\n● Pain decrease with rest\n● Crepitus - continuous grating sensation\n● Joint stiffness\n● Joint changes\n● Hands\n\n● Heberden’s nodes\n● (swelling - distal interphalangeal joints)\n\n● Bouchard’s nodes\n● (swelling – proximal interphalangeal joints)\n\n32\n\n\fHeberden’s Nodes\n\n33\n\n\fOA/DJD\n\n34\n\n\f● Joint effusion –\n●\n\nexcess joint fluid, common when knees involved\n\n● Spinal involvement –\n\nLumbar region L3-4\n● Cervical region C4-6\n● Compression of spinal nerve roots, result of vertebral facet bone spurs\n● Radiating pain, stiffness &amp; muscle spasms\n●\n\n● Functional assessment –\n\nSevere pain &amp; deformity\n● Interfere with ADLs, ambulation\n● PT &amp; OT\n●\n\n● Psychosocial –\n●\n\nPermanent changes in lifestyle, role changes, socialization, constant pain, quality of\nlife, sexuality, daily stress\n\n● Diagnostic studies-\n\nESR, high-sensitivity C-reactive protein x-ray,\n● MRI, bone scan\n●\n\n35\n\n\fNursing Interventions for DJD (OA)\n● Pain control\n● Medications\n•\n•\n•\n\nTylenol, NSAIDS, Steroids\nMuscle relaxants- Flexeril\nUsually no potent narcotic- Chronic\n\n● Position\n•\n•\n•\n\nLocal rest\nSystemic rest\nPsychological rest\n\n● Hot and cold\n● Weight control\n● Complimentary/Alternative\n•\n\nTENS, acupuncture, music, etc.\n\n● Topical drug applications\n•\n•\n\nCayenne pepper\nLidocaine 5% patches for neuralgia\n36\n\n\fSurgical Management\n• Total joint arthroplasty\n\n(TJA) – surgical creation of a\njoint\n• Osteotomy – bone resection\n\nused to correct joint\ndeformity\n\n37\n\n\f● TJR- Last resort\n● Contraindications for TJR\n● Pre and post op care\nLevel of understanding\n• VTE\n•\n\n● OOB post op day #1 with PT\n\n● Nsg. Interventions\n● Assess for complications\n● Meds-\n\nAnticoagulants- Lovenox, ASA\n• Pain and antibiotics\n• Promote self care\n•\n\n● Pt. teaching ● Limitations\n\n38\n\n\fRheumatoid Arthritis\n• Inflammatory disorder of joints\n• Cause thought to be autoimmune\n\n• Genetics, environmental\n• High RA factor – blood lab testing\n\n39\n\n\fRheumatoid Arthritis (RA)\n● Chronic, progressive, and systemic\n● primarily effects synovial joints\n● Inflammatory response\n● cause pannus (Vascular granulation tissue, composed of\ninflammatory cells), lead to adhesion and calcification,\nerodes articular cartilage – destroys bone\n● Need early Dx.\n● to prevent permanent damage\n\n40\n\n\fA joint (the place where two bones\nmeet) is surrounded by a capsule\nthat protects and supports it. The\njoint capsule is lined with a type of\ntissue called synovium, which\nproduces synovial fluid that\nlubricates and nourishes joint\ntissues. In rheumatoid arthritis, the\nsynovium becomes inflamed,\ncausing warmth, redness, swelling,\nand pain. As the disease\nprogresses, the inflamed synovium\ninvades and damages the cartilage\nand bone of the joint. Surrounding\nmuscles, ligaments, and tendons\nbecome weakened. Rheumatoid\narthritis also can cause more\ngeneralized bone loss that may lead\nto osteoporosis (fragile bones that\nare prone to fracture).\n\n41\n\n\fRheumatoid Arthritis\n•\n\nNursing Interventions\n• Relief of acute pain using braces, splints\n\n• Decrease fatigue\n• Body positioning\n• Active Range of Motion\n\n42\n\n\fRA Pathophysiology\n\n43\n\n\fRA Joint Involvement\n\n44\n\n\f•RA effect on other areas in the body\n\n● Vasculitis-\n\n● Blood vessel involvement compromise blood flow to\n\norgan supplied by that blood vessel can be affected, end\nresult malfunctioning organ organ or system failure\n\n● Cause● Unknown, Combo environment and genetics\n\n● Theories\n● Immune complex- IgG or IgM (RA factor)\n● Associated with HLA\n● Probably autoimmune (Epstein-Barr virus)\n● Family Hx.\n● Hormones (male versus female)\n\n45\n\n\fCause of RA\n\n● SOME AREAS THAT ARE THOUGHT OF….\n● Gender- F &gt; M\n● Female reproductive hormones influence development\n\n● Virus- Epstein-Barr\n● Infectious organisms\n\n● Stress- Increase exacerbations\n● Physical emotional stresses, triggers\n\n● Smoking and coffee\n● Age\n● Young to middle – aged women\n\n46\n\n\fAssessment RA\n● Acute or chronic onset\n● S&amp;S\n● Early•\n•\n\nFatigue, stiffness, wt. loss\njoints synovitis bilaterally\n\n● Late•\n\nThe gel phenomenon (morning stiffness)\n•\n\nlasts 45 minutes to several hours after wakening\n\n● On palpation – joint effusion (swelling)\n● Muscle atrophy\n● Osteoporosis\n● Baker’s cyst –\n● enlarged popliteal bursae (tissue compression &amp; pain)\n\n47\n\n\f• Systemic assessment\n\nfor RA\n\n● Cutaneous nodules-FA\n● Vasculitis\n● Ischemic lesions - Small,\n\nbrownish spots, LE lesions may\nlead to ulcerations\n● Peripheral neuropathy\n● Respiratory● Pleurisy,\n● Pneumonitis,\n● fibrosis\n\n48\n\n\f● Cardiac● Carditis\n\n● Eyes\n● Syndromes\n• Sjogrens- Immune complex and\n\ninflammatory cells\n• Triad- Mucous Membranes = Dry eyes, dry\n\nmouth, dry vagina\n\n● Caplan’s syndrome● Nodules in lungs\n\n● Felty’s syndrome\n● Hepatosplenomegaly and leukopenia\n\n49\n\n\f● Diagnosis studies\n● RF – measures presence of unusual antibodies of IgG and IgM\nthat develop in a number of connective tissue diseases\n● ANA –measures titer of unusual antibodies that destroy the\nnuclei of cells &amp; cause tissue death in pts. with autoimmune\ndisease\n● Sed. rate- Inflammation\n● Serum complement - C3 &amp; C4 usually decreased in\nautoimmune diseases\n\n50\n\n\fDiagnostic studies for RA\n● Serum protein electrophoresis\n● IgG● Elevated needed to combine with RF\n● CBC- WBC up or down, platelets up\n● Arthrocentesis● RF, inflammatory cells\n● Other labs based on organ involvement\n51\n\n\fNursing Interventions Medications for\nRA\n● Salicylates\n● NSAID● Celebrex\n● Antimalarial● Slow disease and produce remissions. Quinine,\nPenicillimine\n● Cytotoxic● Methotrexate, Imuran, Cytoxan\n● S/E is decrease immunity\n\n● Gold● Maximum dose 1000mg (25-50mg/wk.)\n• Side effects\n52\n\n\fAge-related changes in musculoskeletal function can be within the muscles, joints, and bones.\nTo promote e ective strategies for good musculoskeletal system health, you want to encourage vitamin D,\nexercising, smoking sensation if the patients do smoke, and you have to teach them about any medications\nand side e ects that can impact any musculoskeletal function, safety, or movement.\nWith the age-related changes in musculoskeletal function, it could be a ected by disease, surgery, trauma,\nand age, and often the assessment is overlooked.\nNeurovascular assessment is very important, especially when you&#x27;re assessing the injured extremity.\nYou want to make sure you assess the skin color. Is it appropriate to their skin tone, or does it look necrotic,\npale, dusky, mottled?\nDo they have a response to painful stimuli? Are they complaining of numbness, tingling, or do they even have\nsensation?\nDo they have reﬂexes present and ability to move?\nCan they follow commands to move the extremity, as well as is the pulse present?\nIf the pulse is present, or if it&#x27;s not, because if it&#x27;s absent, that means they have poor circulation, and making\nsure that the cap reﬁll is less than three seconds.\nCertain labs that you want to look at is the phosphate.\nHyperphosphatemia can mean bone fractures, or it could mean the healing stage, as well as tumors.\nOr hypophosphatemia can mean something called osteomalacia.\nYou want to look at calcium.\nHypercalcemia usually means metastatic cancer to the bone, or a possible bone fracture in the healing stage.\nRemember, phosphorus and calcium has an inverse relationship.\nYou want to look at the alkaline phosphate, because an increase can mean metastatic cancer of the bone,\nand other metabolic disorders such as Paget&#x27;s disease or osteomalacia.\nYou want to look at the vitamin D, because with the vitamin D, you want to make sure it&#x27;s normal to promote\ncalcium and phosphorus absorption in the small intestine.\nCK levels will show if there&#x27;s anything a ected in the skeletal muscle.\nYour AST, an increase, can indicate skeletal muscle trauma or muscular dystrophy.\nYour ALD could cause an increase when there is muscular dystrophy, and as well as your LDH.\nIf there&#x27;s an increase in your LDH, you could have skeletal necrosis, cancer, or muscular dystrophy.\nDiagnostic workup can include an atherography, which is study of the joints using error contrast that can look\nfor bone chips, torn ligaments, or even loose body injuries.\nAn arthroscopy looks into the joints, so for example, the shoulder or the knee, or it could do surgical\nprocedures and possible biopsies of the synovial ﬂuid.\n\n\fNow a biopsy can look for, into the bone, looking for infection or neoplasm, and it could indicate for muscle\ndystrophy or atrophy.\nWith a biopsy, you have to ensure that there is an informed consent in the chart.\nA myelogram is a spinal puncture where injection of the contrast is injected into the subarachnoid space of\nyour spine.\nThis has been decreased in use because now we could utilize CTs or MRIs.\nWith any type of diagnostic procedures, speciﬁcally what we&#x27;re talking here is an arthroscopy, you want to\nassess the neurovascular status.\nYou want to make sure there are pulses present.\nYou want to make sure that the skin color is pink and the skin touch is too warm.\nThis indicates proper circulation.\nSo with any procedure, speciﬁcally like an arthroscopy, you want to assess the neurovascular status to make\nsure circulation is intact.\nSo you want to check to make sure pedal pulses are present.\nThe color, such as pink, is there. It doesn&#x27;t look dusky, pale, or necrotic.\nThey&#x27;re warm to touch to make sure that there is circulation again.\nAnd you want to teach patients regarding their safety and falls.\nTeach to prevent any complications such as pneumonia by teaching coughing and deep breathing and\nutilizing the incentive spirometer every two hours.\nAnd making sure that they use abduction pillow while in bed to maintain alignment.\nSome non-opioid pain management for these patients could be medications such as gabapentin, ketorolac,\nor ketamine.\nAnd you want to make sure you have an interprofessional team on board, such as case managers and\nphysical therapy.\nAn EMG will help diagnose any neuromuscular or lower motor neuron peripheral nerve disorders.\nAnd it will help evaluate if a patient is exhibiting muscle weakness.\nWhat happens is that there&#x27;s a low electrical current that passes through a ﬂat electrode that&#x27;s placed along\nthe nerves.\nIf a needle is used, you want to expect the site for any hematoma formation.\nYou want to also to make sure you ask the patient if they&#x27;re taking any over-the-counter herbal medications.\nBecause an EMG is contraindicated with herbal medications due to anticoagulation.\nMany herbal remedies may alter anticoagulation factors.\n\n\fBone scan, for example, like a radionuclide test, will have material injected to the skeletal muscles to detect\nany tumor, arthritis, osteomyelitis, osteoporosis, knee compression or fractures, or an unexplained bone\npain.\nIt&#x27;s extremely useful for hairline fractures.\nGallium or thallium scans is more speciﬁc and it&#x27;s sensitive in detecting any bone problems because it\nutilizes isotopes, which can migrate to the brain, liver, or breast tissue.\nThis can be used to examine these structures when disease is suspected.\nThallium scans are good for osteosarcoma.\nAn MRI is pretty much to help diagnose any musculoskeletal disorders that&#x27;s appropriate for joints or soft\ntissue or bony tumors.\nNow, the CT is a test of choice for injuries or pathology involving only the bone.\nWith the CT, especially if it&#x27;s utilizing contrast, you want to assess for any seafood or iodine allergy.\nSoft tissue injuries are carpal tunnel injuries to the meniscus and muscle spasms.\nSo carpal tunnel is a chronic problem.\nPretty much what occurs is that the median nerve and the wrist become compressed.\nThat causes the pain and numbness.\nThere are certain complications of certain metabolic and connective tissue diseases such as synovitis, which\nis inﬂammation of the synovium, which occur in patients often seen with RA.\nInjuries to the meniscus such as knee injury occur because the twisting of the leg and the knee is ﬂexed and\nthe foot is pretty much planted and placed ﬁrmly to the ground.\nThis causes pain, tenderness, swelling around the knee, or even a clicking or snapping sound.\nUsually a patient will do an arthroscope surgery and then muscle spasms.\nType of fractures are open or closed.\nSo open or compound fractures is usually when you have a skin that&#x27;s broken causing an external wound.\nAn enclosed or simple fractures have no visible wound and the fracture does not extend through the skin.\nThere are di erent types of fractures.\nFirst is the complete where you have a break across the width of the bone and it can be divided into sections.\nAn incomplete is when you have a breakthrough in part of the bone, but it doesn&#x27;t divide completely.\nA pathological fracture occurs usually over minimal trauma, which can occur with patients who have cancer\nor osteoporosis.\nA stress fracture is caused by excess stress or strain on the bone.\nAnd a compressed fracture is produced by a loading force that&#x27;s applied to the long axis of the bone.\n\n\fAnd the vertebrate force of the long axis can cause things such as osteoporosis.\nPatients who are usually at most risk for DVTs when it comes to a fracture are patients who have femur\nfractures because of the big bone with the bone marrow.\nPart of the treatment of fractures is immobilization.\nThe ﬁrst option is a cast, which could be used for fractures of the upper and lower extremity.\nIt could prevent deformities, prevent complications.\nSo you have to realize that when a patient gets a new cast, there will be swelling.\nAnd once the swelling decreases, it will be loose ﬁtting.\nSo they have to re-go in between one to two days to get it resized.\nNow, if a patient is also feeling that there&#x27;s tightness or they&#x27;re having any pu y ﬁngers, you have to think the\nworst case scenario, which is a compartment syndrome.\nAnd this needs to be evaluated and checked by the doctor as soon as possible.\nWith traction, I will talk about it in the next slide.\nAnd the third option is external ﬁxation or internal ﬁxation.\nThis is a type of surgery that physicians usually make a small percutaneous incision and pins can be\nimplanted to the bone after the fractures.\nThis leads to minimal blood loss and allows for early ambulation and promotes healing.\nAnd this is usually what is selected by the doctors for any type of fractures nowadays.\nThis is a picture of attraction and it helps keeps the bone or the fractured bone realigned.\nWith this picture, you want to ensure that weights are always remain freely hanging because if you ever see\nthem on the ﬂoor, you have to notify the health provider.\nThat means the fractured bone is not aligned.\nAnd it is the arm&#x27;s responsibility to assess and clean pins if there are pins available to ensure that you prevent\nany infections as ordered by the doctor.\nAnd usually each pin care is done with each shift.\nSome patients may need to require some types of assistive devices such as canes.\nSo make sure that you educate patients on utilizing the cane on the una ected side.\nThere are di erent types of fractures of the hip.\nIt could be intracapsular or extracapsular.\nIntracapsular is within the joint of the capsule and extracapular is outside of the joint.\n\n\fSo treatment of choice is usually surgical repair, which is known as an ORIF or open reduction with internal\nﬁxation.\nWith an ORIF, it allows the surgeons to directly view the fracture site and use metal pins, screws, rods and\nplates or a prosthesis to immobilize the site while healing.\nThe plan of care for these patients after surgery is that you want to ensure you elevate the heels o the bed to\nprevent any pressure injuries.\nYou want to ambulate the patient ﬁrst post-op day.\nYou want to ensure to reposition the patient every two hours while in bed to prevent again pressure injury.\nThis is all to prevent skin breakdown.\nAlso, the patients with hip replacements, you want to educate them that they are not allowed to bend down at\nthe hip.\nYou want to make sure they continue exercises and movements so they don&#x27;t decondition.\nYou want to teach them to not cross their legs and you want to keep the incision clean, dry and intact.\nFor pain management, you want to manage pain, especially when they&#x27;re moving or prior to ambulation,\nbecause sometimes patients will not want to get out of bed when they&#x27;re in pain and we want to have them\nambulate.\nWhen patients usually have multiple fractures, you also want to sometimes educate that the patient may be\non a PCA for pain management.\nAnd like I said, early ambulation and physical therapy is what helps actually promote healing quicker.\nSo fracture healing, one of the biggest things you want to make sure to prevent is infection or delay wound\nhealing that can lead to decreased function.\nSo obviously observe for signs and symptoms of an infection and prevent infections such as cellulitis,\nosteomyelitis, myositis and other type of necrosis, etc.\nNow with any type of surgery or after surgery, some interventions to also help prevent is minimizing the cause\nof embolisms.\nTo minimize embolism issues, you want to make sure you have the patient get up and ambulate the ﬁrst day\nof post-ops, because early ambulation will promote circulation.\nYou want to promote ﬂuids as long as it&#x27;s not contraindicating the patient.\nYou want to make sure you have things that promote circulation while they&#x27;re in bed, such as SEDs.\nAnd then they may be on anticoagulation medications if they are high risk.\nComplications of fractures.\nThe number one thing I want you to understand is acute compartment syndrome is an emergency.\nThis is something that you always want to assess for.\n\n\fSigns and symptoms of acute compartment syndrome is that they&#x27;re going to complain of numbing or tingling\nto the extremity.\nAnd this again has to be notiﬁed to the doctor right away because it&#x27;s a serious condition.\nAnd that means that there&#x27;s an increased pressure within the compartment which reduces circulation.\nTreatment is a fasciotomy which is surgery.\nYou want to prevent infection.\nObviously wound infection to the wound or skin which could be cellulitis.\nIt could be all the way to the bone known as osteomyelitis.\nAnd it may become so severe that it causes necrosis leading to possible amputation.\nYou want to monitor for hypovolemic shock because bone is very vascular.\nSo they are a very high risk of bleeding.\nSo trauma to any arteries can cause hemorrhaging.\nYou want to ensure that you monitor for fat embolism.\nThis is a result of a fracture because fat globules are released from the yellow bone marrow into the blood.\nAnd they act as small, small embolisms.\nThe earliest manifestation of fat embolism is that the patient will be altered level.\nIt can cause low arterial AO2 leading to hypoxemia, dyspnea, and tachypnea.\nObviously venous thromboembolism, DVT or PE.\nDelayed union is which occurs when the fracture hasn&#x27;t healed within six months of injury.\nNon-union meaning they never completely heal.\nAnd malunion is that it healed incorrectly.\nOne more thing that I want you to understand with complications is that you could have a re-dislocation.\nAnd to prevent re-dislocation of the fracture, you want to use an abduction pillow.\nAnd it helps the patient keep their hip in proper position.\nSo with amputation, there is a multidisciplinary care of the patient who had an amputation.\nPre- and post-operative care and management is just like any patient who goes into surgery.\nPhantom limb pain we will discuss on the next slide.\nThings like psychosocial problems, imaging, loss of independence, ADLs, etc.\nThat&#x27;s something you have to change and address because it could be a huge change in the patient&#x27;s life.\nSo you have to ensure that they have a good support system.\n\n\fAgain, how are they going to ambulate?\nWhat are they going to do with prosthesis?\nLearning how to reambulate with that.\nAnd then any age-related implications.\nSo types of amputations are either elective or traumatic.\nElective is when it&#x27;s related to complications such as PVD or diabetes mellitus and some type of infection\nthat caused infection to the bones.\nOr it could be traumatic, which is a result from accidents or war.\nTypes of levels of amputations for lower extremities is BKA, known as below the knee amputation, or AKA,\nwhich is above the knee amputation.\nSome complications that occur with amputations is hemorrhaging, which can lead to hypovolemic shock,\nagain infection, and pain, which is known as phantom limb pain.\nIt&#x27;s an unpleasant or painful sensation that&#x27;s felt after each amputated part.\nYou have to always still assess for pain levels with patients who have phantom limb pain, because remember,\npain is whatever the patient states it is.\nNeuroma, which is a sensitive tumor that&#x27;s consisting of damaged nerve cells, or ﬂexion contractures.\nYou have to avoid this so that patient can ambulate with a prosthetic.\nAnd to prevent contractures, you want to encourage range of motion exercises.\nAnd in nursing interventions, on top of that, you want to have to make sure you have pain control to prevent\ninfection and contractures.\nSo depending on the type of amputation, patients may get prosthetics.\nPatients who do get prosthetics, you have to educate them that the prosthetics are made individually or\nspeciﬁc to that patient,\njust because of the patient&#x27;s own body shape, etc.\nYou want to make sure that they use the correct liners to ensure that they won&#x27;t cause any wound issues or\ninfections on the skin.\nAnd you want to maintain follow-up appointments to ensure that the prosthetics is ﬁtting appropriately, etc.\nSo osteoarthritis, or DJD, generative joint disorder, is a progressive deterioration and loss of cartilage and\nbone in one or more joints.\nThere are two types, primary and secondary.\nPrimaries caused by aging and genetic factors.\nAnd secondary results from joint injury and obesity.\n\n\fSo with these patients for secondary, you want to educate the patient to lose weight ﬁrst.\nThis can result from also metabolic diseases such as diabetes mellitus,\nPeggitt&#x27;s disease of the bone, and it can result from blood disorders such as hemophilia or sickle cell disease.\nRisk factors for OA or DJD is age, obesity, like I said, to encourage losing weight, postmenopausal patients,\ncomorbidities, and sports injuries.\nWhile doing assessment, you want to ask for the patient&#x27;s history.\nYou want to look at labs because they may have an elevated ESR level for inﬂammation.\nIt may be unilateral.\nPain will decrease with rest.\nThe patient may have crepitus, which is continuous grating sensation or sounds like a popcorn or Rice\nKrispies sensation.\nThey could have joint sti ness, joint changes speciﬁcally in the hands.\nSo if you look at herbatin&#x27;s nodes, which is swelling of the distal interphalangeal joints,\nor Bouchard&#x27;s nodes, which is swelling of the proximal interphalangeal joints,\nyou always want to assess the patient&#x27;s distal ﬁnger joints speciﬁcally for these nodes.\nJoint infusion can occur because there&#x27;s excess joint ﬂuid, which is common when knees are involved.\nIf there&#x27;s spinal involvement, they could have issues in the lumbar region, which is your L3 to L4.\nIt could be in the cervical region, which is the C4 to C6.\nAnd you could have compression of the spinal nerve roots, which results in the vertebral facet bone spurs.\nAnd this can cause radiation of pain, sti ness, and muscle spasms.\nYou want to assess for functional assessment because severe pain and deformity can interfere with ADLs and\neven ambulation.\nSo a lot of times patients are referred to PT and OT.\nYou want to assess for psychosocial because permanent changes in lifestyle, role changes, socialization, and\nconstant pain can decrease the quality of life, sexuality, and cause daily stress.\nYou want to sometimes look at diagnostic studies such as ESR, which is inﬂammation.\nYou could have high-sensitivity reactive protein, do x-rays, MRIs, or bone scans.\nSome nursing interventions is that you want to manage the pain with medications such as Tylenol, NSAIDs, or\nsteroids.\nAcetaminophen or Tylenol is the ﬁrst line or ﬁrst medication choice.\nThey could have muscle relaxants such as Flexeril.\n\n\fBut usually they don&#x27;t try to do anything potent such as narcotic.\nThey only start prescribing that for chronic issues.\nWith position, you want to have them rest and you want to give them psychological rest as well.\nPossible hot or cold therapy just depending if it&#x27;s pain versus inﬂammation.\nAgain, if it&#x27;s caused by weight gain, you want to have weight control.\nThere are some complementary or alternative type medication for pain management such as the TENS\nmachine, acupuncture, music therapy, etc.\nAnd there are some topical drug applications such as cayenne pepper or lidocaine patches.\nSurgical management such as total joint arthroplasty is a surgical creation of a joint.\nAn osteotomy is bone resection that&#x27;s used to correct joint deformities.\nSo TJR, which is total joint replacement, is the last resort.\nHowever, it&#x27;s contraindicated for patients who have end-stage generative type diseases.\nWith any surgery, you want to teach about pre and post-op care with understanding based on their learning\nneeds.\nAgain, you also want to teach about BTE prophylaxis.\nAnd then you want to make sure these patients are out of the bed post-op day one with physical therapy.\nAgain, with nursing interventions, you want to assess for complications such as infection, skin breakdown,\nand safety.\nYou want to give medications such as anticoagulants, lovinox, or aspirin, pain management, and possible\nantibiotics.\nAnd promote self-care.\nLike I said, these are the same as any other post-operative patient.\nAnd again, patient teaching, any limitations, and any other nursing education that they need with any\nmedications or plan of care.\nSo rheumatoid arthritis is an autoimmune disorder that&#x27;s causing inﬂammatory disorder of the joints.\nIt could be possible genetics and environmental.\nAnd usually these patients have a high RA factor, which is a blood or lab test.\nRA is a chronic progressive and systemic issue that primarily a ects synovial joints.\nThe inﬂammatory response causes vascular granulation, which leads to inﬂammatory cells.\nSo what happens is with the autoimmune disorder is that the antibodies lead to inﬂammation and consist of\nan autoimmune response, which causes that inﬂammation.\n\n\fYou need to have an early diagnosis to help prevent any permanent damage.\nNursing interventions is pretty much to relieve acute pain, which is by pain management.\nThey could possibly use braces or splints.\nYou want to help decrease fatigue, help with body positioning, and continue active range of motion to prevent\nany loss of ADLs.\nSo things that they could do to help with active range of motion is providing ADLs, such as grab bars or long\nhandles, which can help with the grasp and grabbing motion of the hands.\nYou will see on the picture on the right, the abnormal sti ening and immobility of the bone.\nHere you would assess the patient for any redness, hot feeling, swelling on the wrist, hands, or ﬁngers.\nThis is where you would look for an assessment to make sure that there is no redness, swelling, heat coming\nfrom the patient&#x27;s wrists, hands, or ﬁngers.\nSo RA has e ects on other areas of the body.\nFirst is vasculitis, because you&#x27;ll have a compromise of blood ﬂow, which can lead to malfunctioning of the\norgan, leading to organ or system failure.\nThe cause for this again is unknown.\nIt could be a combination of environments or genetics.\nThe theory for this is that it could be issues with immune complex, IgG or IgM.\nIt can be associated with blood diseases such as HLA.\nIt could again be autoimmune, such as Epstein-Barr virus, family history, or it could be hormones.\nRA, it&#x27;s usually found mostly in female reproductive hormones that inﬂuence the development.\nSo females are a lot more prone to RA.\nInfectious organisms can cause RA such as the Epstein-Barr virus.\nIt can be caused by stress and increased exacerbations for RA as well as stress.\nPhysical or emotional stress can trigger it.\nSmoking and co ee and again age, which is usually young to middle-aged women.\nAssessing RA, it could be either acute or chronic onset.\nSigns and symptoms early on is fatigue, sti ness, weight loss, joint synovitis bilaterally.\nAnd late is something called the gel phenomenon, which is morning sti ness.\nAnd it can last about 45 minutes to several hours after awakening.\nOn palpitation, you could feel some swelling in the joints.\nThey could have muscle atrophy, osteoporosis, and possible Baker cysts, which is enlarged palpital bursae,\n\n\fwhich is the tissue compression and pain.\nAgain, systemic assessment for RA could be cutaneous nodules, vasculitis, ischemic lesions, which could be\nsmall brownish spots to the lower extremity and can lead to ulcerations.\nPeripheral neuropathy.\nAnd with respiratory system, you could have possible pleurisy, pneumitis, or ﬁbrosis.\nWith the cardiac system, you could have carditis.\nWith the eyes, you could have syndromes such as sujorgens, which is an immune complex and inﬂammatory\ncell.\nUsually, it causes visual disturbance.\nAnd that&#x27;s the ﬁrst thing that patients will complain of is in visual disturbances.\nYou could have triad issues such as dry mucous membranes of the eyes, mouth, and vagina for females.\nYou could have Kaplan&#x27;s syndrome, which is nodules in the lungs.\nAnd Felty syndrome, which is hepatosplenomegaly and leukopenia, which you have low WBCs and an\nenlarged liver and spleen.\nLate signs and symptoms of RA is Felty syndrome, joint deformity, and weight loss.\nDiagnostic studies is the RA factor, which measures the presence of unusual antibodies of IgG and IgM that\ndevelop in a number of connected tissue diseases.\nPossible ANA, which measures the titer of unusual antibodies that destroy the nuclei of cells and can cause\ntissue death in patients with autoimmune disorders.\nSedimentation rate, or ESR, will ﬁnd inﬂammation.\nAnd serum complement C3 and C4 usually is decreased in autoimmune diseases.\nSome diagnostic studies for RA is serum protein electrophoresis, IgG, which is elevated, but it needs to be\ncombined with the RF factor.\nThe CBC could demonstrate WBCs could be either elevated or low, but platelets are high.\nIf they do arthrocentesis, they&#x27;ll ﬁnd the rheumatoid factor or inﬂammatory cells in other labs based on organ\ninvolvement.\nNursing interventions and medications for RA are salicylates.\nAnd SEDs such as celibrex, anti-malarial agents that slow the disease and produce remissions.\nCytotoxic medications such as methotrexate.\nA side e ect for methotrexate is decreased immunity.\nSo patients who are on these medications, you have to educate that they should avoid acetaminophen, rest\nto decrease pain, stay away from large crowds or patients or people who have illness.\n\n\fYou want to treat patients with folic acid and vitamin B medications to decrease side e ects.\nAnd then the gold standard is Enbrel or Intracept.\nUsually this is given IM injections or sub-Q.\nSo you do have to teach patients about injections.\nSome non-pharmacological interventions are I-specs, which are good for acute inﬂammation.\nYou want to teach patients to also protect their synovial joints by using both hands when they&#x27;re holding\nobjects instead of just one to decrease the weight.\nYou want to use the palm of their hands when getting up and out of bed or the chair to again distribute weight\nproperly.\nYou want to use a rubber device grip to open jars to help with the function of the ﬁngers.\nAnd you also want to use long handle devices with extension handles.\n\n\f</div>"});

function parseAIJson(raw){
 let s=raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
 try{return JSON.parse(s);}catch(e1){}
 s=s.replace(/[\u201C\u201D]/g,'"').replace(/[\u2018\u2019]/g,"'");
 s=s.replace(/,\s*([\]\}])/g,'$1');
 try{return JSON.parse(s);}catch(e2){}
 const last=s.lastIndexOf('},');
 if(last>0){try{return JSON.parse(s.substring(0,last+1)+']');}catch(e3){}}
 throw new Error('Could not parse AI response as JSON');
}
function extractJsonArray(raw){var s=String(raw).replace(/```json/gi,'').replace(/```/g,'');var st=s.search(/\[\s*\{/);if(st<0)return s.trim();
 var depth=0,inStr=false,escp=false;for(var i=st;i<s.length;i++){var c=s[i];if(inStr){if(escp)escp=false;else if(c==='\\')escp=true;else if(c==='"')inStr=false;continue;}
  if(c==='"')inStr=true;else if(c==='['||c==='{')depth++;else if(c===']'||c==='}'){depth--;if(depth===0)return s.slice(st,i+1);}}
 return s.slice(st);}
function extractJsonObject(raw){var s=String(raw).replace(/```json/gi,'').replace(/```/g,'');var a=s.indexOf('{'),b=s.lastIndexOf('}');return a>=0&&b>a?s.slice(a,b+1):s;}
function sanitizeQuestions(arr){
 return arr.map(q=>{
  if(!q||!q.stem||!Array.isArray(q.options))return null;
  q.options=q.options.map(o=>String(o).replace(/^[A-Da-d][.)]\s*/,'').trim());
  if(q.format==='sata'){
   if(!Array.isArray(q.sataCorrIdx))q.sataCorrIdx=[];
   q.sataCorrIdx=q.sataCorrIdx.map(Number).filter(n=>!isNaN(n)&&n>=0&&n<q.options.length);
  }
  if(typeof q.correct==='string'&&q.correct.length===1){q.correct=q.correct.toUpperCase().charCodeAt(0)-65;}
  q.correct=Number(q.correct);
  return q;
 }).filter(Boolean);
}
function validateQuestion(q){
 if(!q.stem||q.stem.length<20)return false;
 if(!Array.isArray(q.options)||q.options.length<4)return false;
 if(q.format==='mcq'||q.format==='scenario'){
  if(typeof q.correct!=='number'||q.correct<0||q.correct>=q.options.length)return false;
 }
 if(q.format==='sata'){
  if(!Array.isArray(q.sataCorrIdx)||q.sataCorrIdx.length<2)return false;
  if(q.sataCorrIdx.some(i=>i<0||i>=q.options.length))return false;
 }
 if(!q.rationale||q.rationale.length<30)return false;
 const allText=(q.stem+' '+q.options.join(' ')).toLowerCase();
 let matchCount=0;
 for(const group of TOPIC_GROUPS){if(group.some(t=>allText.includes(t)))matchCount++;}
 if(matchCount>=4)return false;
 return true;
}

function errHTML(e,extra){return '<div class="emsg"><b>'+esc(e.message)+'</b>'+(extra||'')+'<details style="margin-top:6px"><summary class="small">Debug details</summary><pre class="small" style="white-space:pre-wrap">status: '+esc(e.status)+'\n'+esc(e.body||e.stack||'')+'</pre></details></div>';}
function qBlockHTML(q,prefix,g,onPick,onSata){
 var meta='<div class="qmeta"><span class="tag">'+esc((q.format||'mcq').toUpperCase())+'</span>'+(q.adpie?'<span class="tag">'+esc(q.adpie)+'</span>':'')+(q.system?'<span class="tag">'+esc(q.system)+'</span>':'')+(q.topic?'<span class="tag">'+esc(q.topic)+'</span>':'')+'</div>';
 var body;if(q.format==='sata'){body='<div class="small">Select all that apply.</div>'+q.options.map(function(o,i){return '<label class="sata"><input type="checkbox" data-gidx="'+prefix+g+'" value="'+i+'"> <span>'+String.fromCharCode(65+i)+'. '+esc(o)+'</span></label>';}).join('')+'<button class="btn" style="margin-top:6px" id="'+prefix+'sb'+g+'" onclick="'+onSata+'('+g+')">Submit</button>';}
 else body=q.options.map(function(o,i){return '<button class="opt" onclick="'+onPick+'('+g+','+i+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>';}).join('');
 return meta+'<div class="qstem">'+esc(q.stem)+'</div><div id="'+prefix+'opts'+g+'">'+body+'</div><div id="'+prefix+'rat'+g+'"></div>';}
function markMCQ(box,q,pick){var bs=box.querySelectorAll('.opt');bs.forEach(function(b,i){b.disabled=true;if(i===q.correct)b.classList.add('right');else if(i===pick)b.classList.add('wrong');});return pick===q.correct;}
function markSATA(prefix,g,q){var sel=[];document.querySelectorAll('input[data-gidx="'+prefix+g+'"]').forEach(function(c){c.disabled=true;if(c.checked)sel.push(+c.value);var lab=c.parentNode;var isC=q.sataCorrIdx.indexOf(+c.value)>=0;if(isC)lab.style.borderColor='var(--green)';else if(c.checked)lab.style.borderColor='var(--red)';});
 var sb=$(prefix+'sb'+g);if(sb)sb.remove();var a=sel.slice().sort().join(','),b=q.sataCorrIdx.slice().sort().join(',');return a===b;}
function ratHTML(q,ok){var corr=q.format==='sata'?q.sataCorrIdx.map(function(i){return String.fromCharCode(65+i);}).join(', '):String.fromCharCode(65+q.correct);return '<div class="rat"><b class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct':'❌ Not quite — answer: '+corr)+'</b><div style="margin-top:4px">'+esc(q.rationale)+'</div></div>';}
function buildQPrompt(ctx,n,fmt,adpie,diffTxt,avoid,topicsLine,flagged){
 return 'You are an expert NCLEX item writer for a medical-surgical nursing course (musculoskeletal unit). Write '+n+' high-quality questions using ONLY the facts in the CONTENT below.\n'+
 (flagged?'HARD CONSTRAINT: every question MUST test a fact that appears in the FLAGGED CONTENT. Do not test anything outside it.\n':'')+
 (topicsLine?'Distribute questions across these topics in this order: '+topicsLine+'\n':'')+
 'FORMAT: '+(fmt==='mixed'?'mix of mcq, scenario (clinical vignette in the stem), and sata':fmt)+'. MCQ/scenario: exactly 4 options, "correct" is the 0-based index. SATA: 5-6 options, 2-4 correct, list 0-based indexes in "sataCorrIdx".\n'+
 'ADPIE: '+(adpie==='any'?'vary phases':'all questions in the '+adpie+' phase')+'.\n'+(diffTxt?'DIFFICULTY: '+diffTxt+'\n':'')+
 'Rules: plausible distractors of similar length; no "all of the above"; no letter prefixes in options; each question tests a different concept.'+(avoid&&avoid.length?' Do NOT repeat these already-tested concepts: '+avoid.slice(-40).join('; ')+'.':'')+'\n'+
 'Respond with ONLY a JSON array, no prose, no markdown. Each item: '+QTEMPLATE+'\n\n'+(flagged?'FLAGGED CONTENT:\n':'CONTENT:\n')+ctx;}
