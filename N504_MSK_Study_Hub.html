<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N504 · Musculoskeletal Study Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#fafafa;--sf:#fff;--sf2:#f5f5f5;--tx:#111;--tx2:#444;--mu:#999;--bd:#e5e5e5;--ac:#111;--inv:#fff;
--hi-red:rgba(170,20,20,.045);--hi-blue:rgba(20,60,160,.04);--hi-green:rgba(20,120,60,.045);--hi-amber:rgba(190,120,0,.06);--hi-purple:rgba(100,40,150,.045);
--red:#b3261e;--amber:#a86b00;--green:#1f6f43;--blue:#1d4f91;--purple:#5b2d8a;
--f-h:'Syne',system-ui,sans-serif;--f-m:'IBM Plex Mono',ui-monospace,monospace;--f-b:'Inter',system-ui,sans-serif}
body.dark{--bg:#0f0f0f;--sf:#1a1a1a;--sf2:#222;--tx:#f0f0f0;--tx2:#bbb;--mu:#777;--bd:#333;--ac:#f0f0f0;--inv:#111;
--hi-red:rgba(255,90,90,.06);--hi-blue:rgba(100,150,255,.06);--hi-green:rgba(90,200,130,.06);--hi-amber:rgba(255,190,60,.07);--hi-purple:rgba(180,120,255,.06);
--red:#ff7a70;--amber:#e0a93a;--green:#6fcf97;--blue:#86aef0;--purple:#c29bf0}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--f-b);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--f-h);font-weight:800;margin:0;letter-spacing:-.01em}
a{color:var(--tx)}
button{font-family:var(--f-m);cursor:pointer}
.btn,.mini,.rtybtn{background:var(--tx);color:var(--inv);border:1px solid var(--tx);border-radius:4px;padding:8px 14px;font-size:.78rem}
.btn:hover,.mini:hover,.rtybtn:hover{opacity:.85}
.mini{padding:3px 8px;font-size:.68rem;background:transparent;color:var(--tx);border-color:var(--bd)}
.mini.on{background:var(--tx);color:var(--inv)}
.btn.ghost{background:transparent;color:var(--tx);border-color:var(--bd)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font-family:var(--f-b);font-size:.88rem;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:7px 9px}
textarea{width:100%;min-height:110px;resize:vertical;line-height:1.5}
label{font-family:var(--f-m);font-size:.72rem;color:var(--tx2)}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
/* header */
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand h1{font-size:1.15rem}
.brand .sub{font-family:var(--f-m);font-size:.66rem;color:var(--mu)}
.mastery{display:flex;align-items:center;gap:8px;font-family:var(--f-m);font-size:.72rem;min-width:170px}
.mbar{width:90px;height:6px;border:1px solid var(--bd);border-radius:2px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--tx);width:0}
.duebadge{font-family:var(--f-m);font-size:.68rem;border:1px solid var(--tx);border-radius:2px;padding:2px 6px}
.duebadge.z{border-color:var(--bd);color:var(--mu)}
.topact{margin-left:auto;display:flex;align-items:center;gap:6px;position:relative}
.iconbtn{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:4px;width:32px;height:32px;font-size:.95rem}
#searchbox{width:230px}
.scount{font-family:var(--f-m);font-size:.68rem;color:var(--tx2);display:none;align-items:center;gap:3px}
.scount.show{display:flex}
.scount button{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:3px;padding:1px 6px;font-size:.7rem}
#sdrop{position:absolute;top:38px;right:0;width:360px;max-height:60vh;overflow:auto;background:var(--sf);border:1px solid var(--bd);border-radius:4px;display:none;z-index:80}
#sdrop.show{display:block}
.sres{padding:8px 10px;border-bottom:1px solid var(--bd);cursor:pointer}
.sres:hover{background:var(--sf2)}
.sres .st{font-family:var(--f-m);font-size:.62rem;color:var(--mu)}
.sres .sn{font-size:.85rem}
mark{background:rgba(255,210,0,.45);color:inherit;padding:0 1px}
mark.cur{background:rgba(255,120,0,.7)}
/* nav */
.navwrap{display:flex;align-items:stretch;border-bottom:1px solid var(--bd);background:var(--bg);position:sticky;top:53px;z-index:40}
.navarr{background:transparent;border:0;border-right:1px solid var(--bd);color:var(--tx);width:34px;font-size:.8rem;flex:0 0 auto;transition:opacity .2s}
.navarr:last-child{border-right:0;border-left:1px solid var(--bd)}
.navarr.dim{opacity:.2}
#tabnav{display:flex;overflow-x:auto;scrollbar-width:none;flex:1;scroll-behavior:smooth}
#tabnav::-webkit-scrollbar{display:none}
.tabbtn{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--tx2);padding:11px 13px;font-size:.74rem;white-space:nowrap}
.tabbtn.active{border-bottom-color:var(--tx);color:var(--tx);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:22px 16px 90px}
.tabpanel{display:none}
.tabpanel.active{display:block}
.tabhead{margin-bottom:16px}
.tabhead h2{font-size:1.9rem;line-height:1.1}
.tabhead p{color:var(--tx2);margin:6px 0 0;max-width:75ch}
/* quick hits */
.qh{border-left:2px solid var(--tx);background:var(--sf2);padding:12px 16px;margin:0 0 18px;font-family:var(--f-m);font-size:.78rem}
.qh .qhl{font-weight:600;margin-bottom:6px}
.qh ul{margin:0;padding-left:18px}
.qh li{margin:3px 0}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-left:3px solid var(--tx);border-radius:4px;padding:14px 16px;transition:border-left-color .15s}
.card:hover{border-left-color:var(--mu)!important}
.card.flagged{border-color:var(--red);border-left-color:var(--red)!important}
.chead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}
.chead h3{font-size:1rem;line-height:1.25}
.cbadges{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;flex:0 0 auto;max-width:48%}
.stamp,.srsb,.lvb,.tag{font-family:var(--f-m);font-size:.6rem;border:1px solid var(--bd);border-radius:2px;padding:1px 5px;white-space:nowrap}
.stamp.hy{border-color:var(--red);color:var(--red)}
.srsb.due{background:var(--tx);color:var(--inv);border-color:var(--tx)}
.srsb.soon{border-color:var(--mu);color:var(--tx2)}
.srsb.ok{border-color:transparent;color:var(--mu)}
.lvb{color:var(--mu);border-color:var(--bd)}
.lvb.never{border-style:dashed}
.card-body{font-size:.88rem;color:var(--tx)}
.card-body ul,.card-body ol{margin:4px 0;padding-left:18px}
.card-body li{margin:3px 0}
.card-body p{margin:5px 0}
.card-body table,.rtable{border-collapse:collapse;width:100%;font-size:.8rem;margin:6px 0}
.card-body th,.card-body td,.rtable th,.rtable td{border:1px solid var(--bd);padding:5px 7px;text-align:left;vertical-align:top}
.card-body th,.rtable th{font-family:var(--f-m);font-size:.68rem;background:var(--sf2);font-weight:600}
.tscroll{overflow-x:auto}
.cact{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
li.mk::before{content:'⭐ MUST KNOW';font-family:var(--f-m);font-size:.56rem;color:var(--amber);border:1px solid var(--amber);border-radius:2px;padding:0 4px;margin-right:5px;vertical-align:1px}
.al{border-left:2px solid var(--tx);padding:7px 10px;margin:8px 0;font-size:.84rem;border-radius:0}
.al.red{border-color:var(--red);background:var(--hi-red)}
.al.blue{border-color:var(--blue);background:var(--hi-blue)}
.al.green{border-color:var(--green);background:var(--hi-green)}
.al .alh{font-family:var(--f-m);font-size:.66rem;font-weight:600;display:block;margin-bottom:2px}
.mn{border-left:2px solid var(--purple);background:var(--hi-purple);padding:7px 10px;margin:8px 0;font-size:.84rem}
.mn .alh{font-family:var(--f-m);font-size:.66rem;font-weight:600;color:var(--purple);display:block}
.prof{border:1px solid var(--amber);border-left:3px solid var(--amber);background:var(--hi-amber);padding:7px 10px;margin:8px 0;font-size:.84rem}
.prof .alh{font-family:var(--f-m);font-size:.66rem;font-weight:600;color:var(--amber);display:block}
.lab-n{font-family:var(--f-m);font-size:.72rem;border:1px solid var(--green);color:var(--green);border-radius:2px;padding:0 4px;white-space:nowrap}
.lab-c{font-family:var(--f-m);font-size:.72rem;border:1px solid var(--red);color:var(--red);border-radius:2px;padding:0 4px;white-space:nowrap}
/* mind maps */
.maprow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.mapbtn{background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:3px;padding:5px 9px;font-size:.72rem}
.mapbtn.on{border-color:var(--tx);background:var(--sf2)}
.mm{border:1px solid var(--bd);background:var(--sf);border-radius:4px;padding:16px;margin:0 0 16px;animation:mmin .25s ease}
@keyframes mmin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mmc{display:inline-block;background:var(--tx);color:var(--inv);border-radius:3px;padding:8px 14px;font-family:var(--f-h);font-weight:800;margin-bottom:12px}
.mmk{font-family:var(--f-m);font-size:.62rem;color:var(--mu);margin-left:8px}
.mmb{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mmn{border:1px solid var(--bd);border-top:3px solid var(--tx);border-radius:3px;background:var(--sf)}
.mmn h4{font-family:var(--f-m);font-size:.72rem;font-weight:600;padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;user-select:none}
.mmn h4:hover{background:var(--sf2)}
.mmn ul{margin:0;padding:0 10px 10px 26px;font-size:.82rem;max-height:600px;overflow:hidden;transition:max-height .25s ease,padding .25s}
.mmn.col ul{max-height:0;padding-bottom:0}
.mmn.col h4 .car{transform:rotate(-90deg)}
.car{display:inline-block;transition:transform .2s}
/* drug cards */
.fbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.drug-flip{perspective:1000px;height:340px;cursor:pointer}
.drug-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.drug-flip.flipped .drug-inner{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--bd);border-radius:4px;padding:14px;overflow:auto}
.drug-front{background:var(--sf)}
.drug-back{background:#111;color:#fff;transform:rotateY(180deg);font-size:.76rem;border-color:#111}
.drug-flip.flagged .card-face{border-color:var(--red)}
.drug-front h3{font-size:1.1rem}
.dgen{font-family:var(--f-m);font-size:.68rem;color:var(--tx2);margin:3px 0 8px}
.dsl{font-family:var(--f-m);font-size:.58rem;font-variant:small-caps;letter-spacing:.06em;opacity:.6;display:block;margin-top:7px}
.dcontra{color:#ff9d96}
.dtools{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:2}
.dtools button{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:3px;font-size:.72rem;padding:1px 6px}
.drug-back .dtools button{background:#111;color:#fff;border-color:#444}
.fliphint{position:absolute;bottom:10px;left:14px;font-family:var(--f-m);font-size:.6rem;color:var(--mu)}
/* qv */
.qvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.qv-card{background:var(--sf);border:1px solid var(--bd);border-left:3px solid var(--tx);border-radius:4px;padding:12px 14px}
.qv-card.flagged{border-color:var(--red)}
.qv-card h4{font-size:.95rem;margin-bottom:6px;display:flex;justify-content:space-between;gap:6px}
.qv-card ul{margin:0;padding-left:18px;font-size:.83rem}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.stat{border:1px solid var(--bd);border-radius:4px;padding:12px;background:transparent}
.stat b{font-family:var(--f-h);font-size:1.6rem;display:block}
.stat span{font-family:var(--f-m);font-size:.66rem;color:var(--tx2)}
.bars{margin:8px 0 20px}
.barrow{display:grid;grid-template-columns:200px 1fr 60px;gap:10px;align-items:center;font-size:.8rem;margin:5px 0}
.barrow .tr{height:8px;border:1px solid var(--bd);border-radius:2px;overflow:hidden}
.barrow .tr i{display:block;height:100%}
.tg{background:#111}.ta{background:#666}.trd{background:#ccc}
body.dark .tg{background:#f0f0f0}body.dark .ta{background:#888}body.dark .trd{background:#444}
.duebanner{border:1px solid var(--tx);border-radius:4px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 16px;flex-wrap:wrap}
.sec{font-family:var(--f-h);font-size:1.05rem;margin:18px 0 8px}
.confirmbox{border:1px solid var(--red);border-left:3px solid var(--red);padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
/* quiz */
.panel{border:1px solid var(--bd);background:var(--sf);border-radius:4px;padding:14px;margin-bottom:14px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.ctrls>div{display:flex;flex-direction:column;gap:3px}
.modebar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.keypanel{background:var(--sf2);border:1px solid var(--bd);border-radius:4px;padding:12px;margin-bottom:12px}
.keypanel .kl{font-family:var(--f-m);font-size:.66rem;font-variant:small-caps;letter-spacing:.08em;color:var(--tx2)}
.qblock{border:1px solid var(--bd);background:var(--sf);border-radius:4px;padding:14px 16px;margin-bottom:12px}
.qmeta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.qstem{font-weight:500;margin-bottom:10px}
.qscen{font-size:.85rem;color:var(--tx2);border-left:2px solid var(--bd);padding-left:8px;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:8px 10px;margin:5px 0;font-family:var(--f-b);font-size:.87rem}
.opt:hover{border-color:var(--tx)}
.opt.right{border-color:var(--green);background:var(--hi-green)}
.opt.wrong{border-color:var(--red);background:var(--hi-red)}
.opt:disabled{cursor:default}
.sata{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:4px;padding:8px 10px;margin:5px 0;font-size:.87rem}
.rat{border-top:1px dashed var(--bd);margin-top:10px;padding-top:10px;font-size:.85rem}
.rat .ok{color:var(--green)}.rat .no{color:var(--mu)}
.emsg{border-left:2px solid var(--red);background:var(--hi-red);padding:10px;margin:10px 0;font-size:.85rem}
.imsg{border-left:2px solid var(--blue);background:var(--hi-blue);padding:10px;margin:10px 0;font-size:.85rem}
.spinner{width:22px;height:22px;border:2px solid var(--bd);border-top-color:var(--tx);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.loadbox{display:flex;gap:10px;align-items:center;padding:14px;font-family:var(--f-m);font-size:.78rem}
/* case */
.patient{background:#111;color:#fff;border-radius:4px;padding:16px;margin-bottom:12px;font-size:.86rem}
.patient h3{margin-bottom:6px}
.patient .pl{font-family:var(--f-m);font-size:.6rem;opacity:.6;font-variant:small-caps;letter-spacing:.06em;display:block;margin-top:6px}
.adpie{display:flex;gap:4px;margin:0 0 10px;flex-wrap:wrap}
.adpie span{font-family:var(--f-m);font-size:.64rem;border:1px solid var(--bd);border-radius:2px;padding:3px 7px}
.adpie span.act{background:#1c2e5a;color:#fff;border-color:#1c2e5a}
.adpie span.done{border-color:var(--green);color:var(--green)}
.upd{border-left:2px solid var(--amber);background:var(--hi-amber);padding:8px 10px;margin-bottom:10px;font-size:.85rem}
/* recall & flash */
.rbox{border:1px solid var(--bd);background:var(--sf);border-radius:4px;padding:14px;margin-bottom:12px}
.rbox h4{font-size:.95rem;margin-bottom:6px}
.real{border-top:1px dashed var(--bd);margin-top:10px;padding-top:10px;font-size:.86rem}
.rate{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.timer{font-family:var(--f-m);font-size:.9rem;border:1px solid var(--tx);border-radius:3px;padding:2px 8px;display:inline-block}
textarea.blurt{border-color:var(--red);background:var(--hi-red)}
textarea.check{border-color:var(--blue);background:var(--hi-blue)}
.fcard{border:1px solid var(--bd);background:var(--sf);border-radius:4px;padding:28px 24px;min-height:220px;max-width:760px;margin:0 auto}
.fcfront{font-size:1.05rem}
.fcdiv{border-top:1px dashed var(--bd);margin:18px 0}
.cloze{display:inline-block;min-width:60px;background:var(--sf2);border:1px solid var(--bd);border-radius:2px;color:transparent;text-align:center;font-family:var(--f-m);font-size:.75rem}
.cloze::before{content:'[ … ]';color:var(--mu)}
b.clzans{border-bottom:2px solid var(--amber)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.grades button{background:transparent;border:1px solid;border-radius:4px;padding:8px 4px;font-size:.78rem;color:var(--tx)}
.grades small{display:block;font-size:.62rem;color:var(--mu);margin-top:2px}
.g-again{border-color:var(--red)!important}.g-hard{border-color:var(--amber)!important}.g-good{border-color:var(--green)!important}.g-easy{border-color:var(--blue)!important}
.brow{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--bd);padding:7px 0;font-size:.84rem}
/* source + lecture */
details.src-chapter{border:1px solid var(--bd);background:var(--sf);border-radius:4px;margin-bottom:10px}
details.src-chapter>summary{list-style:none;cursor:pointer;padding:12px 14px;font-family:var(--f-m);font-size:.8rem;font-weight:600}
details.src-chapter>summary::-webkit-details-marker{display:none}
details.src-chapter>summary::before{content:'▸ ';}
details.src-chapter[open]>summary::before{content:'▾ ';}
.srcbody{padding:4px 18px 16px;font-size:.88rem;max-width:90ch}
.srcbody h4{font-size:.95rem;margin:16px 0 4px}
.srcbody h5{font-family:var(--f-m);font-size:.74rem;margin:10px 0 2px}
.srcpre{white-space:pre-wrap;font-size:.82rem;font-family:var(--f-b)}
.lcard{background:var(--sf);border:1px solid var(--bd);border-radius:4px;padding:12px 14px;margin-bottom:10px}
.lcard .lh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.lcard h4{font-size:.92rem}
.lnote{font-size:.82rem;color:var(--tx2);border-left:2px solid var(--amber);padding-left:8px;margin-top:6px}
/* toc, popup */
#tocbtn{position:fixed;right:18px;bottom:18px;z-index:60;background:var(--tx);color:var(--inv);border:0;border-radius:3px;padding:10px 14px;font-size:.8rem}
#toc{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:90vw;background:var(--sf);border-left:1px solid var(--bd);z-index:90;transform:translateX(100%);transition:transform .25s;overflow:auto;padding:16px}
#toc.open{transform:none}
#toc .tt{font-family:var(--f-m);font-size:.74rem;font-weight:600;margin:12px 0 4px;cursor:pointer}
#toc .tc{font-size:.8rem;color:var(--tx2);padding:2px 0 2px 10px;cursor:pointer}
#toc .tc:hover,#toc .tt:hover{color:var(--tx);text-decoration:underline}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.popup-box{background:var(--sf);border:1px solid var(--bd);border-radius:4px;max-width:440px;width:100%;max-height:70vh;overflow:auto;padding:18px}
.popup-box.popup-wide{max-width:720px;max-height:82vh}
.phead{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.phead h3{font-size:1rem}
.pbody{font-size:.9rem}
.xp-sec{margin:12px 0}
.xp-sec .dsl{opacity:.8;font-size:.66rem;margin:0 0 3px}
.xp-sec div{font-size:1rem;line-height:1.6}

const TOPICS = {};
TOPICS.assess = {name:'Assessment & Diagnostics', sys:'Musculoskeletal',
desc:'Ch. 41 — anatomy & physiology review, aging changes, history, physical and neurovascular assessment, labs, imaging, biopsy and arthroscopy. Priority concept: Mobility; interrelated: Sensory Perception, Pain.',
qh:['Ca 9.0–10.5 mg/dL · Phos 3.0–4.5 mg/dL · inverse relationship (Ca ↑ → P ↓)','ALP 30–120 U/L — ↑ with osteoblastic activity: healing fx, Paget, bone mets, osteomalacia; slightly ↑ in older adults','Circ check: pulses BELOW injury + sensation, movement, color, temp, cap refill (<3 s; <5 s older), pain — start with injured side, compare sides; no pulse → Doppler','Bone scan: isotope given 4–6 h before; scan 30–60 min lying still; may repeat 24/48/72 h; push fluids after','Arthroscopy: priority = neurovascular checks; ice 24 h, elevate 12–24 h; report severe pain/swelling immediately; f/u ~1 wk; incision < ¼ in (0.6 cm)'],
maps:['boneRemodel','nvAssess','arthroscopyProc','myopathyNeuropathy','bursitis','muscDystrophy','pagetDz','polymyositis'],
cards:[
{t:'Key terms I (arthralgia → fascia)',b:`<ul><li><b>Arthralgias</b> — joint aches and discomfort.</li><li><b>Arthritis</b> — joint inflammation.</li><li><b>Arthroscopy</b> — fiberoptic tube inserted into a joint to directly view ligaments, menisci, articular surfaces (diagnostic or surgical).</li><li><b>Bone scan</b> — radionuclide test; radioactive material injected to view the entire skeleton.</li><li><b>Bursitis</b> — inflammation of bursae (small synovium-lined sacs at joints/bony prominences that prevent friction).</li><li><b>Dermatomyositis</b> — polymyositis that occurs with a purplish skin rash.</li><li><b>Effusion</b> — fluid accumulation, such as in a joint.</li><li><b>Fascia</b> — dense fibrous tissue around skeletal muscle; contains its blood, lymph and nerve supply.</li></ul>`},
{t:'Key terms II (gout → osteoclasts)',b:`<ul><li><b>Gout</b> — genetically linked arthritis from an inborn error of purine metabolism.</li><li><b>Kyphosis</b> — outward curvature of the thoracic spine ("humped back").</li><li><b>Lordosis</b> — inward abnormal curvature of the lumbar spine.</li><li><b>Muscle atrophy</b> — skeletal muscle deterioration from disuse (not regularly exercised).</li><li><b>Muscular dystrophy</b> — group of genetically linked diseases → chronic skeletal muscle weakness + organ dysfunction from smooth-muscle involvement.</li><li><b>Myopathy</b> — problem in muscle tissue, often weakness.</li><li><b>Neuropathy</b> — problem in nerve tissue → weakness + decreased sensory perception.</li><li><b>Neurovascular assessment</b> ("circ check") — pulses below injury + sensation, movement, color, temperature, pain.</li><li><b>Osteoblasts</b> = bone-forming · <b>Osteoclasts</b> = bone-destroying.</li></ul>`},
{t:'Key terms III (osteomalacia → synovial joints)',b:`<ul><li><b>Osteomalacia</b> — softening of bone in adults from inadequate vitamin D.</li><li><b>Osteopenia</b> — decreased bone density (bone loss) with aging.</li><li><b>Osteoporosis</b> — chronic disease of cellular regulation; bone loss → significantly decreased density, possible fracture.</li><li><b>Paget disease</b> — chronic metabolic disorder making bone fragile and misshapen.</li><li><b>Physical disability</b> — limitation in mobility/activity affecting ≥1 ADL (walking, transferring, bathing, toileting, dressing); often needs cane/wheelchair.</li><li><b>Polymyositis</b> — uncommon chronic rheumatic disease; inflammation of multiple muscles.</li><li><b>Scoliosis</b> — abnormal lateral curvature of the spine.</li><li><b>Synovial joints</b> — lined with synovium, which secretes synovial fluid for lubrication and shock absorption.</li></ul>`},
{t:'Bone types & structure',b:`<ul><li class="mk">Skeleton = <b>206 bones</b> + multiple joints; MSK system is the <b>second largest</b> body system.</li><li>Classified by <b>shape</b> — long (femur: cylindric, rounded ends, weight bearing) vs short (phalanges: small, little/no weight) — and by <b>structure</b>.</li><li>Cortex (outer) = dense <b>compact</b> bone; medulla (inner) = spongy <b>cancellous</b> tissue. Most bones have both in varying amounts.</li><li><b>Haversian system</b> = structural unit of cortical bone: canal network with microscopic vessels; <b>lacunae</b> house osteocytes.</li><li>Cancellous spaces = <b>trabeculae</b>, filled with red and yellow marrow. Red marrow → hematopoiesis.</li><li class="mk">Yellow marrow fat cells can dislodge into blood → <b>fat embolism syndrome (FES)</b>, life-threatening.</li><li>Deepest periosteum layer: osteogenic cells → differentiate into osteoblasts & osteoclasts.</li><li>Bone is very vascular: main nutrient artery enters mid-shaft. Few nerve fibers — sympathetic (vessel dilation) and sensory (pain of primary bone lesions/tumors).</li></ul>`},
{t:'Functions of the skeletal system',b:`<ol><li>Framework; allows weight bearing / upright posture</li><li>Supports surrounding tissues (muscle, tendons)</li><li>Movement via muscle attachment and joint formation</li><li>Protects vital organs (heart, lungs)</li><li>Manufactures blood cells in red marrow</li><li>Stores mineral salts (calcium, phosphorus)</li></ol><div class="mn"><span class="alh">Mnemonic — "SPAM-BS"</span>Support · Protection · Attachment for movement · Minerals · Blood cells · Structure/weight bearing</div>`},
{t:'Bone remodeling & mineral balance',hy:true,b:`<ul><li class="mk">Formation and resorption occur at equal rates until age <b>35</b>; afterward resorption increases → loss of bone mass (older women most at risk).</li><li class="mk">Bone holds about <b>99%</b> of body calcium and <b>90%</b> of phosphorus.</li><li class="mk">Serum Ca and P have an <b>inverse relationship</b> — as calcium rises, phosphorus falls.</li><li><b>Calcitonin</b> (thyroid): ↓ serum Ca when high; inhibits bone resorption; ↑ renal excretion of Ca and P.</li><li><b>Vitamin D</b>: promotes intestinal absorption of Ca and P; enhances PTH release of Ca from bone. Deficiency → osteomalacia.</li><li><b>PTH</b>: low Ca → ↑ PTH → osteoclastic activity releases Ca; ↓ renal Ca excretion; ↑ intestinal absorption. High Ca → PTH falls (endocrine feedback loop).</li></ul>`},
{t:'Other hormones that affect bone',b:`<ul><li><b>Adrenal glucocorticoids</b> — regulate protein metabolism (↑ or ↓ catabolism of bone matrix); help regulate intestinal Ca/P absorption.</li><li class="mk"><b>Estrogen</b> stimulates osteoblasts and inhibits PTH → menopause = low Ca + bone loss (osteoporosis).</li><li><b>Androgens</b> (testosterone) promote anabolism, ↑ bone mass.</li><li><b>Thyroxine (T4)</b> ↑ protein synthesis in all tissue, including bone.</li><li><b>Insulin + growth hormone</b> build and maintain healthy bone.</li></ul>`},
{t:'Joints',b:`<ul><li>Joint = space where 2+ bones meet; provides movement and flexibility.</li><li><b>Synarthrodial</b> — immovable (cranium) · <b>Amphiarthrodial</b> — slightly movable (pelvis) · <b>Diarthrodial (synovial)</b> — freely movable (elbow, knee); most common and most often diseased.</li><li>Synovium lines the capsule but does <b>not</b> extend onto articular cartilage. Articular cartilage = collagen matrix + ground substance.</li><li>Arthritis often includes <b>synovitis</b> + cartilage breakdown. Bursae can inflame → bursitis.</li><li>Ball-and-socket (shoulder, hip): any direction. Hinge (elbow): flexion/extension in one plane. Knee: best described as <b>condylar</b> (flexes, extends, rotates slightly).</li></ul><div class="prof"><span class="alh">📋 Prof. Note (lecture slide 38 diagram)</span>Lecture diagram also shows <b>pivot</b> and <b>saddle</b> joints alongside ball-and-socket as synovial joint types.</div>`},
{t:'Muscular system & supporting structures',b:`<ul><li>Skeletal muscle = striated, voluntary; controlled by CNS and PNS.</li><li><b>Motor end plate</b> = junction of motor nerve and the muscle cells it supplies.</li><li>Fibers held in bundles (<b>fasciculi</b>); whole muscle wrapped in <b>fascia</b>.</li><li>Main function: movement. Injury to bone/joint often involves adjacent muscle.</li><li>With aging, fibers ↓ in size and number even in fit adults; disuse → atrophy.</li><li><b>Tendons</b> attach muscle to bone; <b>ligaments</b> attach bone to bone at joints — both very injury-prone.</li></ul>`},
{t:'Aging changes in the MSK system',b:`<ul><li class="mk">Three most common aging changes: <b>osteopenia</b> (↓ bone density), <b>joint cartilage degeneration</b>, and <b>muscle atrophy</b>.</li><li>Severe osteopenia (esp. thin White women) = osteoporosis → kyphosis, gait change, fractures.</li><li>Cartilage less elastic/compressible → damage → osteoarthritis (hips, knees, cervical & lumbar spine; also shoulder, hands, feet).</li><li>Result: ↓ coordination, ↓ strength, gait change, fall risk.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slides 2–3)</span>Age-related change occurs in <b>muscles, joints and bones</b>; function is affected by disease, surgery, trauma and age — and MSK assessment is <b>often overlooked</b>. Promote vitamin D, exercise, smoking cessation, and teach about medications/side effects that affect MSK function, safety or movement.</div>`},
{t:'Older adult box: aging change → intervention',b:`<div class="tscroll"><table><tr><th>Change</th><th>Intervention</th><th>Rationale</th></tr><tr><td>↓ bone density</td><td>Fall-prevention teaching; weight-bearing exercise</td><td>Porous bone fractures; exercise slows loss</td></tr><tr><td>↑ bony prominences</td><td>Prevent pressure on prominences</td><td>Less soft tissue → skin breakdown</td></tr><tr><td>Kyphosis, widened gait, shifted center of gravity</td><td>Body mechanics; supportive chairs with arms; assess for cane/walker; supportive shoes</td><td>Correct posture, prevent deformity, improve balance</td></tr><tr><td>Cartilage degeneration (OA)</td><td>Moist heat (shower, warm compress, heating pad)</td><td>↑ blood flow, promotes mobility</td></tr><tr><td>↓ ROM</td><td>Assess ADLs and mobility</td><td>May need help with ADLs/ambulation</td></tr><tr><td>Atrophy, ↓ strength</td><td>Teach isometric and isotonic exercise</td><td>↑ strength</td></tr><tr><td>Slowed movement</td><td>Do not rush; be patient</td><td>Frustration, falls</td></tr></table></div>`},
{t:'Skeletal differences by ethnic group (Table 41.1)',b:`<div class="tscroll"><table><tr><th>Group</th><th>Difference</th></tr><tr><td>Black</td><td>Greater bone density than Whites, Asian/Pacific Islanders, Hispanics → less osteoporosis</td></tr><tr><td>Amish</td><td>Greater incidence of dwarfism</td></tr><tr><td>Chinese American</td><td>Shorter, smaller bones, less density → more osteoporosis</td></tr><tr><td>Egyptian American</td><td>Shorter than Whites and Black people</td></tr><tr><td>Filipino/Vietnamese</td><td>Short; adult height ≈ 5 ft</td></tr><tr><td>Irish American</td><td>Taller, broader than other Whites; less density than Black people</td></tr></table></div>`},
{t:'Health promotion for MSK health',b:`<ul><li>Vitamin D + calcium (diet/supplement) slows bone loss; weight-bearing activity (walking) and strengthening ↓ osteoporosis risk.</li><li>Young men: highest risk of traumatic injury (motor vehicle/scooter) — safe use, avoid substances.</li><li>Young/middle-aged: high-impact sports (excess jogging/running) injure soft tissue and bone.</li><li>Older adults: highest fall/fracture risk → evidence-based fall prevention.</li><li class="mk"><b>Nicotine</b> in tobacco slows bone healing and harms the MSK system.</li><li>Excess alcohol depletes vitamins/nutrients for bone and muscle growth.</li><li>Prolonged immobility → skin breakdown, constipation, contractures, VTE.</li></ul>`},
{t:'Patient history',b:`<ul><li>Ask about <b>all</b> past trauma/sports injuries regardless of when (lumbar injury 30 yrs ago → current back pain; MVC → OA years later).</li><li>Pain-management plan, including cannabis use.</li><li>Illness: diabetic foot ulcer → high risk of <b>osteomyelitis</b>; diabetes slows healing.</li><li>Occupation: manual labor → fractures; computer work → carpal tunnel syndrome, neck pain.</li><li>Allergies — esp. <b>dairy</b> (↓ Ca intake). Drugs — <b>steroids</b> impair Ca metabolism → bone loss.</li><li>Supplements: glucosamine and chondroitin commonly used for arthritis/arthralgia.</li><li>Ability to do ADLs independently; assistive devices used.</li></ul>`},
{t:'Nutrition & family/genetic history',b:`<ul><li>Most people (esp. women) lack calcium; note unexpected weight gain/loss; 24-h diet recall.</li><li>Lactose intolerance and food insecurity → inadequate calcium/undernutrition.</li><li>Low protein or vitamin C/D slows bone and tissue healing.</li><li>Obesity stresses joints/cartilage and ↓ mobility → respiratory & circulatory complications.</li><li>Anorexia/bulimia → osteoporosis risk (low Ca, vitamin D).</li><li>Familial/genetic: <b>osteoporosis</b> and <b>gout</b> run in families.</li></ul>`},
{t:'Current problem: pain & weakness',hy:true,b:`<ul><li class="mk">Most common complaints: <b>pain</b> and/or <b>weakness</b>.</li><li>Collect: onset date/time; aggravating factors; course (intermittent vs continuous); signs & symptoms and pattern; what helps (heat, ice).</li><li>Pain: bone, muscle or joint; acute vs chronic; pain with movement may = fracture or muscle/joint injury. Rate intensity; quality (dull, burning, aching, stabbing); location/radiation; patient's own words, point to it.</li><li class="mk"><b>Proximal</b> weakness → myopathy; <b>distal</b> weakness + impaired sensation → neuropathy.</li><li>LE weakness ↑ fall risk; UE weakness limits function.</li></ul>`},
{t:'Physical assessment: posture, spine, gait, extremities',b:`<ul><li>Use <b>inspection, palpation, ROM</b>; focused assessment. Observe posture, gait, general mobility; coordinate with PT/OT.</li><li><b>Lordosis</b> — common with abdominal obesity. <b>Scoliosis</b> — common in children/young adults. <b>Kyphosis</b> — thoracic "hump".</li><li>Gait: balance, steadiness, stride; note limp/asymmetry.</li><li>Always assess extremities <b>side-to-side</b> (shoulder injury → can't comb hair on one side; severe arthritis → both arms).</li><li>Note muscle size, shape, tone, strength — move against resistance.</li></ul>`},
{t:'Hand, hip, knee, ankle & foot assessment',b:`<ul><li>Hand = most critical part (many joints per digit): inspect/palpate <b>MCP, PIP, DIP</b>; compare same digits bilaterally; active ROM, then passive.</li><li class="mk">Quick hand ROM check: make a <b>fist</b>, then <b>appose each finger to the thumb</b> — if able, hand ROM not seriously restricted.</li><li>Hip: deep, hard to inspect → judge by mobility; hip pain felt in <b>groin</b> or radiates to knee/low back.</li><li>Knee: easy to assess flexed while sitting; <b>effusion</b> easily detected; genu valgum = knock-knee; genu varum = bowlegged.</li><li>Ankles/feet often neglected — observe and palpate if affected.</li><li>ROM assessment unnecessary if patient functions to meet personal needs. Skin: redness/warmth → inflammation or pressure injury.</li></ul>`},
{t:'ROM movement terms (lecture slide 4)',b:`<div class="prof"><span class="alh">📋 Prof. Note — diagram labels (Jarvis)</span>Movements assessed in the MSK exam:</div><ul><li><b>Flexion / extension</b> — bending / straightening</li><li><b>Abduction / adduction</b> — away from / toward midline</li><li><b>Pronation / supination</b> — palm down / palm up</li><li><b>Circumduction</b> — circular movement</li><li><b>Rotation</b> — turning on an axis (e.g., head)</li><li><b>Elevation / depression</b> — raising / lowering (shoulders)</li><li><b>Protraction / retraction</b> — forward / backward (jaw)</li><li><b>Eversion / inversion</b> — sole outward / inward</li></ul>`},
{t:'Neurovascular assessment (circ check)',hy:true,b:`<div class="al red"><span class="alh">🔴 Nursing Safety Priority — Action Alert</span>If a current injury: palpate <b>pulses below the level of injury</b> and assess sensation, movement, color, temperature, capillary refill and pain in the injured part. <b>Begin with the injured side; always compare</b> to the other extremity. Pulses not palpable → use a <b>Doppler</b>.</div><ul><li class="mk">Normal capillary refill <b>&lt; 3 seconds</b> (&lt; 5 s in older adults); least reliable indicator.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slide 5 + voice-over)</span>Lecture list: A. <b>skin color</b> (appropriate for tone vs necrotic, pale, dusky, mottled) · B. <b>response to painful stimuli</b> (numbness, tingling, sensation?) · C. <b>reflexes</b> · D. <b>ability to follow commands to move extremity</b> · E. <b>pulse present/absent</b> (absent = poor circulation). Note: the lecture adds <b>reflexes</b>, which the textbook circ check doesn't list.</div><div class="mn"><span class="alh">Mnemonic — "CMS + 5 Ps"</span>Circulation · Motion · Sensation → Pulse, Pallor(color), Paresthesia, Paralysis(movement), Pain (+ temp, cap refill)</div>`},
{t:'Psychosocial assessment',b:`<ul><li>Prolonged absence from work or permanent disability → job/career loss; chronic pain adds stress.</li><li>Assess <b>anxiety and depression</b> (common with chronic pain).</li><li>Deformity (e.g., amputation) → body image/self-concept changes.</li><li>Identify supports and coping; encourage verbalizing loss; refer for psychological or spiritual counseling if culturally appropriate.</li><li>Clients with disability/MSK conditions often have anxiety, depression, body-image issues.</li></ul>`},
{t:'Health equity: physical disability',b:`<ul><li>Mobility limitation = <b>major cause of physical disability</b> (canes, walkers, wheelchairs; esp. middle-aged/older).</li><li>Disability more common in older Hispanic, American Indian/Alaska Native and other racial groups vs Whites.</li><li>Likely due to social determinants of health: poverty, low education, unemployment/underemployment.</li></ul>`},
{t:'Labs: calcium, phosphorus, ALP, vitamin D',hy:true,b:`<ul><li class="mk">Serum calcium <span class="lab-n">9.0–10.5 mg/dL (2.10–2.50 mmol/L)</span>; older adults ↓. <b>Hypercalcemia</b>: bone mets, Paget, healing fractures. <b>Hypocalcemia</b>: osteoporosis, osteomalacia.</li><li class="mk">Serum phosphorus <span class="lab-n">3.0–4.5 mg/dL (0.97–1.45 mmol/L)</span>; older adults ↓. <b>Hyperphosphatemia</b>: healing fractures, bone tumors. <b>Hypophosphatemia</b>: osteomalacia.</li><li class="mk">ALP <span class="lab-n">30–120 U/L (40–160 IU/L)</span>; slightly ↑ older adults. ↑ with <b>bone or liver damage</b> — rises in proportion to osteoblastic activity: bone/liver mets, Paget, osteomalacia.</li><li>↓ serum Ca could indicate bone density loss. No special prep or follow-up for these tests — just teach purpose.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slide 7)</span><b>Vitamin D — RDA 400 IU/day</b>. Cholecalciferol (D3) is made photochemically in the skin, promotes Ca & P absorption in the small intestine. Remember <b>phosphorus ↔ calcium inverse relationship</b>.</div>`},
{t:'Labs: muscle enzymes (CK, LDH, AST, aldolase)',hy:true,b:`<p>Damaged muscle releases these enzymes → ↑ serum levels.</p><ul><li class="mk"><b>CK total</b>: men <span class="lab-n">55–170 U/L</span>, women <span class="lab-n">30–135 U/L</span>; <b>CK-MM 96–100%</b>. ↑ muscle trauma, muscular dystrophy, after EMG.</li><li><b>LDH</b> total <span class="lab-n">100–190 U/L</span> (LDH1 17–27%, LDH2 27–37%, LDH3 18–25%, LDH4 3–8%, LDH5 0–5%); older ↑ slightly. ↑ skeletal muscle necrosis, extensive cancer, MD.</li><li><b>AST</b> <span class="lab-n">0–35 U/L</span>; older ↑ slightly. ↑ skeletal muscle trauma, MD.</li><li><b>Aldolase</b> <span class="lab-n">3.0–8.2 U/dL</span>. ↑ polymyositis/dermatomyositis, MD.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slide 8) — value difference flagged</span>Lecture CK range: <b>F 26–140 U/L, M 38–174 U/L</b> (textbook: F 30–135, M 55–170). CK <b>rises within 2–4 hours</b> of muscle trauma. CK has 2 subunits (M = muscle, B = brain); <b>CK-MM (CK3)</b> isoenzyme ↑ = skeletal muscle damage; <b>CK-MB = heart</b>. Know whichever range your exam uses.</div>`},
{t:'Radiography & CT',b:`<ul><li>X-ray: AP + lateral are initial views; shows <b>bone density, alignment, swelling, intactness</b>, joint space, cartilage smoothness, synovial swelling; soft tissue poorly differentiated.</li><li>CT: very useful for vertebral column and joints; 3-D reconstructions.</li><li class="mk">If contrast: ask about <b>iodine-based contrast allergy</b>; otherwise no pre/post care.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slide 13 + voice-over)</span><b>CT = test of choice for injuries or pathology involving only bone.</b> Assess for <b>seafood/iodine allergy</b> when contrast used.</div>`},
{t:'MRI, MR arthrography & ultrasound',b:`<ul><li>MRI (± contrast): more accurate than CT for many <b>spinal and knee</b> problems; best for <b>joints and soft tissue</b> (muscles, tendons, ligaments); lecture adds bony tumors.</li><li><b>MRA</b> = arthrography + MRI; esp. shoulder, rotator cuff tears; contrast injected under fluoroscopy, then MRI.</li><li>Ultrasound: soft-tissue masses/fluid, traumatic joint injury, <b>osteomyelitis</b>, surgical hardware placement. Gel over site; no prep or post-care. <b>QUS</b> for fractures/bone density.</li></ul>`},
{t:'Bone scan',hy:true,b:`<ul><li>Radionuclide injected; views entire skeleton. Detects bone tumors, arthritis, osteomyelitis, osteoporosis, vertebral compression fractures, unexplained bone pain.</li><li class="mk">Isotope given <b>4–6 hours</b> before scan (bone takes it up slowly); no other contrast/isotope tests during that time.</li><li class="mk">Scan takes <b>30–60 minutes</b>; patient must lie still; may repeat at <b>24, 48 and/or 72 h</b>.</li><li class="mk">Isotope excreted in stool/urine — <b>no special excreta precautions</b>; <b>push fluids</b> afterward.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slide 13)</span>Bone scan is <b>extremely useful for hairline fractures</b>.</div>`},
{t:'Arthrography, myelogram, gallium/thallium scans',b:`<div class="prof"><span class="alh">📋 Prof. Note — lecture-only tests (slides 10, 13)</span></div><ul><li><b>Arthrography</b> — study of a joint using air or contrast; finds <b>bone chips, torn ligaments, loose bodies</b>.</li><li><b>Myelogram</b> — spinal puncture; contrast injected into the <b>subarachnoid space</b> (vertebral column, discs, nerve roots, vessels); use has <b>decreased</b> with CT & MRI.</li><li><b>Gallium/thallium scans</b> — isotopes more specific and sensitive for bone problems; gallium citrate migrates to brain, liver, breast tissue (used when disease suspected there); <b>thallium good for osteosarcoma</b>.</li></ul>`},
{t:'Electromyography (EMG)',b:`<div class="prof"><span class="alh">📋 Prof. Note — lecture-only (slide 12 + voice-over)</span></div><ul><li>Helps diagnose neuromuscular, lower motor neuron and peripheral nerve disorders; evaluates muscle weakness.</li><li>Low electrical current through flat electrodes placed along the nerve.</li><li class="mk">If needles used → inspect sites for <b>hematoma</b>.</li><li class="mk">Ask about <b>OTC herbal medications</b> — voice-over: EMG contraindicated with herbals that alter <b>anticoagulation</b>.</li><li>EMG can raise CK levels (textbook).</li></ul>`},
{t:'Bone & muscle biopsy',b:`<ul><li>Bone biopsy: specimen for microscopy; confirms <b>infection or neoplasm</b>; invasive, not common today. <b>Needle (closed)</b> or <b>incisional (open)</b>.</li><li>Muscle biopsy: confirms atrophy (muscular dystrophy) or inflammation (polymyositis); same care as bone biopsy.</li></ul><div class="al red"><span class="alh">🔴 Action Alert</span>After biopsy watch for <b>bleeding</b> and for tenderness, redness, warmth (infection). Mild analgesics.</div><div class="prof"><span class="alh">📋 Prof. Note (voice-over)</span>Ensure <b>informed consent</b> is in the chart before a biopsy.</div>`},
{t:'Arthroscopy: preparation & procedure',b:`<ul><li>Diagnostic or surgical; knee and shoulder most often; synovial biopsy and repairs possible; <b>same-day/ambulatory</b>.</li><li class="mk">Contraindicated if patient <b>cannot move the joint</b> or has an <b>infected joint</b>.</li><li>Surgical cases: PT consult pre-op to learn post-op exercises; ROM may not be allowed right after surgery. Nurse reinforces teaching and ensures <b>signed informed consent</b>.</li><li>Local, light general or epidural anesthesia; incision <b>&lt; ¼ inch (0.6 cm)</b>, possibly multiple; dressing depending on manipulation.</li></ul>`},
{t:'Arthroscopy: follow-up care',hy:true,b:`<div class="al red"><span class="alh">🔴 Action Alert</span>Priority after arthroscopy = <b>neurovascular status</b> of the affected limb: distal pulses, warmth, color, cap refill, pain, movement, sensation.</div><ul><li>Same care whether diagnostic or surgical. Encourage taught exercises.</li><li>Diagnostic: mild analgesic (acetaminophen). Surgical: short-term opioid combo (oxycodone + acetaminophen).</li><li class="mk">Ice for <b>24 hours</b>; elevate extremity <b>12–24 hours</b>.</li><li>Monitor/teach: swelling, severe joint/limb pain, thrombophlebitis, infection → <b>contact provider immediately</b>.</li><li class="mk">Follow-up visit about <b>1 week</b> after.</li></ul><div class="al green"><span class="alh">🟢 Clinical pearl (NCLEX)</span>Increased swelling + pain 2 days after arthroscopic repair → <b>notify the surgeon</b> (not just ice/elevate).</div><div class="prof"><span class="alh">📋 Prof. Note (slide 11 voice-over)</span>After arthroscopy: pedal pulses present, skin pink and warm; teach fall safety; <b>cough/deep breathe + incentive spirometer every 2 h</b>; <b>abduction pillow</b> in bed to maintain alignment (hip procedures); non-opioid options <b>gabapentin, ketorolac, ketamine</b>; involve case managers and PT.</div>`},
{t:'Nursing diagnoses for altered MSK function',b:`<div class="prof"><span class="alh">📋 Prof. Note (slide 6)</span></div><ol><li>Alteration in comfort</li><li>Impaired mobility</li><li>Activity intolerance</li><li>Disturbance in body image</li><li>Self-care deficit</li><li>Potential infection</li></ol>`},
{t:'Essential assessment points (Ch. 41 summary)',b:`<ul><li>Bone = dynamic, vascular; continuous formation and resorption.</li><li>Promote adequate calcium; avoid risky behaviors.</li><li>Disability from mobility limits more common in people of color (SDOH).</li><li>Assessment = compare extremities + mobility + functional assessment.</li><li>Teach arthroscopy patients to report severe/increased pain and swelling <b>immediately</b>.</li></ul>`}
]};
TOPICS.osteo = {name:'Osteoporosis', sys:'Musculoskeletal',
desc:'Ch. 42 Cellular Regulation exemplar — pathophysiology, T-scores, risk factors, screening (DXA), prevention, drug therapy and fall-safe home care. Priority concepts: Mobility, Infection, Cellular Regulation; interrelated: Pain.',
qh:['T-score: 0 = healthy 30-yr-old · osteopenia −1 to above −2.5 · osteoporosis ≤ −2.5 · severe = osteoporosis + ≥1 fracture','Drug tx if T ≤ −2.5 (hip/lumbar) with no risk factors, T < −1.5 with risk factors/prior fx, or any age ≥50 hip/vertebral fracture','Oral bisphosphonate: AM, empty stomach, 8 oz water, upright & NPO 30–60 min; dental exam first; stop chest pain → call; no if poor renal fx, hypocalcemia, GERD','Zoledronic acid IV once/yr · pamidronate IV q3–6 mo · denosumab subQ 2×/yr · romosozumab 1 yr / teriparatide-abaloparatide 2 yr then antiresorptive','Walk 30 min 3–5×/wk; avoid jarring (jogging, horseback); alcohol ≤1/day women, ≤2 men; carbonated >40 oz (1200 mL)/day = Ca loss; DXA q2y (Medicare >65)'],
maps:['osteoporosis','osteomalacia','tscore'],
cards:[
{t:'Osteoporosis: definition & fracture burden',hy:true,b:`<ul><li>Chronic disease of <b>cellular regulation</b>: bone loss → significantly ↓ density, possible fracture. Called a <b>"silent disease"</b> — often first diagnosed <b>after a fracture</b>; underdiagnosed and undertreated.</li><li class="mk"><b>50%</b> of postmenopausal women will have a fragility fracture ("bone attack"); <b>25%</b> of men &gt; 50 will have an osteoporosis-related fracture.</li><li>Any fracture → very high risk of future fractures; esp. women of color and Asian/Pacific Islander women.</li><li>Global problem; famine/less affluent countries often have both osteoporosis and osteomalacia.</li></ul>`},
{t:'Bone remodeling & BMD',hy:true,b:`<ul><li>Osteoporosis/osteopenia when <b>osteoclastic (resorption) &gt; osteoblastic (building)</b> activity → ↓ BMD.</li><li class="mk">BMD peaks between <b>25 and 30 years</b>; after peak, resorption exceeds building.</li><li>BMD falls fastest in postmenopausal women as estrogen ↓ (estrogen doesn't build bone but <b>prevents loss</b>).</li><li class="mk"><b>Trabecular (cancellous)</b> bone is lost first, then cortical. <b>Hip, wrist, spine</b> have the most cancellous bone → fracture first.</li></ul>`},
{t:'Diagnostic T-score criteria',hy:true,b:`<ul><li>T-score = standard deviations above/below the mean BMD of young healthy adults.</li><li class="mk">Healthy 30-year-old T-score = <b>0</b>.</li><li class="mk"><b>Osteopenia</b>: T-score at <b>−1 and above −2.5</b>.</li><li class="mk"><b>Osteoporosis</b>: T-score <b>at or below −2.5</b>.</li><li class="mk"><b>Severe/established</b> osteoporosis = osteoporosis <b>+ one or more fractures</b>.</li></ul><div class="mn"><span class="alh">Mnemonic — "1 pen, 2.5 pores"</span>−1 starts osteo<b>pen</b>ia; −2.5 starts osteo<b>por</b>osis.</div>`},
{t:'Classification: primary, secondary, regional',b:`<ul><li><b>Generalized</b> (many skeletal structures) → <b>primary</b> (more common; postmenopausal women; men in 7th–8th decade) or <b>secondary</b> (hyperparathyroidism, long-term corticosteroids, prolonged immobility e.g. SCI) — treat the cause.</li><li class="mk"><b>Regional</b> (localized, secondary type): limb immobilized (fracture, injury, paralysis) longer than <b>8–12 weeks</b>; also weightlessness (astronauts).</li></ul>`},
{t:'Osteoporosis vs osteomalacia (Table 42.1)',hy:true,b:`<div class="tscroll"><table><tr><th></th><th>Osteoporosis</th><th>Osteomalacia</th></tr><tr><td>Definition</td><td>↓ bone mass, multiple factors</td><td>Bone softening from lack of calcification</td></tr><tr><td>Primary cause</td><td>Lack of Ca and estrogen/testosterone</td><td>Lack of <b>vitamin D</b></td></tr><tr><td>X-ray</td><td>Osteopenia, fractures</td><td>Fractures</td></tr><tr><td>Calcium</td><td>Low or normal</td><td>Low or normal</td></tr><tr><td>Phosphate</td><td>Normal</td><td>Low or normal</td></tr><tr><td>PTH</td><td>Normal</td><td>High or normal</td></tr><tr><td>ALP</td><td>Normal</td><td><b>High</b></td></tr></table></div><ul><li class="mk">Osteomalacia: vitamin D needed for Ca absorption in small intestine; without it calcification fails → soft bone; ALP is <b>high</b>.</li></ul>`},
{t:'Nonmodifiable risk factors (Box 42.1)',hy:true,b:`<ul><li class="mk">Older age (<b>over 50</b>)</li><li>Menopause or total hysterectomy with ovary removal</li><li>Parental history (esp. mother)</li><li>White or Asian ethnicity</li><li>Eating disorders (anorexia nervosa)</li><li>Rheumatoid arthritis</li><li class="mk">History of any fracture after age <b>50</b></li></ul>`},
{t:'Potentially modifiable risk factors (Box 42.1)',hy:true,b:`<ul><li>Low body weight, thin build</li><li>Chronic low calcium and/or vitamin D intake</li><li>Estrogen or androgen deficiency</li><li>Current smoking (active <b>or passive</b>)</li><li class="mk">High alcohol intake (<b>2 or more drinks/day</b>)</li><li>Drug therapy — chronic <b>steroids</b></li><li>Poor nutrition; lack of exercise/prolonged immobility</li></ul><div class="al green"><span class="alh">🟢 NCLEX pearl</span>Modifiable = corticosteroids, lack of exercise, food insecurity (nutrition). NOT modifiable = older age, parental history, postmenopause.</div>`},
{t:'Genetic factors',b:`<ul><li>Complex genetic + immune causes; no agreement on the most important genes.</li><li>Changes in <b>vitamin D3 receptor (VDR)</b> and <b>calcitonin receptor (CTR)</b> genes.</li><li><b>BMP-2</b> gene (bone formation) altered in some fracture patients; <b>GH-1</b> alterations in petite Asian-American women.</li><li><b>RANKL / RANK / OPG</b> system (OPG = decoy receptor) controls osteoclasts; disruption → rapid breakdown → basis for newer drugs (denosumab).</li></ul>`},
{t:'Gender differences',b:`<ul><li>Women: after menopause or bilateral oophorectomy (↓ estrogen). <b>Obese women</b> store estrogen in tissue → less likely to develop osteoporosis than thin women.</li><li>Men &gt; 50 develop it as <b>testosterone ↓</b> (major bone-building hormone); often underdiagnosed — screen.</li></ul>`},
{t:'Nutrition & lifestyle contributors',b:`<ul><li>Excess <b>caffeine</b> → urinary Ca loss.</li><li>Low Ca/vit D → PTH ↑ → Ca released from bone. Activated vit D needed for Ca uptake; malabsorption ↓ serum Ca.</li><li>Homebound/institutionalized without sunlight → low vit D.</li><li>High phosphorus accelerates Ca loss.</li><li class="mk">Carbonated beverages over <b>40 oz (1200 mL)/day</b> → high risk for Ca loss at any age/gender.</li><li class="mk"><b>50%</b> of serum calcium is protein bound → need protein, but <b>excess protein</b> (Atkins-type diets) ↑ urinary Ca loss.</li></ul>`},
{t:'Incidence, equity & veterans',b:`<ul><li class="mk">Osteoporosis/osteopenia affects &gt; <b>54 million</b> Americans; <b>1 in 10</b> people &gt; 50 have osteoporosis (HP2030).</li><li>Most common: older, lean, White women who don't exercise. Dark skin → risk of ↓ vitamin D; lactose intolerance (many non-Hispanic Black people) → lactose-free/almond/soy milk (may be costly).</li><li>Minority groups get less screening and treatment even after fracture — due to lack of access, lower education, lower SES. Teach bone health and screening.</li><li>Veterans (male & female) underdiagnosed, often found after low-trauma fracture → screen all veterans, treat aggressively.</li></ul>`},
{t:'Healthy People 2030 objectives',b:`<ol><li>Reduce proportion of adults with osteoporosis.</li><li>Increase older adults screened for osteoporosis.</li><li>Reduce hip fractures among older adults.</li><li>Increase older adults treated for osteoporosis after a fracture.</li></ol>`},
{t:'Prevention teaching',hy:true,b:`<ul><li>Begin education with young women. Decrease modifiable risk factors.</li><li>Calcium foods: <b>dairy, dark green leafy vegetables</b>; read labels; consider cost/food insecurity.</li><li>Sun exposure (no sunburn) + dietary vitamin D.</li><li>Smoking cessation, weight loss if needed, avoid excess alcohol, limit carbonated drinks.</li><li class="mk">Weight-bearing exercise (walking); avoid <b>jarring</b> (horseback riding, jogging) → vertebral compression fractures.</li><li class="mk">Postmenopausal women and men &gt; <b>50</b>: request screening. Medicare pays BMD testing every <b>2 years</b> for adults &gt; <b>65</b>.</li><li class="mk">People of color / Asian descent: screen by no later than age <b>50</b>.</li></ul><div class="al blue"><span class="alh">🔵 Nurse well-being</span>Increase Ca and vit D, exercise; postmenopausal or male &gt; 50 → get BMD screening; any fracture → high risk, seek post-fracture treatment.</div>`},
{t:'Assessment: history, signs & symptoms',hy:true,b:`<ul><li>Full history with risk factors and a <b>fall risk assessment</b>; sometimes the fracture occurs <b>before</b> the fall.</li><li>Classic <b>"dowager's hump" (kyphosis)</b>.</li><li class="mk">Height loss of <b>2–3 inches (5–7.5 cm)</b> over 20 years reported; spinal changes can cause up to <b>6 inches</b> loss. Measure/compare height & weight.</li><li>Back pain after lifting, bending, stooping; worse with activity, better with rest. Pain + tenderness + voluntary restriction of spinal movement → <b>vertebral compression fracture</b>.</li><li class="mk">Spinal fractures most likely between <b>T8 and L3</b>.</li><li>Other common sites: <b>distal radius (wrist)</b>, <b>upper third of femur (hip)</b>.</li><li>Severe deformity → constipation, abdominal distention, reflux esophagitis, respiratory compromise.</li></ul><div class="al red"><span class="alh">🔴 National Patient Safety Goal — falls</span>Assess fall risk; flag high-risk patients with colored armbands, signs, etc.</div>`},
{t:'Psychosocial assessment',b:`<ul><li>Associated with menopause, aging, ↓ independence; ↓ mobility, deformity, disability.</li><li>Chronic pain, insomnia, depression, <b>fear of falling</b> (may not exercise as prescribed).</li><li>Body image (clothes don't fit, avoids restaurants/theaters), sexuality changes.</li></ul>`},
{t:'Laboratory assessment',b:`<ul><li class="mk">Monitor serum Ca and vitamin D3 at least <b>yearly</b> for women and men &gt; 50 at high risk.</li><li class="mk">Serum Ca <span class="lab-n">9.0–10.5 mg/dL</span>; total 25-hydroxyvitamin D <span class="lab-n">25–80 ng/mL (75–200 nmol/L)</span>.</li><li>No lab test confirms primary osteoporosis. Bone turnover markers (not commonly tested) — <b>osteocalcin</b>, <b>bone-specific ALP (BSAP)</b> — monitor treatment or detect early change.</li></ul>`},
{t:'DXA scan',hy:true,b:`<ul><li class="mk"><b>DXA</b> = most common screening/diagnostic test for BMD; noninvasive, painless, <b>less radiation than a chest x-ray</b>.</li><li>Central DXA: <b>spine and hip</b>; wrist if spinal deformity.</li><li>Many providers recommend a baseline DXA for women in their <b>40s</b>.</li><li>Prep: height measured; stay dressed but <b>remove metal</b> (belt buckle, coins, keys, jewelry). No follow-up care; discuss results with provider.</li><li class="mk">Osteopenia/osteoporosis → follow-up DXA every <b>2 years</b> (NOT yearly).</li><li>Limits: BMD only part of the picture, no cellular info; system variability; less useful if very tall/obese.</li><li>Plain x-ray shows ↓ density only after large bone loss.</li></ul><div class="al green"><span class="alh">🟢 NCLEX pearl</span>"I'll get a DXA every year" = needs more teaching.</div>`},
{t:'Other imaging & vertebral imaging criteria',b:`<ul><li><b>QCT</b> — volume of density/strength at spine & hip; <b>pQCT</b> forearm/tibia; <b>HR-pQCT</b> radius/tibia architecture. Predict fractures but <b>more radiation</b> than DXA.</li><li>BHOF: all postmenopausal women and men ≥ 50 evaluated for risk to decide on BMD/vertebral imaging.</li><li>Vertebral imaging (lateral spine x-ray or VFA): women ≥ <b>70</b> & men ≥ <b>80</b> if T ≤ 1.0; women 65–69 & men 70–79 if T ≤ 1.5; postmenopausal women/men ≥ 50 with height loss, low-trauma fracture, long-term steroids.</li><li>Quantitative <b>MRI</b>: no radiation; marrow fat (<b>BMAT</b>) higher and perfusion lower in bone loss; expensive, not widely used.</li><li>Community screening: <b>pDXA</b> (heel, forearm, finger) and <b>pQUS</b> (heel, tibia, patella; low cost, no radiation, predicts hip fracture).</li></ul>`},
{t:'Priority problem & expected outcome',b:`<ul><li>Priority problem: <b>potential for fractures</b> due to weak, porous bone.</li><li>Outcome: avoids fractures by preventing falls, managing risk factors, adhering to prevention/treatment.</li><li>Evaluation: follows DXA schedule; makes lifestyle changes; no fragility fracture.</li></ul>`},
{t:'Nutrition therapy',b:`<ul><li>Same as prevention: adequate Ca and vitamin D; avoid excess alcohol and caffeine.</li><li>Lactose intolerant: fortified soy and rice products; Ca/vit D added to juices, bread, cereal — check affordability.</li><li>A single nutrient won't prevent/treat; emphasize fruits, vegetables, low-fat dairy/protein, fiber, moderation.</li></ul>`},
{t:'Exercise & lifestyle changes',hy:true,b:`<ul><li>PT: abdominal & back strengthening (posture, spine support); abdominal tightening, deep breathing, pectoral stretching (lung capacity); extremity muscle-tightening, resistive, ROM; swimming, yoga. Strengthening prevents falls.</li><li class="mk">Walking <b>30 minutes, 3–5 times a week</b> = single most effective exercise for prevention.</li><li>Avoid jarring (jogging, horseback) → compression fractures.</li><li>Avoid tobacco (active/passive).</li><li class="mk">Alcohol: women ≤ <b>1 drink/day (5 oz)</b>; men ≤ <b>2 drinks/day</b>.</li><li>Assess housing, food security, finances before teaching.</li></ul>`},
{t:'When to start drug therapy',hy:true,b:`<ul><li class="mk">Postmenopausal women and men ≥ 50 with hip/lumbar T-score <b>≤ −2.5</b> (no other risk factors), or T-score <b>&lt; −1.5</b> with risk factors or previous fracture.</li><li class="mk">Anyone ≥ <b>50</b> with a <b>hip or vertebral fracture</b> should be treated.</li><li>Options: bisphosphonate, estrogen agonist/antagonist (formerly SERM), PTH analog, RANKL inhibitor, sclerostin inhibitor, or combination.</li></ul>`},
{t:'Bisphosphonates: action & oral safety teaching',hy:true,b:`<ul><li>Most common drugs for <b>osteopenia</b>; <b>antiresorptive</b> — bind crystal elements in (esp. cancellous) bone. Some also for Paget disease and hypercalcemia of cancer.</li><li class="mk">Take <b>early AM</b>, empty stomach, with <b>8 oz water</b>; stay <b>upright</b> and wait <b>30–60 min</b> before eating/drinking/other meds (table: 30 min).</li><li class="mk"><b>Chest discomfort</b> (esophageal irritation) → stop drug, call provider.</li><li class="mk">Contraindicated: <b>poor renal function, hypocalcemia, GERD</b>; aspirin sensitivity (bronchoconstriction).</li><li class="mk">Oral assessment/<b>dental exam before</b> starting; tell dentists before extraction/implant (<b>jaw osteonecrosis</b>).</li></ul>`},
{t:'IV bisphosphonates & treatment duration',hy:true,b:`<div class="al red"><span class="alh">🔴 Drug Alert</span><b>Zoledronic acid IV</b> — once a year. <b>Pamidronate IV</b> — every 3–6 months. Both: transient <b>flu-like symptoms</b> (esp. first dose); rarely <b>jaw osteonecrosis</b>.</div><ul><li class="mk">Infuse IV bisphosphonate over <b>15–30 minutes</b> (prevents rare atrial fibrillation); check <b>serum creatinine</b> before/after (AKI risk).</li><li>Not lifelong: long-term risks = esophageal cancer, atrial fibrillation, jaw osteonecrosis, severe MSK pain.</li><li class="mk">Decision to continue after <b>2 years</b> based on DXA: bone maintained/increased → stop; continued loss → continue up to <b>5 years</b>.</li></ul>`},
{t:'RANKL inhibitor, sclerostin inhibitor, PTH analogs',hy:true,b:`<ul><li class="mk"><b>Denosumab</b> (RANKL inhibitor) — subQ <b>twice a year</b> by a health professional; inhibits osteoclast-mediated resorption.</li><li class="mk"><b>Romosozumab</b> — monoclonal antibody, first <b>sclerostin inhibitor</b>; antiresorptive + anabolic. No stroke/MI in past <b>12 months</b>; only women who can no longer become pregnant; avoid with hypocalcemia.</li><li class="mk"><b>Teriparatide / abaloparatide</b> — PTH-related protein drugs; build bone; <b>daily subQ</b>; not long-term; for prior fracture or multiple risk factors.</li><li class="mk">Postmenopausal women with T &lt; −2.5: romosozumab <b>1 year</b> or teriparatide/abaloparatide <b>2 years</b>, then an antiresorptive (bisphosphonate).</li></ul>`},
{t:'Care coordination & home safety',b:`<ul><li>Managed at home unless major fragility fracture; some learn of disease only after fall/fracture.</li><li>Follow-up DXA to judge drug effect; may stop drug if mass maintained, then rescan to decide on restarting.</li><li>Home: ramps, handrails by toilet/tub/shower; no clutter, no slippery floors, rubber-soled shoes, no scatter rugs.</li></ul>`},
{t:'Self-management education & resources',b:`<ul><li class="mk">Daily sun exposure at least <b>5 minutes</b> = most important vitamin D source.</li><li>Dairy-free/vegan: soy/rice milk, tofu — choose vitamin D–fortified (expensive).</li><li>Adherence to long-term therapy is a major problem → more fractures, hospital stays, costs.</li><li>Resources: Bone Health and Osteoporosis Foundation; Osteoporosis Society of Canada; osteoporosis clinics & support groups.</li></ul>`}
]};
TOPICS.infect = {name:'Osteomyelitis & Bone Tumors', sys:'Musculoskeletal',
desc:'Ch. 42 — bone infection (acute vs chronic, MRSA, long-term IV therapy, HBO) and benign/malignant bone tumors (osteosarcoma, Ewing sarcoma, metastatic disease), palliative care and medical aid in dying.',
qh:['Acute osteomyelitis fever usually > 101°F (38.3°C) — older adults may not spike','IV antimicrobials ≥ 6 wk after débridement → oral 4–8 wk; chronic > 3 months via PICC','Blood cultures (aerobic + anaerobic) BEFORE antibiotics; ESR may stay ↑ 3 months after therapy','Osteosarcoma: > 50% distal femur, sunburst x-ray; Ewing = most malignant, pelvis = poor prognosis; primary tumors age 10–30','Bone-seeking cancers: prostate, breast, kidney, thyroid, lung → vertebrae, pelvis, femur, ribs; malignant tumor → ↑ ALP'],
maps:['osteomyelitis','osteomyelitisCycle','boneTumor','ewing','boneMets'],
cards:[
{t:'Osteomyelitis: pathophysiology',hy:true,b:`<ul><li>Bone infection by <b>bacteria (most common)</b>, viruses, parasites or fungi → chronic recurrence, loss of function, chronic pain, amputation, death from sepsis.</li><li>Inflammation → vascular leak, edema → vessels thrombose → exudate (pus) → ischemia → necrotic bone that separates = <b>sequestrum</b>.</li><li>Sequestrum prevents healing → superimposed infection/bone abscess → chronic osteomyelitis; cycle repeats.</li><li>Osteoblasts lay new bone over infected tissue → antibiotics penetrate poorly.</li></ul>`},
{t:'Osteomyelitis: categories & causes',b:`<ul><li><b>Exogenous</b> — organisms from outside (open fracture, surgery). <b>Endogenous (hematogenous)</b> — carried by bloodstream. <b>Contiguous</b> — from adjacent skin/tissue infection.</li><li>Acute hematogenous: bacteremia, underlying disease, nonpenetrating trauma. UTIs in older men → lower vertebrae. Long-term IV catheters, hemodialysis, IV drug use. Salmonella (sickle cell disease).</li><li>Poor dental hygiene → contiguous facial-bone infection.</li><li class="mk">Most infections: <b>Staphylococcus aureus</b>; <b>MRSA</b> commonly from postoperative SSIs and implanted devices (ORIF hardware).</li><li class="mk">Older adults: contiguous spread from <b>slow-healing foot ulcers</b> (often polymicrobial).</li><li class="mk">Penetrating trauma (bites, punctures, bone surgery) → most commonly <b>Pseudomonas aeruginosa</b>.</li><li>Misdiagnosis/inadequate treatment → chronic; about half of chronic cases gram-negative.</li></ul>`},
{t:'Acute vs chronic osteomyelitis (Box 42.2)',hy:true,b:`<div class="tscroll"><table><tr><th>Acute</th><th>Chronic</th></tr><tr><td>Fever &gt; <b>101°F (38.3°C)</b><br>Swelling around area<br>Possible erythema & heat<br>Tenderness<br>Bone pain: <b>constant, localized, pulsating; worse with movement</b></td><td>Foot ulcer(s) or bone surgery (most common)<br><b>Sinus tract formation</b><br>Localized pain<br><b>Drainage</b> (bone abscess)</td></tr></table></div><ul><li>Older adults may not have high fever (lower core temp, weaker immunity).</li><li>Severe vascular compromise → may have <b>no pain</b> (nerve damage); assess distal circulation, ulcers.</li></ul><div class="mn"><span class="alh">Mnemonic — acute "HOT-P"</span>Heat/fever · Oedema (swelling) · Tenderness · Pulsating Pain</div>`},
{t:'Osteomyelitis: labs & diagnostics',b:`<ul><li class="mk">WBC often <b>elevated — may be double</b> normal.</li><li class="mk"><b>ESR</b> may be normal early, rises as disease progresses; can stay ↑ up to <b>3 months</b> after therapy → used to monitor treatment.</li><li class="mk">Bacteremia: <b>aerobic and anaerobic blood cultures before</b> drug therapy.</li><li>Radionuclide scans or MRI assess extent and perfusion.</li></ul>`},
{t:'Osteomyelitis: interventions',hy:true,b:`<ul><li>Wound → <b>surgical débridement</b>, local antimicrobial in wound bed.</li><li class="mk">IV antimicrobials at least <b>6 weeks</b> (per culture & sensitivity) → then oral <b>4–8 weeks</b>.</li><li class="mk">Copious drainage → <b>Contact Precautions</b>; teach patient, visitors, staff.</li><li>Give on schedule for therapeutic levels; watch side/toxic effects; teach home administration; may need SNF.</li><li class="mk">MRSA: IV <b>vancomycin</b>, IV <b>daptomycin</b>, or <b>linezolid</b> (IV/oral — oral lets older adults stay home).</li><li class="mk">Chronic: therapy &gt; <b>3 months</b>, via PICC; then oral.</li><li>Pain management (acute + chronic).</li><li><b>Hyperbaric oxygen (HBO)</b> for chronic unremitting disease — daily high O2 promotes healing; large tertiary centers.</li></ul><div class="al green"><span class="alh">🟢 NGN pearl</span>Diabetic ankle ulcer + copious foul drainage + fever + uncontrolled DM → high risk for <b>osteomyelitis/sepsis</b>; priority: manage wound infection to prevent sepsis — IV broad-spectrum antibiotics, prep for débridement, sliding-scale insulin, FSBG AC.</div>`},
{t:'Benign bone tumors',b:`<ul><li>Often asymptomatic; found on routine x-ray or as cause of <b>pathologic fracture</b>; cause unknown.</li><li class="mk">Most common benign tumor: <b>osteochondroma</b> — onset in childhood, grows until skeletal maturity; single or multiple; <b>femur and tibia</b> most often.</li></ul>`},
{t:'Malignant bone tumors: primary vs secondary',hy:true,b:`<ul><li><b>Primary</b> (begin in bone) — most often ages <b>10–30</b>; small percentage of bone cancers; genetic + environmental causes.</li><li><b>Secondary (metastatic)</b> — older adults; account for <b>most</b> adult bone cancers.</li><li class="mk"><b>Osteosarcoma</b> = most common primary malignant tumor; <b>&gt; 50%</b> in <b>distal femur</b>, then proximal tibia, humerus. Large, painful, swollen, <b>warm</b>; sclerotic center; <b>"sunburst"</b> x-ray; metastasizes → death.</li><li class="mk"><b>Ewing sarcoma</b> = less common but <b>most malignant</b>; pain, swelling + systemic low-grade fever, leukocytosis, anemia; pelvis & lower extremity; <b>pelvic involvement = poor prognosis</b>; spreads to lungs/bones; children/young adults in 20s.</li><li class="mk"><b>Bone-seeking cancers</b>: prostate, breast, kidney, thyroid, lung → vertebrae, pelvis, femur, ribs. Fragility fractures are a major concern.</li></ul><div class="mn"><span class="alh">Mnemonic — "PB KTL" (Lead Kettle) bone seekers</span>Prostate · Breast · Kidney · Thyroid · Lung</div>`},
{t:'Bone tumors: assessment',b:`<ul><li><b>Pain</b> = most common symptom (tumor invasion, nerve compression, pathologic fracture); severe unrelenting pain with movement in metastatic disease. Baseline pain assessment.</li><li>Local swelling, muscle atrophy/spasm; disability in advanced disease.</li><li>Young adults need strong support; loss of control, anxiety, fear, grief (initial denial); assess coping.</li></ul><div class="al green"><span class="alh">🟢 NCLEX pearl</span>Advanced metastatic bone disease → priority = <b>risk for falls due to fragility fracture</b>.</div>`},
{t:'Bone tumors: diagnostics & labs',b:`<ul><li>X-ray finds tumors/mets; CT/MRI for spine, sacrum, soft-tissue extent. Mets may ↑ or ↓ density.</li><li>Needle biopsy under fluoroscopy (ambulatory, rare complications) → staging, e.g. <b>TNM</b> (Tumor size/number, Nodes, Metastasis).</li><li class="mk">Malignant tumor → <b>↑ serum ALP</b> (osteoblastic activity).</li><li>Ewing/mets → anemia, leukocytosis; Ewing progression → ↑ <b>LDH</b>.</li><li>Mets from breast, kidney, lung → ↑ <b>serum calcium</b>. Ewing/mets → ↑ ESR (secondary inflammation).</li></ul>`},
{t:'Bone tumors: nonsurgical management',b:`<ul><li>Goal: shrink/remove tumor. Benign/small primary → removal for cure; metastatic → <b>palliative</b>.</li><li>Analgesics, chemo, radiation; bracing/short immobilization for painful spinal mets.</li><li class="mk">Chemotherapy = <b>high-alert medications</b>. <b>Ewing</b> sensitive to cytotoxics; <b>chondrosarcoma</b> often totally drug resistant; works best for small tumors; before or after surgery. Breast mets → estrogen/progesterone blockers. Cytokines for renal cancer.</li><li class="mk"><b>Zoledronic acid</b> and <b>pamidronate</b> approved for bone mets (breast, lung, prostate) — protect bone; jaw osteonecrosis risk; monitor creatinine/electrolytes (AKI).</li><li><b>Denosumab</b> also approved for metastatic bone disease.</li><li>Radiation (brachytherapy or external): treatment of choice for Ewing & early osteosarcoma to shrink tumor; palliation for mets.</li><li><b>Microwave ablation (MWA)</b> for spinal mets pain — ambulatory, sedation/GA.</li></ul>`},
{t:'Bone tumors: surgical management',b:`<ul><li><b>Wide excision</b> — lesion + intact cuff of normal tissue; cures low-grade tumors only. <b>Radical resection</b> — lesion + entire muscle, bone, tissues; high-grade tumors.</li><li>Allograft with internal fixation if no mets (proximal femur, knee); preop chemo; cadaver grafts frozen/freeze-dried; bolts, screws, plates.</li><li>Limb salvage: extensive incision, pressure dressing + wound suction several days.</li><li>UE: active-assistive exercise with opposite hand. <b>CPM</b> as early as POD 1.</li><li class="mk">LE: strengthen quadriceps; toe-touch/PWB → full weight bearing by <b>2–3 months</b>.</li><li>Bone graft: cast/support for months; <b>no weight bearing</b> until graft incorporated.</li><li>Help with ADLs but encourage independence; OT.</li></ul><div class="al green"><span class="alh">🟢 NCLEX pearl</span>Immediate post-op priority after osteosarcoma removal from the lower leg: <b>evaluate neurovascular status of the foot</b>.</div>`},
{t:'Bone cancer: care coordination',b:`<ul><li>Home with follow-up, or long-term/hospice care. Assess home barriers; cast, walker, crutches, wheelchair; remove fall hazards (pathologic fractures).</li><li>Keep chemo/radiation appointments; side effects; home IV catheter care.</li><li>Wound care, ADLs, ambulatory aids with PT/OT.</li><li>Persistent pain: relaxation, music, techniques that worked.</li><li>Fear of recurrence: acknowledge; realistic goals; gradual return (some sports prohibited).</li><li>Advanced disease: prepare for death; palliative/hospice; wills, visits.</li><li>Support: I Can Cope, CanSurmount, American Cancer Society, Canadian Cancer Society.</li></ul>`},
{t:'Medical aid in dying (MAID)',b:`<ul><li>Older adults with metastatic bone cancer and unrelenting pain may request it.</li><li>Nurses cannot directly assist but provide teaching, support, palliative care, and information for informed decisions — even if they personally disagree.</li><li class="mk">Legal in <b>10 states</b>, <b>D.C.</b>, and <b>9 countries</b>; hastens death using a <b>barbiturate</b>.</li></ul>`}
]};
