qh:['Dupuytren: 4th + 5th fingers flexion contracture; older White men, familial, diabetes; collagenase injection → straighten next day','Fasciectomy → splint + OT ≥ 6 wk','Ganglion: ages 15–50; aspirate ± cortisone; after excision avoid strenuous activity 48 h','Bunionectomy healing ≥ 12 wk; orthopedic boot while awake; one foot at a time · lapiplasty boot 2–6 wk, bear weight in 2–3 days','Post-bunionectomy cap refill > 5 s → report (normal < 3 s)'],
maps:['dupuytren','ganglion','halluxValgus','plantarFasciitis'],
cards:[
{t:'Dupuytren contracture',hy:true,b:`<ul><li class="mk">Slowly progressive thickening of the <b>palmar fascia</b> → flexion contracture of the <b>4th (ring) and 5th (little)</b> fingers; 3rd occasionally.</li><li>Cause unknown; <b>older White men</b>, familial, most common with <b>diabetes</b>, can be bilateral.</li><li>Symptoms: can't grasp objects; can't lay hand flat on table; hard <b>"cords"</b> (collagen).</li><li class="mk">Treatment when function impaired: <b>clostridial collagenase (Xiaflex)</b> injection into cord → finger straightened <b>next day</b> under local; not painful, no OT needed.</li><li class="mk">Surgery: partial/selective <b>fasciectomy</b> → splint; OT for at least <b>6 weeks</b>; care like carpal tunnel repair.</li></ul>`},
{t:'Ganglion cyst',b:`<ul><li>Round, <b>benign cyst</b> on a wrist or foot joint/tendon; synovium around tendon degenerates → weak distended sheath.</li><li>Painless on palpation; joint discomfort after prolonged use or minor trauma; can vanish and recur.</li><li class="mk">Most common ages <b>15–50</b>.</li><li>Aspiration with small needle under local/regional anesthesia ± cortisone injection; large → small-incision removal.</li><li class="mk">After surgery: avoid strenuous activity for <b>48 hours</b>; report inflammation.</li></ul>`},
{t:'Hallux valgus (bunion)',hy:true,b:`<ul><li>Great toe drifts <b>laterally</b> at the <b>first MTP joint</b>; first metatarsal head enlarges → <b>bunion</b>; pain with shoes.</li><li>Women &gt; men. Causes: poorly fitted shoes (narrow toe, high heels), OA, RA, foot/ankle surgery, family history.</li><li>Non-surgical candidates/advanced age: custom shoes from plaster molds; podiatrist.</li></ul>`},
{t:'Bunionectomy & lapiplasty',hy:true,b:`<ul><li>Surgery = treatment of choice. <b>Simple bunionectomy</b>: remove bony overgrowth + bursa, realign. Osteotomies/fusions if large; screws/wires stabilize. One foot at a time; same-day.</li><li class="mk">Assess <b>neurovascular status and pain control</b> before discharge.</li><li class="mk">Avoid full weight bearing until cleared; wear <b>orthopedic boot at all times while awake</b>.</li><li class="mk">Healing <b>12 weeks or longer</b> — feet get less blood flow (distance from heart); deformity may return.</li><li class="mk"><b>Lapiplasty</b> (minimally invasive, several small incisions): better stabilization, prevents recurrence; boot <b>2–6 weeks</b>; weight bearing <b>2–3 days</b> post-op.</li></ul><div class="al green"><span class="alh">🟢 NCLEX pearl</span>Immediately after open bunionectomy, report <b>toe capillary refill &gt; 5 seconds</b> (2+ pulse, swelling, 5/10 pain are expected).</div>`},
{t:'Plantar fasciitis',b:`<ul><li>Inflammation of the plantar fascia (arch). Middle-aged/older adults, athletes (runners); obesity contributes; usually unilateral.</li><li class="mk">Severe arch pain <b>especially on getting out of bed</b>; worse with weight bearing.</li><li>Conservative: rest, ice, stretching, foot strapping, supportive shoes, orthotics; NSAIDs or steroids.</li><li>Failed conservative care → endoscopic surgery. Teach adherence and PT exercises.</li></ul>`}
]};
TOPICS.oa = {name:'Osteoarthritis & Joint Replacement', sys:'Musculoskeletal',
desc:'Ch. 43 Mobility exemplar — OA pathophysiology, assessment, multimodal pain management, and total hip/knee/shoulder arthroplasty perioperative care. Priority concepts: Mobility, Immunity; interrelated: Pain, Inflammation.',
qh:['OA stiffness < 30 min after inactivity (RA: 45 min–hours) · Heberden = DIP, Bouchard = PIP · crepitus','Acetaminophen ceiling 4000 mg/day; liver risk > 3000 mg/day, alcoholism, liver disease','THA hip precautions: no crossing midline, no hip flexion > 90° (posterolateral/lateral), no hyperextension (anterior), no twisting; call 911 for dislocation signs','Pre-op antibiotic (cefazolin) within 1 h of incision; vancomycin/clindamycin/fluoroquinolone 2 h before · anticoagulant within 24 h, ≥ 14 days','CFNB: NV checks q2–4h; local anesthetic toxicity = metallic taste, tinnitus, slurred speech, bradycardia, hypotension, ↓ RR, seizures'],
maps:['oa','tjaPeriop','hipDislocation','last','osteonecrosis'],
cards:[
{t:'OA: pathophysiology',hy:true,b:`<ul><li>Progressive deterioration and loss of articular cartilage, bone, other connective tissue in ≥ 1 joints; <b>noninflammatory, localized</b>; most common arthritis.</li><li>Aging/injury ↓ proteoglycans, water, hyaluronic acid → less synovial fluid.</li><li>Enzymes (<b>stromelysin</b>) break down matrix; cartilage turns opaque yellow-brown; joint space narrows; <b>osteophytes</b> (bone spurs) form; fissures, calcifications, ulcers; <b>IL-1</b> worsens.</li><li>Secondary inflammation = <b>synovitis</b> (red, warm, painful, swollen joint).</li><li>Loose bone/cartilage "float" → <b>crepitus</b>. Pain/stiffness → ↓ mobility, atrophy.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slide 34 diagram labels)</span>OA/DJD joint: <b>bone hypertrophy (bone spur), cartilage particles, loss of cartilage</b>. Lecture term = <b>degenerative joint disease (DJD)</b> — same as OA.</div>`},
{t:'OA: etiology & risk factors',hy:true,b:`<ul><li><b>Primary OA</b>: aging + genetics; weight-bearing joints (hips, knees), spine, hands.</li><li><b>Secondary OA</b>: joint injury and obesity at younger ages; overuse, trauma, other joint disease (RA); heavy manual jobs (carpet laying, construction, farming); athletes (football, running, gymnastics); fractures years earlier; metabolic (<b>diabetes, Paget disease</b>) and blood disorders (<b>hemophilia, sickle cell</b>).</li><li>Much more common in people with <b>obesity</b>.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slides 30–31)</span>Risk factors: <b>1. age 2. obesity 3. post-menopause 4. comorbidity 5. sports injury</b>. Secondary OA → teach the patient to <b>lose weight first</b>.</div>`},
{t:'OA: incidence, gender & veterans',b:`<ul><li class="mk">Most people &gt; <b>60</b> have x-ray joint changes; &gt; <b>33 million</b> Americans with symptomatic OA; <b>5th</b> most common cause of disability worldwide.</li><li class="mk">Men &gt; women under <b>55</b> (injury); women &gt; men after 55 (obesity after children, broader hips).</li><li class="mk">Military: OA occurs <b>twice as often</b> in members &lt; 40; linked to combat injury, obesity, DM, HTN, PTSD, depression, anxiety.</li></ul>`},
{t:'Healthy People 2030 & OA prevention',b:`<ul><li>HP2030: reduce adults with moderate/severe arthritis pain; arthritis limiting work; limiting activities; increase physical-activity counseling.</li><li>Teach: proper nutrition / weight reduction; avoid sports injuries and risky behaviors; take work breaks in repetitive jobs; stay active.</li></ul>`},
{t:'OA: history questions',b:`<ul><li>Nature/location of joint pain; older patients underreport — use 0–10 scale.</li><li>Stiffness: where, how long? Swelling: when, where? How much discomfort; how disruptive; what helps; loss of mobility/ADLs?</li><li>Age, gender, occupation, injuries/falls, weight history (past obesity counts), sports, military, family history, conditions causing joint symptoms.</li></ul>`},
{t:'OA: signs & symptoms',hy:true,b:`<ul><li>Typical: middle-aged/older woman with chronic joint pain & stiffness; early relieved by rest, worse after activity; later with slight motion/rest.</li><li>Cartilage has no nerves — pain from joint/soft tissue, muscle spasm, secondary inflammation. Hip OA → groin pain referred to thigh, back, knee, buttock.</li><li class="mk"><b>Crepitus</b> (grating) with ROM, esp. knee. Stiffness usually <b>&lt; 30 minutes</b> after inactivity.</li><li>Knees enlarged, <b>hard</b> (bony hypertrophy); effusions when inflamed = secondary synovitis.</li><li class="mk">~Half with hand OA: <b>Heberden nodes (DIP)</b> and <b>Bouchard nodes (PIP)</b>; bilateral, esp. women; may be red/painful; familial; cosmetic concern. OA itself is not typically bilateral/symmetric.</li><li>Disuse atrophy, contractures, limp.</li><li class="mk">Spine: lumbar <b>L3–4</b>, cervical <b>C4–6</b>; facet spurs compress nerve roots → radiating pain, stiffness, spasms.</li></ul><div class="mn"><span class="alh">Mnemonic — "Heberden = High (distal), Bouchard = Bottom (proximal)"</span>H at the fingertip (DIP), B closer to the base (PIP).</div><div class="prof"><span class="alh">📋 Prof. Note (slides 32–35)</span>May be <b>unilateral</b>; pain ↓ with rest; crepitus = continuous grating, "<b>popcorn / Rice Krispies</b>" sound; always check distal finger joints for nodes; effusion common in knees; functional assessment → PT/OT; psychosocial: lifestyle, role changes, socialization, constant pain, sexuality, daily stress.</div>`},
{t:'OA: psychosocial, labs & imaging',b:`<ul><li>Chronic condition → lifestyle change, disability, role changes; pain affects sexuality (energy, positioning); depression/anxiety; body image from nodules/deformity. Ask directly; document.</li><li>Diagnosis from history + exam; labs usually normal. <b>ESR</b> and <b>hsCRP</b> may be slightly ↑ with secondary synovitis; ESR also rises with age/infection.</li><li>X-rays for structural change; MRI for vertebral/knee involvement.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slides 32, 35)</span>Lecture labs: <b>elevated ESR</b>; diagnostics: ESR, hsCRP, x-ray, MRI, <b>bone scan</b>.</div>`},
{t:'OA: priority problems & outcomes',b:`<ol><li>Persistent pain — joint swelling, cartilage deterioration, secondary inflammation.</li><li>Potential ↓ mobility — pain, muscle atrophy.</li></ol><ul><li class="mk">Outcome: pain acceptable to patient, e.g. <b>2–3 or less</b> on 0–10.</li><li><b>No drug changes the course of OA</b>; multimodal approach; assess pain before/after interventions. OARSI 2019 guidelines; Arthritis Foundation self-management.</li></ul>`},
{t:'OA drug therapy: acetaminophen & topicals',hy:true,b:`<ul><li>First-line: regular <b>acetaminophen or NSAIDs</b>.</li><li class="mk">Acetaminophen ceiling <b>4000 mg/day</b>; liver damage risk if &gt; <b>3000 mg/day</b>, alcoholism, liver disease; older adults at risk (slowed excretion). Read OTC labels; liver enzymes may be monitored.</li><li class="mk"><b>Diclofenac 1% gel</b> for mild–moderate <b>knee</b> OA: use dosing card; <b>no heat</b> over gel; no other NSAID; takes at least <b>2 weeks</b> to work.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slide 36)</span><b>Tylenol is first-line</b>; also NSAIDs, steroids; muscle relaxant <b>Flexeril (cyclobenzaprine)</b>; <b>usually no potent narcotic</b> (reserved for chronic issues). Topicals: <b>cayenne pepper</b> (capsaicin) and <b>lidocaine 5% patches</b> for neuralgia.</div>`},
{t:'OA drug therapy: oral NSAIDs & injections',hy:true,b:`<ul><li>If APAP/topicals fail → oral nonselective or COX-2 selective NSAIDs. <b>No oral NSAIDs</b> with history of stroke/MI.</li><li>Baseline CBC and CMP before oral NSAIDs.</li><li class="mk"><b>Celecoxib</b> preferred unless HTN, kidney disease, or CV history; take <b>with food</b>.</li><li class="mk">COX-2 drugs → MI, HTN (vasoconstriction, platelet aggregation). All NSAIDs → GI bleeding, AKI long-term → lowest effective dose. Report tarry stools, SOB, edema, dyspepsia, hematemesis, urine output change.</li><li>Knee: intra-articular <b>corticosteroid</b> (↓ inflammation) and <b>hyaluronic acid</b> (lubrication).</li><li class="mk">HA: ask about <b>egg or poultry allergy</b>. Injections once or several times over months.</li></ul>`},
{t:'OA: nonpharmacologic interventions',b:`<ul><li>Rest balanced with exercise, joint positioning, heat/cold, weight control, gait aids.</li><li>Structured exercise (+ weight management) for hip/polyarticular OA; <b>aquatic</b> exercise for knee OA.</li><li class="mk">Supine: <b>small pillow under head/neck only</b> — large pillows under knees/head → flexion contractures. Good posture; supportive shoes; insoles.</li><li class="mk">Heat: showers, hot packs, moist heating pads — just above body temperature; not too heavy/hot. PT: paraffin dips, diathermy, ultrasound — <b>15–20 min</b> application.</li><li>Cold: limited use; numbs nerve endings, ↓ secondary inflammation.</li><li>Gradual weight loss (RDN referral).</li><li>Regenerative: stem cells, <b>platelet-rich plasma (PRP)</b> for knee OA (growth factors regenerate cartilage).</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slide 36)</span>Positioning = <b>local, systemic and psychological rest</b>; hot vs cold depends on pain vs inflammation; weight control; complementary: <b>TENS, acupuncture, music</b>.</div>`},
{t:'OA: complementary therapies & equity',b:`<ul><li>Evidence inconsistent — assess for drug-herb interactions.</li><li class="mk"><b>Capsaicin</b> (OTC): blocks substance P; expect <b>brief burning</b>; use plastic gloves; wash hands immediately.</li><li><b>Glucosamine</b> (may ↓ inflammation) and <b>chondroitin</b> (may strengthen cartilage) — popular but <b>not</b> in OARSI guidelines.</li><li>Medical cannabis — growing evidence for OA pain.</li><li>Equity: older African Americans report more severe/disabling OA pain, get fewer prescriptions/surgery, use more integrative therapy; SDOH (access, isolation, finances); advocate & teach.</li></ul>`},
{t:'TJA: indications & contraindications',hy:true,b:`<ul><li>Indication: pain uncontrolled by conservative/drug therapy, mobility too restricted, quality of life lost. Most common OA surgery = <b>total joint arthroplasty (TJA/TJR)</b>; ≥ 2 implants. Also for RA, congenital anomalies, trauma, osteonecrosis.</li><li><b>Osteonecrosis</b> (avascular necrosis): bone death from lost blood supply (trauma, chronic steroids); femoral/humeral head, distal femur, proximal tibia.</li><li class="mk">Contraindications: <b>active infection anywhere</b> in the body, <b>rapidly progressive inflammation</b>.</li><li>Stabilize uncontrolled DM/HTN first; smokers enroll in cessation before surgery.</li><li><b>Orthopedic patient navigator</b>: nurse single point of contact — evidence-based expertise, continuum of care, advocate/educator, trends outcomes data.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slides 37–38)</span><b>TJR = last resort.</b> Also <b>osteotomy</b> = bone resection to correct joint deformity. Voice-over: TJR contraindicated in <b>end-stage degenerative</b> disease (as stated in lecture). Post-op: <b>OOB POD #1 with PT</b>; meds: anticoagulants <b>Lovenox (enoxaparin), ASA</b>, pain meds, antibiotics; promote self-care; teach limitations.</div>`},
{t:'THA: preoperative care',b:`<ul><li><b>Primary arthroplasty</b> = first time; <b>revision</b> = replaces loosened/failed implant. Most often &gt; 60 yrs.</li><li>Assess understanding; identify a <b>joint coach</b>; Joint Academy/Camp classes; materials in appropriate language/reading level; interpreter every visit.</li><li>EBP (Jones 2022, n = 707): pre-op classes → shorter LOS (~$1000 savings), more flexion, longer ambulation (Level 3, quasi-experimental).</li><li><b>"Prehab"</b>: exercises, transfers, walker/crutches. Screen delirium risk (safety sitters); otherwise <b>ERAS</b>/fast-track (shorter LOS, fewer readmissions).</li><li class="mk">RA + general anesthesia → <b>cervical spine x-ray</b> (subluxation risk with intubation).</li><li class="mk">NSAIDs, anticoagulants/antiplatelets stopped <b>5–10 days</b> pre-op; check which meds (antihypertensives, thyroid, antidiabetics) to take AM with sip of water.</li></ul>`},
{t:'THA pre-op education (Box 43.2)',hy:true,b:`<ul><li>Nutrition: screen for malnutrition (prolonged rehab, complications); RDN.</li><li>Pain: assess pre-op opioid use; teach multimodal options.</li><li class="mk">VTE: anticoagulant starting within <b>24 h</b> after surgery for at least <b>14 days</b>; frequent mobilization; compression stockings/SCDs.</li><li class="mk">Infection: IV antibiotic pre-op ± up to 24 h; screen nares for <b>S. aureus 2–4 weeks</b> pre-op; <b>nasal mupirocin twice daily × 1 week</b>; <b>CHG</b> bath night before + morning of; clean linens, no lotions/powders, no pets in bed.</li></ul>`},
{t:'THA: operative procedure',b:`<ul><li class="mk">IV antibiotic (<b>cefazolin/cefuroxime</b>) within <b>1 hour</b> before incision (SCIP); beta-lactam allergy → <b>vancomycin or clindamycin 2 hours</b> before.</li><li>Anesthesia: general, neuraxial (spinal/epidural), regional blocks ± IV moderate sedation; regional block may relieve pain ~24 h.</li><li class="mk"><b>Tranexamic acid (TXA)</b> reduces blood loss, improves H&H, fewer transfusions. Prevent <b>hypothermia</b> (bleeding, infection, cardiac events) — low BMI highest risk.</li><li class="mk"><b>MIS</b> incision ~<b>4 in</b> vs 6–12 in traditional; not for obese/osteoporotic; primary only; less blood loss/pain, shorter stay.</li><li>Hip resurfacing: cap over natural femoral head — younger patients/early disease.</li><li>Acetabular + femoral components. <b>Noncemented</b> (press-fit, younger; protect weight bearing for bone ingrowth); <b>cemented</b> (PMMA ± antibiotic; can loosen); <b>hybrid</b> = cemented femoral + noncemented acetabular. Drains rarely used.</li><li class="mk">Approaches: <b>anterior</b> = no muscle detachment, least dislocation risk, fastest recovery; direct lateral & <b>posterolateral</b> (highest dislocation risk, seldom used).</li></ul>`},
{t:'THA: preventing hip dislocation',hy:true,b:`<div class="al red"><span class="alh">🔴 Action Alert</span>Maintain correct hip/leg position at all times. Supine with head slightly elevated; 1–2 pillows between legs to keep <b>abducted</b> (lateral approaches). Abduction device with straps → <b>loosen every 2 h</b> and check skin. Leg in <b>neutral rotation</b>. Turning to nonoperative side → fully support operative leg with pillows (avoid adduction).</div><ul><li class="mk">Dislocation signs: sudden <b>intense pain</b> (or sudden agitation if nonverbal), <b>leg rotation</b>, <b>leg shortening</b>.</li><li>Surgeon may reduce under moderate sedation; else OR.</li><li>Older adults often acutely confused post-op → harder to follow teaching.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (voice-over)</span>Use an <b>abduction pillow</b> to prevent re-dislocation and keep the hip in proper position.</div>`},
{t:'THA: older adult post-op care',b:`<ul><li>Posterolateral/lateral approach: <b>abduction pillow/splint</b> (not bed pillows) if restless/confused.</li><li class="mk">Keep <b>heels off the bed</b>.</li><li>Don't rely on fever — watch <b>mental status</b> and WBC for infection.</li><li>Move slowly (orthostatic hypotension): sit, then stand briefly before walking.</li><li class="mk">Deep breathe, cough, <b>incentive spirometer every 2 hours</b>.</li><li>Out of bed to recliner <b>on surgical day</b>.</li><li>Anticipate pain needs; breakthrough meds; reorient frequently.</li></ul>`},
{t:'THA: neurovascular checks & VTE prevention',hy:true,b:`<div class="al red"><span class="alh">🔴 Action Alert</span>Frequent NV checks with vital signs: color, temperature, distal pulses, cap refill, movement, sensation; <b>compare legs</b>; report changes.</div><ul><li class="mk"><b>VTE</b> (DVT/PE) = most potentially life-threatening and common complication; risk ↑ older, obese, smokers, prior VTE.</li><li>"<b>PAC</b>": Pharmacology, Ambulation, Compression.</li><li>Drugs: subQ <b>LMWH</b> (enoxaparin, dalteparin), subQ <b>fondaparinux</b>, oral <b>rivaroxaban/apixaban</b> — 10 days to several weeks; no PT/INR monitoring needed for these (warfarin does affect clotting).</li><li class="mk">Ambulate at least <b>3 times a day</b>; heel pumps, foot circles, gluteal sets (push heels into bed), <b>quad sets</b> (straighten legs, push back of knees into bed), straight-leg raises.</li><li>SCDs better than antiembolism stockings but less accepted (hot, bulky).</li></ul>`},
{t:'THA: incision, infection & pain',b:`<ul><li class="mk">Monitor incision/VS every <b>4 h × 24 h</b>, then every <b>8–12 h</b>.</li><li>Infection: fever, redness, excessive/foul drainage — as early as <b>2–3 days</b>; older adults → delirium instead of fever; culture drainage.</li><li>Multimodal pain (opioid crisis): short-term PCA or IV push morphine/hydromorphone; oral PCA oxycodone. Non-opioids: continuous nerve block (bupivacaine, ropivacaine), NSAIDs (ketorolac, celecoxib), NMDA antagonist (ketamine), gabapentinoids (gabapentin, pregabalin).</li><li>Cryotherapy, music therapy.</li></ul>`},
{t:'THA: mobility & weight bearing',hy:true,b:`<div class="al red"><span class="alh">🔴 Action Alert</span>Assist first time OOB: <b>gait belt</b>, stand on the <b>affected-leg side</b> of the bed; patient stands on <b>unaffected leg and pivots</b> to chair. <b>Do not lift</b> the patient.</div><ul><li>OOB with help the <b>night of surgery</b>. <b>Mobility technician</b> = trained NA who ambulates patients (covers late-day surgeries).</li><li class="mk"><b>Cemented</b> → immediate <b>WBAT</b>. <b>Noncemented</b> → minimal WB until x-ray bony ingrowth → PWB → FWB over weeks.</li><li class="mk">Walker (younger: crutches) → single cane/crutch at <b>4–6 weeks</b> if no severe limp; no limp → normal chairs, toilets, driving (right hip may take longer).</li></ul><div class="al green"><span class="alh">🟢 NCLEX pearl</span>Anterior THA this morning → priority = <b>get patient out of bed and ambulate this evening</b>.</div>`},
{t:'THA: discharge & readmission',b:`<ul><li class="mk">LOS: traditional ~<b>3 days</b>; ERAS/rapid recovery &lt; 3 days, some overnight or same-day. Medicare requires a <b>3-day qualifying stay</b> for skilled rehab.</li><li>Discharge home, rehab, TCU, SNF; written instructions; PT outpatient or home.</li><li class="mk">Complete recovery <b>6 weeks or longer</b>.</li><li>Readmission causes: thromboembolic (DVT, stroke), SSI, pneumonia, sepsis; highest risk: older men with heart failure, diabetes.</li></ul>`},
{t:'THA home precautions (Box 43.3)',hy:true,b:`<ul><li>Don't sit/stand for prolonged periods; <b>don't cross legs</b> beyond midline.</li><li class="mk">Posterolateral/lateral approach: no hip flexion &gt; <b>90°</b>. Anterior approach: don't <b>hyperextend</b> operative leg behind you.</li><li>Don't twist when standing; use walker; sock aids, shoehorns, dressing sticks, extenders; weight-bearing limits.</li><li class="mk"><b>Call 911</b> for dislocation: sudden inability to bear weight, leg shortening/rotation, "popped" hip with intense pain.</li><li>Sex on surgeon advice. Report ↑ hip/anterior thigh pain; analgesics as needed; rest; ice/cryotherapy.</li><li>Incision: inspect daily for redness, heat, drainage → call surgeon; don't bathe/apply anything unless told.</li><li>Keep walking/exercises; report calf pain/redness/swelling; <b>911 for chest pain or SOB (PE)</b>; bleeding precautions (no straight razor); PT follow-up.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (hip voice-over)</span>Hip patients: <b>not allowed to bend down at the hip</b>, don't cross legs, keep incision clean/dry/intact, continue exercises to avoid deconditioning, premedicate before ambulation.</div>`},
{t:'TKA: overview & pre-op',b:`<ul><li>Demand driven by OA and obesity; also RA, post-traumatic arthritis; revision for failed primary.</li><li>Usually unilateral; <b>simultaneous bilateral TKA (BTKA)</b> or within <b>3–6 months</b>. Selected patients: same-day TKA at ambulatory surgery center (low complications).</li><li>Partial knee/MIS: younger, minimal cartilage loss; contraindicated with severe bone loss, obesity, prior knee surgery.</li><li class="mk">No special positioning for dislocation (rare). ERAS nutrition screen; obese → surgeon may ask to lose <b>20 lb or more</b>.</li><li>Bariatric history → anemia, bone loss. Joint coach, prehab; practice walker/crutches; elevated toilet seat, handrails, long-handled shoehorn.</li><li>Persistent pre-op pain (opioids, anxiety, depression, SUD) → high risk of severe post-op pain: identify early, build trust, comprehensive assessment, multimodal, pain team, treat mental health, plan post-discharge.</li><li class="mk">CHG shower night before + morning; nasal <b>mupirocin ≥ 1 week</b>; stop NSAIDs/anticoagulants <b>5–10 days</b>.</li></ul>`},
{t:'TKA: operative care',b:`<ul><li>General or neuraxial; <b>peripheral nerve block (PNB)</b> — usually <b>femoral nerve block</b> — single injection or continuous (<b>CFNB</b>) + IV moderate sedation; periarticular <b>ketorolac</b> ↓ pain, ↑ mobility.</li><li class="mk">Cephalosporin within <b>60 min</b> before incision and tourniquet; fluoroquinolone or vancomycin start <b>120 min</b> before.</li><li class="mk">Traditional incision <b>6–8 in</b>; femoral component often noncemented (press-fit), tibial cemented.</li><li>Blood loss reduction: tourniquet (↑ pain), fibrin sealants, <b>TXA (strongest evidence)</b>; compression dressing toes → thigh. MIS/robotic options.</li></ul>`},
{t:'CFNB: local anesthetic toxicity',hy:true,b:`<div class="al red"><span class="alh">🔴 Critical Rescue</span>With continuous femoral nerve block: NV checks every <b>2–4 h</b>; patient should dorsiflex/plantar flex without lower-leg pain. Watch for systemic absorption: <b>metallic taste, tinnitus, nervousness, slurred speech, bradycardia, hypotension, ↓ respirations, seizures</b> → report to surgeon/anesthesia or <b>Rapid Response Team immediately</b>.</div><div class="mn"><span class="alh">Mnemonic — "Metal Tunes Never Sound Better, Hard Rock Shakes"</span>Metallic taste · Tinnitus · Nervousness · Slurred speech · Bradycardia · Hypotension · Respirations ↓ · Seizures</div>`},
{t:'TKA: post-op care',hy:true,b:`<ul><li class="mk">Operative leg <b>neutral</b>; <b>no pillow under the knee</b>; don't hyperextend.</li><li>Cryotherapy immediately (ice/gel compression, circulating cold water) — knee very swollen/discolored for weeks.</li><li>Higher pain than THA, esp. bilateral; multimodal; IV acetaminophen for some; music therapy.</li><li class="mk">Average-risk VTE prophylaxis within <b>24 h</b>, at least <b>14 days</b>: fondaparinux, apixaban, dabigatran, rivaroxaban, low-dose UFH, LMWH + SCDs/stockings.</li><li>Discharge goal: walks with crutches/walker, enough flexion for stairs; WBAT unless noncemented; home after <b>1–3 days</b>; home PT <b>1–2 weeks</b>; stationary bike or <b>CPM</b>; return to work ~<b>6 weeks</b> (longer &gt; 75).</li><li>Readmission: infection and VTE; women with longer stays discharged to rehab/SNF.</li></ul><div class="al green"><span class="alh">🟢 NGN pearl</span>POD 2 TKA with calf pain, redness, warmth, swelling → likely <b>DVT</b>: compare calf measurements, prepare anticoagulant; monitor chest pain & dyspnea.</div><div class="al green"><span class="alh">🟢 NCLEX pearl</span>Knee OA considering TKA — risk factor of most concern: <b>obesity</b>.</div>`},
{t:'Total shoulder arthroplasty (TSA)',b:`<ul><li>Non-weight-bearing joints → less arthritis. Usually <b>glenohumeral</b> joint; hemiarthroplasty (humeral component) as alternative.</li><li class="mk">Complication: <b>subluxation/dislocation</b>; post-op abduction immobilizer/pillow — <b>don't remove</b> unless surgeon orders.</li><li>NV checks at least every <b>4–8 h</b>; infection. Shorter stay (may be same-day); OT rehab several months.</li></ul>`},
{t:'Improving mobility in OA (Box 43.4)',b:`<ul><li>Outcome: independent function ± assistive device. PT/OT; aquatic and aerobic exercise (walking, biking, swimming, dance).</li><li class="mk">Best time to exercise = <b>immediately after heat</b>.</li><li>Follow individual prescription; exercise on good and bad days; respect pain (fewer reps when inflamed); active &gt; active-assist/passive; household tasks don't replace exercise; <b>no resistive exercise when severely inflamed</b>.</li><li>Canes/walkers prevent further deterioration.</li></ul>`},
{t:'Physical disability care (Box 43.5)',b:`<ul><li>Assess mobility, ADL & IADL function; include in care plan.</li><li>Refer to PT/OT; ambulate daily if able in any inpatient setting.</li><li>Assess coping; refer to resources.</li><li>Check preventive screenings and lifestyle.</li><li>Assess SDOH affecting access; provide community resources.</li><li>Patients often report disability ignored by clinicians.</li></ul>`},
{t:'Home care & joint protection (Box 43.6)',hy:true,b:`<ul><li>Live on one floor; shower seat, handrails; <b>elevated toilet seat for several weeks</b> after THA/TKA; remove throw rugs.</li><li>Joint protection = most important teaching:</li><li>Use <b>large joints</b> (purse over shoulder); turn doorknobs <b>counterclockwise</b>; <b>two hands</b>; high straight-backed chair; get up with <b>palms</b>, not fingers; bend knees not waist; long-handled devices; Velcro, built-up utensils; no pillows except small one under head; rubber grip for jars.</li><li>Teach drugs, weight loss, balanced diet. Quackery (magnets, snake oil, industrial cleaners) — copper bracelet harmless; respect benign remedies. Arthritis Foundation.</li><li>Caregiver at home first few weeks; hand-off communication (NPSG).</li><li>Evaluation: pain 2–3/10; no TJA complications; independent movement.</li></ul>`}
]};
