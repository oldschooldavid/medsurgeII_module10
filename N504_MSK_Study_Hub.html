qh:['RA: bilateral symmetric, PIP/MCP first, morning stiffness 45 min–several hours; single hot swollen joint = infected until proven otherwise','Cervical RA → C1–C2 subluxation: keep neck neutral, call Rapid Response','RF positive > 1:80 · ANA positive > 1:40 · ESR > 20 mm/hr · anti-CCP = specific early/aggressive RA','Methotrexate: low once-WEEKLY dose, 4–6 wk onset; no alcohol, avoid crowds, folic acid, strict birth control (stop 3 mo before pregnancy) · hydroxychloroquine eye exam q6mo','BRMs: negative PPD/TB test before starting; no MS/TB · Gout: urate deposits > 6.8 mg/dL, goal < 6 mg/dL; pegloticase q2wk IV over ≥ 2 h'],
maps:['ra','sjogren','feltyCaplan','gout','goutPhases','vasculitis'],
cards:[
{t:'RA: pathophysiology',hy:true,b:`<ul><li>Chronic, progressive, <b>systemic inflammatory autoimmune</b> disease primarily of synovial joints.</li><li>Autoantibodies (<b>rheumatoid factors</b>) attack synovium → cartilage, capsule, ligaments, tendons.</li><li>CD4 T cells release <b>IL-1</b> and <b>TNF-α</b>; neutrophils break down cartilage; immune complexes deposit; osteoclasts activated; B & T cells amplify.</li><li class="mk">Synovium thickens → effusion → <b>pannus</b> (vascular granulation tissue of inflammatory cells) erodes cartilage, destroys bone → fibrous adhesions, <b>bony ankylosis</b>, calcification, secondary osteoporosis.</li><li>Early diagnosis + aggressive treatment may → remission. Remissions and <b>exacerbations (flares)</b>.</li><li>Any connective-tissue organ can be affected; <b>vasculitis</b> → organ ischemia/failure.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slides 39–41)</span>Inflammatory disorder of joints; cause thought autoimmune; genetics + environment; <b>high RA factor</b> on blood test; pannus → adhesion & calcification; <b>need early Dx to prevent permanent damage</b>. Slide 41: inflamed synovium → warmth, redness, swelling, pain → invades cartilage/bone; weakens muscles, ligaments, tendons; generalized bone loss → osteoporosis.</div>`},
{t:'RA: etiology, genetics & incidence',b:`<ul><li>Environmental + genetic; female hormones suspected; infection (<b>Epstein-Barr virus</b>); physical/emotional stressors trigger flares.</li><li class="mk"><b>HLA-DR4</b> and <b>DRB1</b> alleles = primary genetic factors; DR4 → more severe disease.</li><li class="mk">&gt; <b>1.5 million</b> affected; Whites more often; women <b>2–3 times</b> more than men; young to middle-aged women.</li><li>Equity: higher prevalence in African Americans with &lt; high school education and low income (poverty stress).</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slides 45–46)</span>Thought-of causes: <b>F &gt; M</b> (female hormones), <b>Epstein-Barr</b>, <b>stress ↑ exacerbations</b>, <b>smoking and coffee</b>, <b>age</b> (young–middle-aged women). Theories: immune complex IgG/IgM (RA factor), <b>HLA association</b>, autoimmune, family history, hormones.</div>`},
{t:'RA vs OA (Table 43.1)',hy:true,b:`<div class="tscroll"><table><tr><th></th><th>RA</th><th>OA</th></tr><tr><td>Onset</td><td><b>35–45 yr</b></td><td><b>&gt; 60 yr</b></td></tr><tr><td>Gender</td><td>F 2–3:1</td><td>F 2:1</td></tr><tr><td>Cause</td><td>Autoimmune (genetic); stress triggers flares; environment</td><td>Aging, possible genetics, obesity, trauma, occupation</td></tr><tr><td>Process</td><td>Inflammatory</td><td>Degenerative ± secondary inflammation</td></tr><tr><td>Pattern</td><td>Bilateral, symmetric, multiple; UE first; <b>DIPs spared</b>; systemic</td><td>May be unilateral, single; weight-bearing joints, hands, spine; <b>MCPs spared</b>; nonsystemic</td></tr><tr><td>Labs</td><td>↑ RF, ANA, ESR</td><td>Normal or slightly ↑ ESR</td></tr><tr><td>Drugs</td><td>NSAIDs (short-term), methotrexate, BRMs</td><td>NSAIDs (short-term), acetaminophen, other analgesics</td></tr></table></div>`},
{t:'RA key features: early vs late (Box 43.7)',hy:true,b:`<div class="tscroll"><table><tr><th>Early</th><th>Late (advanced)</th></tr><tr><td><b>Joint:</b> inflammation<br><b>Systemic:</b> low-grade fever, fatigue, weakness, anorexia, paresthesias</td><td><b>Joint:</b> deformities (swan neck, ulnar deviation), moderate–severe pain, morning stiffness<br><b>Systemic:</b> osteoporosis, severe fatigue, anemia, weight loss, muscle atrophy, subcutaneous nodules, peripheral neuropathy, vasculitis, pericarditis, fibrotic lung disease, Sjögren, kidney disease</td></tr></table></div><div class="mn"><span class="alh">Mnemonic — early RA "FLAWS"</span>Fever (low-grade) · Lethargy/fatigue · Anorexia · Weakness · Swollen/inflamed joints (+ paresthesias)</div><div class="prof"><span class="alh">📋 Prof. Note (slide 47 + voice-over)</span>Acute or chronic onset. Early: fatigue, stiffness, weight loss, <b>bilateral synovitis</b>. Late: <b>gel phenomenon</b> (morning stiffness) lasting <b>45 minutes to several hours</b> after waking; joint effusion on palpation; muscle atrophy; osteoporosis; Baker cyst. Voice-over: late signs = <b>Felty syndrome, joint deformity, weight loss</b>.</div>`},
{t:'RA: joint assessment',hy:true,b:`<ul><li>Early: joint inflammation, weakness, fatigue, anorexia, weight loss of <b>2–3 lb (1 kg)</b>, low-grade fever.</li><li class="mk">Upper extremities first — <b>PIP and MCP</b> joints; <b>bilateral, symmetric</b> (both wrists); reddened, warm, stiff, swollen, tender.</li><li class="mk">Only <b>one hot, swollen, painful joint</b> out of proportion → considered <b>infected until proven otherwise</b>; refer immediately; long-term antibiotics.</li><li>Advanced: morning stiffness for hours; soft, puffy joints; <b>spindlelike</b> fingers; atrophy; ↓ ROM. Onset more common in <b>winter</b>.</li><li>TMJ uncommon (pain chewing). Spine: <b>cervical</b> most affected.</li></ul>`},
{t:'Cervical RA: critical rescue',hy:true,b:`<div class="al red"><span class="alh">🔴 Critical Rescue</span>Cervical RA → <b>subluxation of C1–C2</b>; phrenic nerve branches restricted → respiratory compromise; risk of quadriparesis/quadriplegia. If cervical pain (may radiate down an arm) or ↓ cervical ROM: <b>keep neck straight in neutral</b>; notify <b>Rapid Response Team</b> and provider immediately.</div><ul><li>Pre-op RA patients get <b>cervical spine x-ray</b> before general anesthesia/intubation.</li></ul>`},
{t:'RA: deformities, cysts & nodules',b:`<ul><li><b>Boutonnière</b>: PIP flexed, DIP hyperextended. <b>Swan neck</b>: PIP hyperextended, DIP flexed. <b>Ulnar deviation</b>.</li><li>Wrist involvement → carpal tunnel syndrome. Secondary osteoporosis → fractures.</li><li class="mk"><b>Baker cyst</b> — enlarged popliteal bursa behind knee (compression, pain). <b>Achilles tendon rupture</b> possible.</li><li class="mk"><b>Subcutaneous nodules</b>: soft, round, movable; ulnar forearm, fingers, Achilles; come and go; = severe destructive disease; can open/infect; occasionally in lungs.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slide 48)</span>"Cutaneous nodules — <b>FA</b>" (forearm). Voice-over (slide 44): assess wrists, hands, fingers for redness, heat, swelling.</div>`},
{t:'RA: vasculitis, organ & eye involvement',b:`<ul><li class="mk"><b>Vasculitis</b> (small–medium vessels): ischemic skin lesions — groups of <b>small brownish spots around nail beds</b>; count/locate daily — ↑ lesions = ↑ vasculitis. LE lesions → slow-healing ulcers.</li><li>Peripheral neuropathy → <b>footdrop</b>, paresthesias (older adults).</li><li>Respiratory: pleurisy, pneumonitis, interstitial fibrosis, pulmonary HTN. Cardiac: pericarditis, myocarditis.</li><li>Eyes: <b>iritis, scleritis</b> — red sclera, irregular pupils, visual disturbance.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slides 45, 48–49)</span>Vasculitis compromises blood flow → malfunctioning organ → organ/system failure. Respiratory: pleurisy, pneumonitis, fibrosis. Cardiac: <b>carditis</b>.</div>`},
{t:'Sjögren, Felty & Caplan syndromes',hy:true,b:`<ul><li class="mk"><b>Sjögren syndrome</b> (most common in advanced RA) — triad: <b>dry eyes</b> (keratoconjunctivitis sicca), <b>dry mouth</b> (xerostomia), <b>dry vagina</b> (some). Eyes feel "gritty"; inspect for sticky membranes, red eyes, no tearing.</li><li class="mk"><b>Felty syndrome</b> — ↓ WBC in late RA (textbook calls it a pulmonary complication).</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slide 49) — terminology difference flagged</span>Lecture defines <b>Felty syndrome = hepatosplenomegaly + leukopenia</b> (textbook: ↓ WBC, "pulmonary complication") — both agree on low WBC; know the lecture's hepatosplenomegaly pairing. Lecture adds <b>Caplan syndrome = nodules in the lungs</b>. Sjögren = immune complexes + inflammatory cells; voice-over: first complaint is often <b>visual disturbance</b>.</div>`},
{t:'RA: psychosocial assessment',b:`<ul><li>Fear of dependence, uncertainty, altered body image, devaluation, frustration, depression, helplessness.</li><li>Role changes (cooking, sexual partner); extreme fatigue → early bedtime, naps, withdrawal.</li><li>Newer drugs give hope; only a <b>small percentage</b> become wheelchair dependent.</li><li>Knowledgeable patients cope better.</li></ul>`},
{t:'RA: laboratory assessment',hy:true,b:`<ul><li>No single test confirms RA.</li><li class="mk"><b>RF</b> (IgG & IgM antibodies): positive titer <b>&gt; 1:80</b>; not diagnostic alone.</li><li class="mk"><b>Anti-CCP</b>: very specific and sensitive for <b>early RA</b>; marker of aggressive, erosive disease.</li><li class="mk"><b>ANA</b> (FANA): positive <b>&gt; 1:40</b>.</li><li class="mk"><b>ESR</b> &gt; <b>20 mm/hr</b> → inflammation; best to monitor course (rises with severity, falls in remission). <b>hsCRP</b> more sensitive; detects infection.</li><li>CBC: anemia (fatigue); ↑ WBC = inflammation; ↓ WBC = <b>Felty</b>; <b>thrombocytosis</b> in late RA.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slides 50–51)</span>Also: <b>serum complement C3 & C4 usually ↓</b> in autoimmune disease; <b>serum protein electrophoresis</b>; <b>IgG elevated</b> (needed to combine with RF); CBC — WBC up or down, <b>platelets up</b>; other labs by organ involvement.</div>`},
{t:'RA: other diagnostics & arthrocentesis',b:`<ul><li>X-ray for deformities; CT for cervical spine; MRI; nerve conduction (neuropathy); PFTs (lung).</li><li><b>Arthrocentesis</b>: bedside/office; local anesthetic; large-gauge needle (usually knee) aspirates fluid + relieves pressure. RA fluid: ↑ WBC, cloudy, ↑ volume; RF, immune complexes.</li><li class="mk">After: <b>ice and rest the joint 24 hours</b>; acetaminophen; report ↑ pain/swelling immediately.</li></ul>`},
{t:'RA: priority problems & outcomes',b:`<ol><li>Chronic inflammation & persistent pain (systemic autoimmune process)</li><li>Potential ↓ mobility (deformity, atrophy, fatigue)</li><li>Potential ↓ self-esteem (deformity)</li></ol><ul><li>Managed in community; admitted usually for other problems. Goal: remission, slow progression.</li><li>Outcomes: pain 2–3/10; independent ADLs ± devices; positive self-perception.</li></ul>`},
{t:'RA drugs: NSAIDs & methotrexate',hy:true,b:`<ul><li>NSAIDs for early RA; with H2 blocker (<b>famotidine</b>); no change after <b>6–8 weeks</b> → switch.</li><li>DMARDs slow progression — start early.</li><li class="mk"><b>Methotrexate (MTX)</b> = mainstay; low <b>once-a-week</b> dose; inexpensive; slow — <b>4–6 weeks</b> to work.</li><li>Monitor ↓ WBC/platelets (marrow suppression), ↑ liver enzymes, ↑ creatinine.</li></ul><div class="al red"><span class="alh">🔴 Drug Alert — MTX</span>Infection risk: avoid crowds/ill people. <b>No alcohol</b> (liver toxicity). Report mouth sores, acute dyspnea (<b>pneumonitis</b>); lymphoma rare. <b>Folic acid</b> ↓ side effects. <b>No pregnancy</b> — strict birth control; stop at least <b>3 months</b> before planned pregnancy; may restart after birth if not breastfeeding.</div><div class="prof"><span class="alh">📋 Prof. Note (slide 52 voice-over)</span>MTX = cytotoxic; S/E ↓ immunity → stay away from large crowds/ill people, rest to ↓ pain; folic acid & vitamin B. Voice-over also says "avoid acetaminophen" — textbook emphasizes <b>avoiding alcohol</b>; both protect the liver.</div>`},
{t:'RA drugs: hydroxychloroquine, sulfasalazine, steroids',b:`<ul><li><b>Hydroxychloroquine</b>: antimalarial DMARD for mild disease; well tolerated (mild GI, light-headedness, headache); not with cardiac disease/dysrhythmias.</li></ul><div class="al red"><span class="alh">🔴 Drug Alert</span>Hydroxychloroquine → <b>retinal damage</b>: report blurred vision/headache; eye exam <b>before</b> and every <b>6 months</b>.</div><ul><li><b>Sulfasalazine</b>: combo therapy; no sulfa allergy; N/V, rash.</li><li><b>Prednisone</b>: fast anti-inflammatory; pulse (high short), low chronic, or tapering bridge therapy.</li><li class="mk">Chronic steroid complications: <b>diabetes, ↓ immunity, fluid/electrolyte imbalance, HTN, osteoporosis, glaucoma</b>.</li><li>Single-joint cortisone injection → ice and rest <b>24 h</b>.</li></ul><div class="mn"><span class="alh">Mnemonic — steroid effects "DIF HOG"</span>Diabetes · Immunity ↓ · Fluid/electrolytes · Hypertension · Osteoporosis · Glaucoma</div>`},
{t:'RA drugs: biologics (BRMs) & JAK inhibitors',hy:true,b:`<ul><li>BRMs = newest/most effective DMARDs (interleukins, TNF inhibitors, monoclonal antibodies); try another in same class if ineffective; expensive.</li><li class="mk">High infection risk — avoid ill people/crowds. <b>Not</b> for MS, TB, or positive TB test. Confirm recent <b>negative PPD</b> before starting.</li><li>Mostly parenteral → teach self-injection.</li><li><b>TNF inhibitors</b> (etanercept, infliximab, golimumab): report infection; etanercept → report injection-site reaction.</li><li><b>IL-6 receptor antagonists</b> (book lists anakinra, tocilizumab): monitor WBC (marked ↓), liver enzymes.</li><li class="mk"><b>JAK inhibitors</b> (tofacitinib, baricitinib, upadacitinib): newest DMARD class; <b>tofacitinib black box</b> — cardiac events, cancer, blood clots; report infection.</li></ul><div class="al green"><span class="alh">🟢 NCLEX pearl</span>Starting etanercept → "Report any symptoms of possible <b>infection</b>." 72-yr-old on infliximab with rising temp, HR, RR, WBC → <b>infection</b>.</div><div class="prof"><span class="alh">📋 Prof. Note (voice-over)</span>Lecture calls <b>Enbrel (etanercept)</b> the "gold standard," given subQ (voice-over says IM or subQ) → teach injections.</div>`},
{t:'RA drugs from lecture (older agents)',b:`<div class="prof"><span class="alh">📋 Prof. Note (slide 52) — lecture-only agents</span></div><ul><li><b>Salicylates</b> (aspirin).</li><li><b>NSAID</b>: Celebrex (celecoxib).</li><li><b>Antimalarial</b>: slow disease and produce remissions — lecture lists quinine and penicillamine.</li><li><b>Cytotoxic</b>: methotrexate, <b>Imuran (azathioprine)</b>, <b>Cytoxan (cyclophosphamide)</b> — S/E ↓ immunity.</li><li class="mk"><b>Gold</b>: maximum dose <b>1000 mg</b> (<b>25–50 mg/week</b>); watch side effects.</li></ul>`},
{t:'RA: nonpharmacologic & complementary',b:`<ul><li>Rest, positioning, ice/heat. <b>Ice</b> packs on "hot" (acutely inflamed) joints — not heavy; frozen peas at home.</li><li>Paraffin dips before hand exercises. <b>Hot shower</b> (not sponge/tub bath) for morning stiffness; grab bars, nonskid treads, shower chair, walk-in shower.</li><li>Hot packs (microwave/stovetop per instructions).</li><li><b>Plasmapheresis</b> (removes antibodies) ± steroid pulse for severe, life-threatening disease.</li><li>Hypnosis, acupuncture, imagery, music, stress management; nutrition (catabolic state from TNF); no food causes/cures; supplements only with provider oversight.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slide 42 + voice-over)</span>Nursing interventions: relieve acute pain with <b>braces, splints</b>; <b>decrease fatigue</b>; <b>body positioning</b>; <b>active ROM</b>. Protect joints: <b>both hands</b> to hold objects, <b>palms</b> to push up from bed/chair, <b>rubber grip</b> for jars, <b>long-handled</b> devices; ice packs for acute inflammation.</div>`},
{t:'RA: mobility, ADLs & fatigue',b:`<ul><li>Don't do ADLs <b>for</b> the patient unless asked (they may prefer teeth to open crackers).</li><li>Hospital trays: heavy covers, cartons, packets — china/heavy plastic cup with handle; RDN help.</li><li>OT: long-handled brushes, dressing sticks; use larger joints (IPEC roles & responsibilities).</li><li>Fatigue: pain, sleep loss, weakness, <b>anemia</b> (iron, folic acid); check stool for blood with NSAIDs — <b>older White women</b> most likely GI bleed; aggressive PT for atrophy; sleep measures.</li></ul>`},
{t:'Energy conservation (Box 43.8)',hy:true,b:`<ul><li class="mk">Balance activity with rest — <b>one or two naps a day</b>.</li><li>Pace yourself; don't plan too much in one day.</li><li>Set priorities — most important first.</li><li>Delegate to family/friends.</li><li>Plan ahead to avoid rushing/stress.</li><li>Learn your activity tolerance; don't exceed it.</li></ul>`},
{t:'RA: self-esteem & coping',b:`<ul><li>Most important: <b>communicate acceptance</b>; build trust; encourage feelings.</li><li>Loss behaviors (denial → anger/depression); "manipulative/demanding" = coping for control — the <b>"arthritis personality" is a myth</b>, avoid the label.</li><li>Emphasize strengths; past coping; mental health or spiritual referral.</li><li>Let patient make decisions; asking for help can prevent joint damage.</li></ul><div class="al green"><span class="alh">🟢 NCLEX pearl</span>"I will use my recliner more to put my feet up" → needs more joint-protection teaching (pillows/flexion → contractures).</div>`},
{t:'RA: home care, SME & resources',b:`<ul><li>Wide doors, ramps, single-floor ADLs, bathroom/hall handrails, adapted counters, elevated chairs and toilet seats.</li><li>Seek care for joint inflammation; check before OTC/home remedies (Arthritis Foundation on quackery).</li><li>Work: lighter load, or disability via employer/Social Security.</li><li>Home care nurse/aide, PT, OT in flares; support groups; counselor/spiritual leader; <b>palliative care</b> for severe RA (depression, anorexia, dyspnea).</li></ul>`},
{t:'Gout: pathophysiology & risk',hy:true,b:`<ul><li>Primary gout = most common inflammatory disease causing arthritis; untreated → kidney disease.</li><li>Inflammatory response to <b>hyperuricemia</b> (uric acid from purine metabolism).</li><li class="mk">Serum uric acid above <b>6.8 mg/dL</b> → urate crystals deposit in connective tissue/synovial fluid → gouty arthritis, <b>tophi</b>.</li><li class="mk">Risk: <b>men &gt; 50</b>, genetics, chronic alcohol, obesity, <b>thiazide diuretics</b>. Secondary gout more common in women (thiazides).</li></ul>`},
{t:'Gout: phases',hy:true,b:`<ol><li><b>Asymptomatic hyperuricemia</b> — ↑ uric acid, no symptoms; some never progress.</li><li><b>Acute gouty arthritis</b> — attack in <b>one joint</b>, often the <b>great toe metatarsal</b> joint; excruciating pain; hours–days, may resolve; triggered by alcohol, high protein, drugs. Multiple attacks = chronic gout.</li><li><b>Tophaceous arthritis</b> — years untreated: tophi, kidney stones, kidney disease (rare now).</li></ol>`},
{t:'Gout: drug therapy',hy:true,b:`<ul><li class="mk">Goal: serum uric acid <b>&lt; 6 mg/dL</b>.</li><li>Acute attack: <b>NSAID, steroid, or colchicine</b>.</li><li class="mk"><b>Colchicine</b>: inhibits leukocyte migration → ↓ inflammation; does <b>not</b> lower uric acid or prevent attacks; GI distress (diarrhea, pain, N/V) → take <b>with food</b>.</li><li><b>Probenecid</b> (uricosuric): kidneys excrete uric acid; safe with colchicine.</li><li class="mk">Chronic: xanthine oxidase inhibitors <b>allopurinol</b>, <b>febuxostat</b> (↓ production; febuxostat → more CV events).</li><li class="mk"><b>Pegloticase</b>: refractory chronic gout; IV every <b>2 weeks</b>, infuse over <b>no less than 2 hours</b>, under supervision.</li></ul>`},
{t:'Gout: preventing attacks',b:`<ul><li class="mk">Avoid/limit triggers: <b>red meat</b> (ground beef), <b>organ meats</b> (liver), <b>shellfish</b> (shrimp), <b>alcohol — especially beer</b>.</li><li>Review meds (e.g., <b>thiazide</b>); obese → RDN / weight-loss program.</li></ul><div class="mn"><span class="alh">Mnemonic — gout triggers "BOAR"</span>Beer/alcohol · Organ meats · Animal red meat · Really-salty shellfish (shrimp)</div>`}
]};
TOPICS.fx = {name:'Fractures', sys:'Musculoskeletal',
desc:'Ch. 44 Mobility exemplar — classification, bone healing, acute/chronic complications (ACS, FES, VTE, AVN, CRPS), emergency care, casts, traction, fixation, ambulatory aids, hip and other site-specific fractures, vertebroplasty.',
qh:['Healing stages: hematoma 24–72 h → granulation 3 d–2 wk → callus 3–6 wk → ossification 3–8 wk → remodeling 4–6 wk up to 1 yr; adult heals 4–6 wk (≥ 3 mo if > 70)','ACS 6 Ps: pain (out of proportion, with passive motion), pressure, paralysis, paresthesia (often first), pallor, pulselessness → loosen dressing, DO NOT elevate or ice, call provider → fasciotomy','FES: 12–48 h after fracture; earliest = altered mental status/hypoxemia (PaO2 < 60), dyspnea, tachypnea; petechiae neck/chest = last sign','NV checks q1h × 24 h then q1–4h; cap refill < 3 s (5 s older); casts: finger fits under; ice 24–48 h; elevate above heart','Traction: skin 5–10 lb, skeletal 15–30 lb; weights hang freely — never remove without order; delayed union = not healed in 6 months'],
maps:['fracture','boneHealing','acs','fes','crps','hipFx','emergencyFx','vte','hypovolemia','delayedUnion'],
cards:[
{t:'Fracture classification',hy:true,b:`<ul><li><b>Complete</b> — across entire width → two sections; if alignment disrupted = <b>displaced</b> (damages nerves, vessels, soft tissue).</li><li><b>Incomplete</b> — through part of bone; usually not displaced.</li><li class="mk"><b>Open (compound)</b> — skin disrupted, external wound; graded (<b>grade I–III</b> in lecture). <b>Closed (simple)</b> — no visible wound.</li><li><b>Fragility (pathologic/spontaneous)</b> — minimal trauma to diseased bone (cancer, osteoporosis).</li><li><b>Fatigue (stress)</b> — excessive strain; athletes.</li><li><b>Compression</b> — loading force on long axis of cancellous bone; vertebrae of older adults with osteoporosis; extremely painful.</li><li>Fig. 44.1 types: impacted, comminuted, displaced spiral, displaced transverse.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slides 17–18)</span>Lecture titles open/closed under "fracture reduction"; lecture term <b>"pathological"</b> = textbook "fragility"; "compressed" = compression.</div>`},
{t:'Stages of bone healing',hy:true,b:`<ol><li class="mk"><b>24–72 hours</b>: <b>hematoma</b> forms (bone very vascular).</li><li class="mk"><b>3 days–2 weeks</b>: <b>granulation tissue</b> invades hematoma → fibrocartilage.</li><li class="mk"><b>3–6 weeks</b>: <b>callus</b> (new vascular tissue) — nonbony union begins.</li><li class="mk"><b>3–8 weeks</b>: callus resorbed, transformed to bone (ossification).</li><li class="mk">From <b>4–6 weeks</b> up to <b>1 year</b>: consolidation & remodeling.</li></ol><ul><li class="mk">Young healthy adult: <b>4–6 weeks</b>; &gt; <b>70 years</b>: <b>3 months or longer</b>.</li><li>Also affected by trauma severity, bone type, management, infection, AVN.</li></ul><div class="mn"><span class="alh">Mnemonic — "Happy Girls Can Only Remodel"</span>Hematoma → Granulation → Callus → Ossification → Remodeling</div>`},
{t:'Aging & bone healing',b:`<ul><li>Needs calcium, phosphorus, vitamin D, protein.</li><li>Post-menopause estrogen loss ↓ new bone formation.</li><li>PVD/arteriosclerosis ↓ arterial flow → less O2 & nutrients → slower repair.</li></ul>`},
{t:'Acute complications: VTE & infection',hy:true,b:`<ul><li class="mk"><b>VTE</b> (DVT + PE) = most common complication of LE surgery/trauma and <b>most often fatal</b> complication of MSK surgery.</li><li>Wound infection = most common orthopedic trauma infection (superficial → deep abscess); hardware infection; <b>Clostridia → gas gangrene or tetanus</b>.</li><li>Osteomyelitis most common with <b>open fractures</b> and after surgical repair; MRSA.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slides 25–26 + voice-over)</span>Infection delays healing, ↓ function → observe S&S, prevent. Clostridial infection: <b>cellulitis, myositis, clostridial myonecrosis</b>. Severe infection → necrosis → possible <b>amputation</b>. Voice-over: <b>femur fractures carry the highest DVT risk</b> (big bone, marrow). Prevent emboli: ambulate POD 1, push fluids if not contraindicated, SCDs, anticoagulants if high risk.</div>`},
{t:'Hypovolemic shock with fractures',b:`<div class="prof"><span class="alh">📋 Prof. Note (slide 26)</span>Bone is <b>vascular</b> → high bleeding risk; arterial trauma → <b>hemorrhage → hypovolemic shock</b>.</div><ul><li>Pelvic fractures: monitor VS, skin color, LOC for internal blood loss (see chest/pelvis card).</li><li>Femur fractures: extensive hemorrhage possible.</li></ul>`},
{t:'Acute compartment syndrome (ACS)',hy:true,b:`<ul><li>Serious limb-threatening ↑ pressure within compartment(s) (muscle, vessels, nerves) → ↓ circulation to lower leg or forearm.</li><li><b>Ischemia–edema cycle</b>: capillaries dilate → histamine ↑ permeability → plasma proteins leak → edema → nerve pressure → severe pain → ↓ perfusion → more ischemia.</li><li class="mk">Pain <b>greater than expected</b>, severe with <b>passive motion</b>; paresthesia often <b>before</b> vascular/motor signs; pale/ashen; pulses weaken but <b>rarely disappear</b>; tense tissue. Untreated → cyanosis, numbness, paresis, necrosis.</li><li>External causes: tight bulky dressings, casts. Internal: blood/fluid accumulation. Also burns, insect/snake bites, massive IV infiltration.</li><li class="mk">Treatment: <b>fasciotomy</b> — fascia cut, wound left open, heals inside-out, skin graft in several days.</li><li>Long-term: infection, motor weakness, contracture, <b>myoglobinuric renal failure</b>, amputation.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slide 26 + voice-over)</span><b>ACS is an emergency</b> — numbness/tingling of the extremity → notify the doctor right away. New cast + tightness or puffy fingers → think compartment syndrome first.</div>`},
{t:'ACS: critical rescue (6 Ps)',hy:true,b:`<div class="al red"><span class="alh">🔴 Critical Rescue</span>Missed early cues → "six Ps": <b>pain, pressure, paralysis, paresthesia, pallor/ash gray, pulselessness</b>. Analgesics that worked become ineffective. Notify provider <b>immediately</b>; relieve pressure (loosen bandage/tape; cast per protocol). <b>Do NOT elevate or ice</b> the extremity (compromises flow).</div><ul><li>Compartment pressure: one-time handheld digital device or continuous monitoring — recommended for comatose/unresponsive multi-trauma patients.</li></ul><div class="mn"><span class="alh">Mnemonic — "6 Ps"</span>Pain · Pressure · Paresthesia · Pallor · Paralysis · Pulselessness (pulselessness is LATE)</div><div class="al green"><span class="alh">🟢 NGN pearl</span>Tib-fib ex-fix patient: pain 3→5→7/10 despite PCA, "pins and needles," absent left pedal pulse, cap refill 5 s → <b>ACS</b>: prepare for surgery (fasciotomy), IV NS; NOT ice, NOT arteriography, NOT transfusion.</div>`},
{t:'ACS key features (Box 44.1)',b:`<div class="tscroll"><table><tr><th>Physiologic change</th><th>Clinical finding</th></tr><tr><td>↑ compartment pressure</td><td>No change</td></tr><tr><td>↑ capillary permeability / histamine</td><td>Edema, ↑ edema</td></tr><tr><td>↑ blood flow</td><td>Pulses present, pink tissue</td></tr><tr><td>Pressure on nerve endings</td><td>Acute pain</td></tr><tr><td>↑ tissue pressure</td><td>Referred pain to compartment</td></tr><tr><td>↓ perfusion, ↓ O2</td><td>↑ edema, pallor/ash gray</td></tr><tr><td>↑ lactic acid</td><td>Unequal pulses, flexed posture</td></tr><tr><td>Anaerobic metabolism</td><td>Cyanosis</td></tr><tr><td>Vasodilation → ↑ flow → ↑ pressure</td><td>Tense swelling, tingling, numbness</td></tr><tr><td>↑ edema</td><td>Paresthesia</td></tr><tr><td>Muscle ischemia</td><td>Severe pain unrelieved by drugs</td></tr><tr><td>Tissue necrosis</td><td>Paresis/paralysis</td></tr></table></div>`},
{t:'Fat embolism syndrome (FES)',hy:true,b:`<ul><li class="mk">Fat globules from <b>yellow marrow</b> enter blood within <b>12–48 hours</b> after injury → clog small vessels of vital organs, most often <b>lungs</b>.</li><li>Also pancreatitis, osteomyelitis, blunt trauma, sickle cell (less often).</li><li class="mk">Earliest signs: <b>hypoxemia</b>, dyspnea, tachypnea; then headache, lethargy, agitation, confusion, ↓ LOC, seizures, vision change. <b>Petechiae</b> (red-brown, nonpalpable, measles-like) on neck, upper arms, chest = classic but <b>last</b> sign.</li><li class="mk">Labs: <b>PaO2 &lt; 60 mm Hg</b>, ↑ ESR, ↓ calcium, ↓ RBC & platelets, ↑ serum lipids.</li><li>CXR bilateral infiltrates (may be normal); CT patchy opacities; brain MRI. Can → respiratory failure/death (pulmonary edema); may be misdiagnosed as PE.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slide 26)</span>Earliest manifestation = <b>ALOC (altered level of consciousness)</b> from low arterial O2 (hypoxemia, dyspnea, tachypnea).</div><div class="mn"><span class="alh">Mnemonic — "FAT BAG"</span>Fever/Fast breathing · Altered mental status · Tachycardia · Bone (long-bone fx) · A-hypoxemia · Globules → petechiae (last)</div>`},
{t:'Chronic complications: AVN, nonunion, CRPS',hy:true,b:`<ul><li><b>Avascular necrosis</b> (osteonecrosis): disrupted blood supply → bone death; most often <b>hip fractures</b> or displaced fractures; hardware; long-term corticosteroids.</li><li class="mk"><b>Delayed union</b> = not healed within <b>6 months</b>. <b>Nonunion</b> = never heals. <b>Malunion</b> = heals incorrectly. Common: tibial fractures, multiple treatment techniques, pathologic fractures, older adults → persistent pain, deformity.</li><li><b>CRPS</b> (formerly reflex sympathetic dystrophy): CNS/PNS dysfunction → severe persistent pain; feet and hands; genetics may play a role; PT desensitization with varied textures.</li><li class="mk">CRPS triad: <b>autonomic</b> (color, temp, skin sensitivity, sweating, edema) · <b>motor</b> (paresis, spasms, loss of function) · <b>sensory</b> (intense burning, intractable pain).</li><li>Post-injury PTSD, anxiety, sleep disturbance, depression.</li></ul>`},
{t:'Psychological impact of MSK trauma',b:`<ul><li>MSK injury → PTSD, acute stress disorder, anxiety, sleep disturbance, depression.</li><li class="mk">Risk factors: <b>female, older age, high-intensity acute pain, high injury severity</b> → refer to mental health.</li><li>Long recovery affects relationships, body image, sexuality; assess coping, spiritual beliefs, supports (family, church/temple, community); counseling may help.</li><li>Single uncomplicated fracture (finger, wrist, foot, toe) → no hospitalization, back to activities in days.</li></ul>`},
{t:'Etiology, incidence & special groups',b:`<ul><li>Primary cause: trauma (MVC, falls esp. older adults); direct blow or indirect muscle-pull force; sports, exercise, malnutrition, osteoporosis.</li><li class="mk"><b>Rib fractures</b> = most common adult fracture. <b>Femoral shaft</b> = young/middle-aged. <b>Hip</b> = highest in older adults. Humeral — older = more proximal.</li><li class="mk"><b>Colles (wrist)</b> — middle/late adulthood from falls = <b>FOSH</b> (fall on out-stretched hand).</li><li>Military: strains, sprains, <b>stress fractures</b> of LE; lumbar injuries from heavy loads → disability.</li></ul>`},
{t:'Health promotion: preventing MSK injury',b:`<ul><li>Airbags ↓ deaths but ↑ leg/ankle fractures (older adults).</li><li>Teach: osteoporosis screening, fall prevention, home safety, no substance use while driving, prevent overuse injuries, <b>helmets</b> (bikes, motorcycles, small motorized devices).</li><li class="mk">Smokers: more fractures, more severe pain, <b>slower bone/tissue healing</b> → cessation program.</li></ul>`},
{t:'Fracture assessment: history & physical',hy:true,b:`<ul><li>New fracture = moderate–severe pain → delay detailed history until comfortable.</li><li>Mechanism (incisional, crush, acceleration/deceleration, shearing, friction) → which systems to check (spleen, brain, kidneys; head/spinal injury).</li><li>Substance use history at any age; <b>opioid use</b> before fracture (pain plan); occupation, hobbies (skiing, contact sports, daily jogging → stress fx).</li><li class="mk">Assess all systems for life threats first. <b>Pelvic fracture</b>: VS, skin color, LOC for <b>hypovolemic shock</b>; if one pelvic fracture, <b>usually another</b>; check urine for <b>blood</b>; can't void → bladder/urethra injury.</li><li>Hip fracture: groin pain or pain behind knee/low back.</li><li>Shoulder/upper arm: assess sitting/standing; distal arm: supine and elevated. Legs/pelvis: supine; impacted hip fracture may walk briefly (not recommended).</li><li>Look for deformity, rotation, dislocation, shortening; ecchymosis; <b>subcutaneous emphysema</b> (later).</li></ul><div class="al red"><span class="alh">🔴 Action Alert</span>Fractured ribs → severe pain on deep breath; monitor respiratory status (pain, <b>pneumothorax</b>); manage pain before continuing assessment.</div>`},
{t:'Neurovascular assessment (Box 44.2)',hy:true,b:`<div class="al red"><span class="alh">🔴 Action Alert</span>Swelling at fracture site is rapid → NV compromise. Gently assess and <b>compare extremities</b>: color, temperature, sensation, mobility, pain, pulses <b>distal</b> to fracture; cap refill if not in severe pain.</div><div class="tscroll"><table><tr><th>Check</th><th>Normal</th></tr><tr><td>Skin color distal</td><td>No change vs rest of body</td></tr><tr><td>Temperature (dorsum of hand)</td><td>Warm</td></tr><tr><td>Movement active/passive</td><td>Moves without discomfort; no difference passive vs active</td></tr><tr><td>Sensation — paper clip in web space (1st–2nd toe / thumb–index)</td><td>No numbness/tingling; loss = <b>peroneal</b> or <b>median</b> nerve damage</td></tr><tr><td>Pulses distal</td><td>Strong, equal</td></tr><tr><td>Cap refill (least reliable)</td><td><b>&lt; 3 s</b> (<b>5 s</b> older)</td></tr><tr><td>Pain</td><td>Localized, stabbing/throbbing; out of proportion + unrelieved = ACS</td></tr></table></div><div class="al green"><span class="alh">🟢 NCLEX pearl</span>Displaced closed ankle fracture → priority assessment = <b>neurovascular status</b>.</div>`},
{t:'Fracture labs, imaging & priority problems',b:`<ul><li>No specific fracture labs. H&H may ↓ (bleeding); ESR ↑ with soft-tissue damage; ↑ ESR + WBC during healing → infection; Ca & P ↑ during healing.</li><li>X-ray confirms (repeat with more views if symptomatic); <b>CT</b> for hip, pelvis, spinal compression fx; <b>MRI</b> for soft-tissue damage.</li><li>Priority problems: 1) acute pain; 2) ↓ mobility; 3) potential neurovascular compromise.</li><li class="mk">Pain outcome: <b>2–3/10</b> after reduction & immobilization.</li></ul>`},
{t:'Emergency care of extremity fracture (Box 44.3)',hy:true,b:`<ul><li class="mk">Call 911; assess <b>ABCs</b>; if CPR needed: <b>circulation first</b>, then airway, breathing.</li><li>Quick head-to-toe; cut clothing; support above/below injury; <b>don't remove shoes</b> unless foot/ankle injured.</li><li>Direct pressure on bleeding + pressure over nearest proximal artery.</li><li>Remove jewelry; keep warm and supine.</li><li class="mk">NV check distal; <b>splint including joints above and below</b>; recheck circulation after splinting.</li><li>Cover open wounds with (sterile) dressing.</li><li>Prehospital pain: short-term IV opioids (fentanyl, hydromorphone, morphine) ± NSAIDs, regional blocks; <b>cardiac monitoring if &gt; 50</b> before drugs.</li></ul>`},
{t:'Closed reduction, splints & boots',b:`<ul><li>Bone reduction = realigning bone ends — closed (nonsurgical) or open (surgical).</li><li class="mk">NV checks every <b>1 h × 24 h</b>, then every <b>1–4 h</b>; elevate above heart; ice <b>24–48 h</b>.</li><li>Closed reduction: manual traction under moderate sedation; monitor SpO2 and <b>ETCO2</b>.</li><li class="mk">If ETCO2 &lt; <b>30 mm Hg</b> and RR falls to <b>10</b>/min → rub sternum, encourage breathing.</li><li>X-ray confirms alignment before immobilizing. Immobilizers for scapula/clavicle; thermoplastic splints; splints preferred over casts when possible (allow swelling).</li><li>Orthopedic shoes (foot/toe), padded boots with Velcro (ankle/lower leg; allow weight bearing).</li></ul>`},
{t:'Casts',hy:true,b:`<ul><li>Rigid device immobilizing a part while others move; allows early mobility; for fractures, deformity correction/prevention.</li><li><b>Fiberglass</b> (waterproof synthetic) most used — rigid in minutes. <b>Plaster</b>: feels hot (chemical reaction), then cool; <b>≥ 24 h</b> to dry; wet = cold, musty, gray; dry = hard, odorless, shiny white. Don't cover new plaster; handle with <b>palms</b>.</li><li><b>Window</b>: cut for wound care/pulses/drains; replace piece (prevents localized edema). <b>Bivalve</b>: cut lengthwise if too tight (cutter won't cut skin; feels warm).</li><li class="mk">Arm cast: elevate with <b>hand higher than heart</b>; ice <b>24–48 h</b>; sling distributes weight over shoulders/trunk. Leg cast: elevate on pillows, ice 24 h; crutches/walker; cast shoe.</li></ul><div class="al red"><span class="alh">🔴 Action Alert</span>Cast not too tight — you should be able to <b>insert a finger</b>; NV checks every <b>hour for first 24 h</b>; ice <b>24–36 h</b>. Inspect every <b>8–12 h</b> for drainage, alignment, fit; report sudden ↑ drainage or broken cast integrity.</div><div class="prof"><span class="alh">📋 Prof. Note (slide 20 voice-over)</span>New cast swells, then loosens as swelling ↓ → patient returns in <b>1–2 days</b> for resizing. Tightness or puffy fingers → think <b>compartment syndrome</b>.</div>`},
{t:'Cast complications & teaching',b:`<ul><li>Plaster absorbs drainage; synthetic wicks it away. Circling drainage is of unclear benefit.</li><li class="mk">Pressure necrosis → painful <b>"hot spot"</b>, warmer area, <b>musty/foul odor</b>, fever → infection.</li><li class="mk"><b>Never put objects inside</b> the cast (hanger, pencil) to scratch.</li><li>Check circulation daily: numbness, ↑ pain, movement; wiggle toes.</li><li>Immobility: skin breakdown, pneumonia, atelectasis, VTE, constipation, contracture, OA, osteoporosis, atrophy.</li></ul>`},
{t:'Traction',hy:true,b:`<ul><li>Pulling force for bone reduction or (last resort) to ↓ muscle spasm; not common today.</li><li class="mk"><b>Skin traction</b> (Buck — Velcro boot, belt, halter): ↓ spasm with hip/proximal femur fractures; weight limited to <b>5–10 lb (2.3–4.5 kg)</b>.</li><li class="mk"><b>Skeletal traction</b>: screws in bone (e.g., femoral condyles); <b>15–30 lb (6.8–13.6 kg)</b>; longer time; impairs mobility; pin care per protocol.</li></ul><div class="al red"><span class="alh">🔴 Action Alert</span>Never remove weights without an order; don't lift them or let them rest on the floor — <b>weights hang freely</b>; teach AP, radiology, visitors. Inspect skin every <b>8 h</b> (remove belt/boot q8h if possible). Circulation every <b>hour × 24 h</b>, then every <b>4 h</b>.</div><div class="prof"><span class="alh">📋 Prof. Note (slides 20–21)</span>Lecture traction types: skin, skeletal, plaster, brace, circumferential; <b>inspect skeletal pin sites q 8 hrs</b>; pin care each shift. Weights on the floor → notify provider (bone not aligned).</div>`},
{t:'Fracture pain: drugs & PT modalities',b:`<ul><li>Opioid + nonopioid alternated/combined; short-term PCA (morphine, fentanyl, hydromorphone); oral oxycodone ± APAP, hydrocodone + APAP.</li><li class="mk">NSAIDs ↓ inflammation but <b>can slow bone healing</b>.</li><li>Time strong analgesics before dressing changes, PT, bedtime.</li><li class="mk"><b>Opioid-induced constipation (OIC)</b>, esp. older adults → stool softeners/laxatives, fluids, fiber, activity. Other constipating drugs (MIC): anticholinergics, CCBs, antidepressants, diuretics.</li><li>PT: ice/heat, e-stim, <b>dexamethasone iontophoresis</b> (electric current drives steroid through skin; pinch/sting).</li></ul>`},
{t:'ORIF & external fixation',hy:true,b:`<ul><li><b>ORIF</b> — open reduction (surgeon views site) + internal fixation (pins, screws, rods, plates, prostheses); permits early mobility; hardware may be removed after union (ankles most often).</li><li><b>External fixation</b> — pins/wires through skin and bone into a rigid <b>external frame</b>; for open fractures/soft-tissue injury; UE, LE, pelvis.</li><li class="mk">Ex-fix advantages: <b>minimal blood loss</b>, early ambulation/exercise with pain relief, maintains alignment, stabilizes comminuted fractures needing graft. Disadvantage: <b>pin site infection</b> → osteomyelitis.</li><li>Post-op: IV <b>ketorolac</b> in PACU; nerve block → little pain 18–24 h then medicate before it wears off; nonpharmacologic methods.</li><li class="mk">Pin sites every <b>8–12 h</b>: clear drainage/crusting expected first <b>48–72 h</b>; <b>don't remove crusts</b> (protective). Body-image & clothing alterations.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slides 20, 22)</span>Ex-fix = small percutaneous incisions; <b>self-drilling pins</b> held by external metal frame; risk <b>pin-tract infection</b>. Voice-over: fixation (external/internal) is usually what surgeons choose nowadays — minimal blood loss, early ambulation, promotes healing.</div>`},
{t:'Procedures for nonunion',b:`<ul><li><b>Electrical bone stimulation</b> — external noninvasive (no known risks; not on an arm with a <b>pacemaker</b>) or implanted direct current; months of treatment.</li><li><b>Bone grafting</b> — chips from <b>iliac crest</b> packed/wired between ends; cadaver allografts from bone bank (frozen/freeze-dried).</li><li>Living donors: THA patients may donate femoral heads — screening + <b>written consent</b>.</li><li class="mk"><b>Low-intensity pulsed ultrasound</b> — about <b>20 min/day</b>; no contraindications or adverse effects.</li></ul>`},
{t:'Increasing mobility after fracture',b:`<ul><li>PT (usually LE), OT (usually UE) — timing depends on injury.</li><li>After ankle ORIF: therapy once staples removed & boot fitted; gentle ROM; <b>laterality</b> training (computer, <b>mirror-box therapy</b>); touch and texture desensitization → ↓ CRPS risk.</li><li class="mk">LE weight bearing begins ~<b>6 weeks</b> after surgery: toe-touch or partial with crutches/walker; strengthen (atrophy starts early).</li><li>Success depends on motivation; ankle rehab can take months.</li></ul>`},
{t:'Crutches, walkers & canes',hy:true,b:`<ul><li>Crutches most common LE aid; need arm strength, balance → older adults use walker/cane.</li><li class="mk">Crutch fit: <b>2–3 finger-breadths</b> between axilla and crutch top with tip <b>6 in (15 cm)</b> diagonally in front of foot; elbow flexed <b>≤ 30°</b>; padded tops, rubber tips (axillary nerve damage, bursitis if misused).</li><li class="mk"><b>Three-point gait</b> most common for MSK injury (little weight on affected leg).</li><li class="mk">Cane: on the <b>unaffected side</b>; elbow ≤ 30°; top level with greater trochanter / wrist; step forward with <b>cane + affected leg together</b>, then unaffected leg. Straight cane = least support; hemi/quad = more.</li></ul><div class="al green"><span class="alh">🟢 NCLEX pearl</span>Right tibial fracture: "I should use the cane on my <b>left</b> side."</div><div class="prof"><span class="alh">📋 Prof. Note (voice-over)</span>Educate patients to use a cane on the <b>unaffected side</b>.</div>`},
{t:'Care coordination & self-management',b:`<ul><li>Uncomplicated → home from ED/urgent care; hip or multiple trauma → hospital then home, rehab or LTC; hand-off with <b>SBAR</b>.</li><li>Home: barriers (stairs), bathroom access, pets, scatter rugs, waxed floors; room for wheelchair/aids; home health visits.</li><li>Written device/wound care instructions; complications and when to seek help.</li><li class="mk">Diet high in <b>protein and calcium</b>; LE fracture → less weight bearing → <b>anemia</b> (marrow needs WB stimulus) → iron foods, daily iron multivitamin with food, stool softener with stimulant.</li><li>Follow-up visits for healing; home aides; realistic expectations.</li><li>After cast removal (Box 44.4): soak off scaly skin (don't scrub); expect smaller, weak, stiff limb; support with pillows/orthotic; exercise slowly per PT; support stockings/elastic wrap for LE swelling.</li><li>Evaluation: pain 2–3/10; ambulates; no immobility effects; adequate perfusion; no complications.</li></ul>`},
{t:'Hip fracture: overview',hy:true,b:`<ul><li>Most common MSK injury in older adults; high mortality; &gt; half can't live independently; many die within first year. Incidence ↓ (early bone-loss treatment, less smoking).</li><li class="mk">Upper third of femur: <b>intracapsular</b> (within joint capsule) vs <b>extracapsular</b> (outside) — subtypes: capital, subcapital, femoral neck, intertrochanteric, subtrochanteric.</li><li class="mk">Femoral neck → blood supply disruption → <b>avascular necrosis</b> of femoral head (esp. displaced).</li><li class="mk"><b>Osteoporosis = biggest risk factor</b>; weakened hip may break → causes the fall (fragility fracture).</li><li>Risk: sensory changes, gait/balance/strength, joint stiffness; osteoporosis, foot disorders, bone mets, cardiac changes; drugs (diuretics, antihypertensives, antidepressants, sedatives, opioids, alcohol — <b>3 or more</b> drastically ↑ falls); throw rugs, clutter, poor lighting, uneven surfaces, pets.</li><li>Presentation: <b>groin pain</b> or pain behind the knee; sometimes low back or none; can't stand without pain.</li></ul>`},
{t:'Hip fracture: pre-op & surgical care',hy:true,b:`<ul><li>IV morphine/hydromorphone in ED; PCA or epidural post-op. Pain in older adults often underassessed → better management improves cognition.</li><li class="mk"><b>Fascia iliaca compartment block (FICB)</b> — levobupivacaine blocks femoral, lateral cutaneous, obturator nerves; avoids femoral vessel injury; effective without opioids, low cost.</li><li class="mk">Pre-op <b>skin traction is ineffective</b> for pain (systematic review).</li><li class="mk">Treatment of choice: surgical <b>ORIF</b> (intramedullary rod, pins, compression screw, or prosthesis = <b>hemiarthroplasty</b> for femoral head/neck). Rarely nonsurgical (bed rest) if too debilitated.</li><li><b>Delirium</b> common before/after (pulling tubes, climbing out, day-night reversal, quiet delirium) → fall prevention, family alerts.</li></ul><div class="al red"><span class="alh">🔴 Action Alert</span>Hemiarthroplasty → dislocation/subluxation risk: <b>prevent adduction and rotation</b>; pillows or abduction device; straps not too tight; skin every <b>2 h</b>; NV checks.</div><div class="prof"><span class="alh">📋 Prof. Note (slides 23–24 + voice-over)</span>Hip fx: intra- vs extracapsular; treatment of choice <b>surgical (ORIF)</b>; pain management; <b>early ambulation/PT</b>. Post-op plan: <b>heels off the bed</b>, ambulate <b>POD 1</b>, reposition <b>q2h</b>, no bending at hip, don't cross legs, incision clean/dry/intact, premedicate before ambulation; PCA with multiple fractures.</div>`},
{t:'Hip fracture quality indicators (Box 44.5)',hy:true,b:`<ul><li class="mk"><b>Timing</b>: surgery within <b>24–48 h</b> of fracture.</li><li class="mk"><b>Mobility</b>: up to stand/walk/sit on day of surgery; walk <b>1–2×/day</b> POD 1.</li><li>Malnutrition: screen on admission; diet + daily oral supplements.</li><li class="mk"><b>CAUTI</b>: avoid catheter; if used remove within <b>24 h</b>.</li><li>Pain: multimodal, geriatric dosing, regional blocks.</li><li>Delirium: cognitive screen on admission, daily delirium screen.</li><li class="mk">Pneumonia: HOB ≥ <b>30°</b>, dysphagia screen, mouth care.</li><li>Constipation: daily BM assessment, bowel protocol.</li><li>VTE protocol. Pressure injury: risk assessment, daily skin check, <b>heels off bed</b>.</li><li class="mk">Transitions: teach self-management; follow-up <b>4–6 weeks</b>. Bone health follow-up.</li></ul>`},
{t:'Other lower-extremity fractures',b:`<ul><li>Coordinate PT/OT and case manager; most go home.</li><li class="mk"><b>Femur (lower two-thirds)</b>: usually MVC; rarely cast (spastic thigh muscles displace ends); <b>extensive hemorrhage</b> possible; ORIF (plates, nails, rods, screw) or ex-fix; healing <b>≥ 6 months</b>; skeletal traction then brace/cast if nonsurgical.</li><li class="mk"><b>Tib-fib</b>: closed reduction + cast <b>6–10 wk</b>; delayed union common (poor perfusion); internal fixation + long-leg cast <b>4–6 wk</b>; fibula non–weight bearing (may need no fixation); ex-fix 6–10 wk then cast; non–weight bearing with crutches.</li><li><b>Ankle</b>: bimalleolar (Pott) = medial malleolus (tibia) + lateral malleolus (fibula) ± talus; ORIF via medial + lateral incisions; restricted WB.</li><li>Foot/toes: painful but less serious; orthopedic shoe/boot.</li></ul>`},
{t:'Chest & pelvic fractures',hy:true,b:`<ul><li>Rib/sternal fractures: fragments may puncture lungs, heart, arteries → <b>assess ABCs first</b>; lower ribs → liver, spleen, kidneys. Heal on their own; analgesia; <b>pneumonia risk</b> from shallow breathing.</li><li class="mk">Pelvic fractures = <b>2nd most common cause of trauma death after head injury</b>; venous oozing/arterial bleeding → hypovolemic shock. Young adults: MVC, falls from buildings; older: falls.</li></ul><div class="al red"><span class="alh">🔴 Action Alert</span>Assess internal abdominal trauma: <b>blood in urine and stool</b>, abdominal rigidity or swelling; CT or bedside ultrasound.</div><ul><li>Non–weight-bearing pelvic fx (pubic ramus, iliac crest): bed rest on firm mattress, stool softeners; heals ~<b>2 months</b>.</li><li>Weight-bearing fx (pelvic ring, acetabulum): ex-fix and/or ORIF; WB from days to <b>12 weeks</b>.</li></ul>`},
{t:'Vertebral compression fractures & vertebroplasty',hy:true,b:`<ul><li>Most from osteoporosis or metastatic cancer; vertebral body collapses → severe pain on moving, kyphosis, possible neuro compromise.</li><li>Nonsurgical: bed rest, analgesics, nerve blocks, PT. Painful VCFs → <b>vertebroplasty</b> (percutaneous bone cement), <b>kyphoplasty</b> (balloon), preferred <b>vertebral augmentation</b> (cavity-creating device).</li><li>IV ketorolac before; fluoroscopy/CT guidance; home in <b>2–4 h</b> or overnight.</li></ul><div class="tscroll"><table><tr><th>Pre-procedure</th><th>Post-procedure</th></tr><tr><td>Platelets <b>&gt; 100,000/mm³</b>; anticoagulants stopped; baseline neuro (movement/sensation); pain level; can lie <b>prone ≥ 1 h</b>; IV + VS</td><td><b>Flat supine 1–2 h</b>; VS + frequent neuro checks; ice to puncture site; compare pain to baseline; watch bleeding or SOB; assist ambulation</td></tr></table></div><ul><li class="mk">Discharge: no driving/machinery <b>24 h</b>; watch site for infection; keep dressing dry, remove next day; no soaking bath <b>1 week</b>; resume walking next day, increase slowly.</li></ul>`}
]};

qh:['ABI = ankle systolic ÷ brachial systolic; normal ≥ 0.9','Severed finger: wrap in dry sterile gauze → sealed plastic bag → ice water 1 part ice : 3 parts water (never directly on ice)','Prone 20–30 min every 3–4 h to prevent hip flexion contracture; firm mattress; ROM','Residual limb: figure-eight elastic wrap, re-wrap q4–6h, tighter distal → looser proximal, anchor above highest joint','Phantom limb pain is real — treat promptly; calcitonin IV (week after), propranolol (dull burning), pregabalin/gabapentin (sharp), baclofen (cramps), mirror therapy'],

cards:[
{t:'Amputation: types & levels',hy:true,b:`<ul><li>Removal of a body part; limb salvage advances ↓ elective amputations; loss is complete, permanent → body image/self-esteem changes; interprofessional team (prosthetist, rehab, psychologist, case manager, physiatrist).</li><li class="mk"><b>Elective</b> (most) — complications of <b>PAD</b> → ischemia; <b>Traumatic</b> — accidents or war.</li><li>LE amputations far more frequent than UE. Toes: minor, but <b>great toe</b> affects balance, gait, push-off.</li><li class="mk"><b>Syme</b>: most of foot removed, <b>ankle remains</b> → weight bearing without prosthesis, less pain. Midfoot amputations common for PVD.</li><li><b>BKA</b> preserves knee (intense effort); <b>AKA</b> when disease extends beyond knee; hip disarticulation & hemipelvectomy (more in younger patients) for bone cancer, osteomyelitis, trauma — last resort.</li><li class="mk">The <b>higher</b> the level, the <b>more energy</b> needed for mobility.</li><li>UE amputation more incapacitating (ADLs, driving) → save length; early prosthesis vital.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slides 27–29)</span>Elective amputations related to <b>PVD or DM</b> (infection reaching bone) — considered only after other interventions fail to restore circulation/salvage limb. LE levels: <b>BKA and AKA</b>. Multidisciplinary care: pre-op, post-op, pain (phantom limb), psychosocial, ambulation, age-related implications.</div>`},
{t:'Complications of amputation',hy:true,b:`<ol><li class="mk"><b>Hemorrhage → hypovolemic shock</b> (major vessels severed)</li><li><b>Infection</b> (wound or bone) — malnourished, confused older adults at greatest risk (excreta, picking at dressing)</li><li><b>Phantom limb pain</b></li><li><b>Neuroma</b></li><li><b>Flexion contractures</b></li></ol><div class="mn"><span class="alh">Mnemonic — "HIP-NF"</span>Hemorrhage · Infection · Phantom limb pain · Neuroma · Flexion contracture</div>`},
{t:'Phantom limb pain (PLP)',hy:true,b:`<ul><li>Sensation in the removed part right after surgery, usually fades; persistent unpleasant/painful = <b>PLP</b>.</li><li class="mk">More common with <b>chronic limb pain before surgery</b>; less common with traumatic amputation; usually after <b>AKA</b>.</li><li>Intense burning, crushing, cramping; limb feels distorted or retracted into the residual limb; numbness/tingling = <b>phantom limb sensation</b>.</li><li>Triggers: touching residual limb, temperature/barometric changes, illness, fatigue, anxiety, stress, even urination.</li></ul><div class="al red"><span class="alh">🔴 Action Alert</span>PLP is <b>real</b> — manage promptly and completely. Don't remind the patient the limb is gone. Handle the residual limb gently.</div><div class="al green"><span class="alh">🟢 NCLEX pearl</span>2 days post-AKA, 9/10 pain in the (missing) left foot → <b>administer the ordered analgesic</b>.</div><div class="prof"><span class="alh">📋 Prof. Note (slide 28 + voice-over)</span>PLP = unpleasant/painful sensation felt in the amputated part. <b>Pain is whatever the patient says it is</b> — always assess.</div>`},
{t:'PLP management',b:`<ul><li class="mk">Opioids <b>less effective</b> for PLP than residual limb pain — determine which pain it is.</li><li class="mk">IV <b>calcitonin</b> during the week after amputation ↓ PLP.</li><li><b>Propranolol</b> — constant dull burning pain. <b>Pregabalin/gabapentin</b> — knifelike or sharp burning (neuropathic). <b>Baclofen</b> — spasms/cramping. Antidepressants as adjuvants.</li><li>PT: massage, heat, <b>TENS</b>, <b>mirror therapy</b> (proven to ↓ PLP), ultrasound.</li><li>Chaplain/social worker; psychologist.</li></ul>`},
{t:'Neuroma & flexion contractures',b:`<ul><li><b>Neuroma</b>: sensitive tumor of damaged nerve cells; most often <b>UE</b> amputations; ± pain; diagnosed by <b>sonography</b>; surgery (often regrows, more painful) or nerve blocks, steroid injections, hypnosis.</li><li class="mk"><b>Flexion contractures</b> of hip/knee with LE amputation — must be avoided so patient can use a <b>prosthesis</b>; proper positioning + active ROM early.</li></ul>`},
{t:'Etiology, incidence & equity',b:`<ul><li class="mk"><b>Diabetes mellitus → PAD</b> = main cause of LE amputation; considered only after limb salvage (e.g., PTA) fails. <b>Trauma</b> = 2nd cause and primary cause of <b>UE</b> amputation (lawn mowers, MVC, industrial machines).</li><li class="mk">&gt; <b>2 million</b> Americans live with amputation; people of color most affected.</li><li class="mk">Black individuals less likely to get limb salvage → <b>2×</b> as likely (esp. men) to have DM/PAD amputation; Hispanics <b>30%</b> more likely (diabetic foot infection); Indigenous people <b>70%</b> more likely. Drivers: low income, lack of access.</li><li>Veterans: IEDs, bombs, MVCs → multiple limb loss; comorbid TBI, PTSD.</li></ul>`},
{t:'Health promotion',b:`<ul><li>Typical elective patient: middle-aged/older person of color with diabetes and long smoking history, poor foot care → nonhealing infected ulcer, gangrene.</li><li>Adherence, healthy weight, exercise, no smoking prevent/manage DM and circulation problems.</li><li>2nd group: young men in vehicle/industrial/combat accidents → safety precautions, no speeding or drinking and driving.</li></ul>`},
{t:'Amputation assessment',b:`<ul><li>NV status of limb to be removed; with PVD check <b>both legs</b>: color, temp, sensation, pulses; cap refill unreliable in older adults (use skin near nail); discoloration, edema, ulcers, necrosis, <b>hair distribution</b>.</li><li>Psychosocial: even partial finger/thumb loss is traumatic; expect grieving; <b>traumatic</b> amputation harder to adjust to than planned; willingness for prolonged rehab; past crisis coping.</li><li>Veterans may be bitter, hostile, depressed; medical discharge. Altered self-concept, intimacy fears, loss of independence → chaplain, social worker, VA counseling.</li><li>Family response correlates with recovery; rehab for multiple limb trauma <b>9–15 months</b>. Culture: some groups (e.g., <b>Jewish</b>) store the amputated part for later burial or bury immediately.</li></ul>`},
{t:'Diagnostics: ABI, Doppler, TcPO2',hy:true,b:`<ul><li class="mk"><b>Ankle-brachial index (ABI)</b> = ankle systolic ÷ brachial systolic; normal <b>≥ 0.9</b>; can be done at bedside.</li><li>Doppler ultrasonography / laser Doppler flowmetry measure blood-flow speed.</li><li><b>TcPO2</b> (transcutaneous oxygen pressure) — reliable predictor of healing.</li><li>Surgeon doesn't rely on any single test.</li></ul>`},
{t:'Priority problems',b:`<ol><li>Potential ↓ tissue perfusion in residual limb (damage, edema, bleeding)</li><li>Acute/persistent pain</li><li>↓ Mobility (pain, spasm, balance loss)</li><li>↓ Self-esteem (ADL deficits, body image, lack of supports)</li></ol>`},
{t:'Emergency care: traumatic amputation',hy:true,b:`<ul><li>Call 911; airway/breathing; <b>direct pressure</b> with layers of dry gauze/cloth (gloves); <b>elevate</b> above heart; <b>don't remove</b> dressing (dislodges clot).</li><li class="mk">Fingers most often replanted: wrap in <b>dry sterile gauze</b> → watertight sealed <b>plastic bag</b> → bag in <b>ice water (1 part ice : 3 parts water)</b>, <b>never directly on ice</b>; finger shouldn't touch water; don't remove semidetached parts; send part with patient.</li><li>Mutilated/crushed parts can't be reattached.</li></ul>`},
{t:'Monitoring residual limb perfusion',hy:true,b:`<ul><li>Skin flap pink (light skin) / not discolored vs usual (dark skin); warm not hot; nearest proximal pulse vs other side (bilateral PVD → use Doppler); VS per protocol.</li></ul><div class="al red"><span class="alh">🔴 Critical Rescue</span>↓ perfusion → notify surgeon/RRT immediately. <b>BP drops + pulse rises</b> → suspect covert bleeding. <b>Lift the residual limb and feel under the pressure dressing</b> for dampness. Bleeding → direct pressure, call RRT/provider, stay with patient.</div>`},
{t:'Promoting mobility & preventing contractures',hy:true,b:`<ul><li>PT/OT early; pre-op strengthening and practice with crutches.</li><li>ROM exercises; <b>trapeze/overhead frame</b>; turn every <b>2 h</b>; move slowly.</li><li class="mk"><b>Firm mattress</b>; <b>prone every 3–4 h for 20–30 minutes</b> if tolerated → prevents hip flexion contracture.</li><li>Pull residual limb close to other leg, contract <b>gluteal</b> muscles; resistive exercise after staples out.</li><li>Push residual limb down into soft pillow → firmer pillow → hard surface (prepares for prosthesis, ↓ PLP).</li><li class="mk">Elevating lower-leg residual limb on a pillow is <b>controversial</b>; some allow first <b>24–48 h</b> for swelling; inspect daily that limb lies <b>flat</b>.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slide 28 + voice-over)</span>Nursing interventions: <b>pain control, prevention of infection and contractures</b>; encourage ROM so the patient can ambulate with prosthetics.</div>`},
{t:'Prostheses & limb shaping',hy:true,b:`<ul><li>Certified prosthetist-orthotist (CPO) pre-op; some fitted at surgery; older PVD patients after healing. Bring <b>sturdy shoes</b> to fitting (heel height).</li><li><b>Rigid removable dressings</b> preferred (↓ edema, shape, access). Air splint (can leak). Elastic bandages.</li><li class="mk">Re-wrap every <b>4–6 h</b> or if loose; <b>figure-eight</b> (no constriction); decrease tightness <b>distal → proximal</b>; anchor to the highest joint (above knee for BKA).</li><li>CAD-CAM custom fit; ankle-foot prosthesis (Flex-Foot). <b>Osseointegration</b>: implant anchored in residual bone + transcutaneous connector.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slide 29 voice-over)</span>Prosthetics are made <b>individually for each patient</b>; use the <b>correct liners</b> to prevent wounds/skin infection; keep <b>follow-up appointments</b> for fit.</div>`},
{t:'Promoting self-esteem',b:`<ul><li>Meet a rehabilitated amputee of similar age.</li><li>"<b>Stump</b>" vs "residual limb" is controversial — ask the patient's preference.</li><li>Euphoria ≠ acceptance; refusing to look at the site while verbalizing acceptance is common — document, share.</li><li>Many return to jobs, sports (ski, hike, golf); vocational rehab if needed; sexuality counseling.</li><li>Realistic goals, one day at a time, recognize strengths.</li></ul><div class="al green"><span class="alh">🟢 NCLEX pearl</span>"I feel sad and useless" before BKA → "<b>Can you tell me more about your feelings?</b>"</div>`},
{t:'Home care & self-management (Box 44.7)',b:`<ul><li>Discharge home, skilled/rehab, or LTC (dementia); wheelchair room, toilet and kitchen access; home modifications.</li><li>After sutures/staples out: residual limb care; figure-eight wrap several times a day or <b>shrinker stocking</b>; wash daily with soap and water; inspect daily for inflammation/breakdown.</li><li>Home health assesses: circulation, infection, healing, contracture, dressing/wrap; ADLs, ambulatory aids, prosthesis care, pain, nutrition, body image coping.</li></ul><div class="al red"><span class="alh">🔴 Action Alert</span>With prosthetist: teach cleaning of socket and inserts, <b>correct liners</b>, footwear, and a follow-up schedule before discharge.</div><ul><li>Resources: Amputee Coalition, Amputation Foundation; veterans: Hope for the Warriors, Military OneSource, VA, Wounded Warrior Project, American Amputee Foundation, Amputee Coalition of Canada.</li><li>Evaluation: perfusion; pain 2–3/10; independent mobility; positive self-esteem.</li></ul>`}
]};

cards:[
{t:'Carpal tunnel syndrome: pathophysiology',hy:true,b:`<ul><li class="mk"><b>Median nerve</b> compressed in the wrist → pain and numbness; carpal tunnel = rigid canal between carpal bones and fibrous sheet; swollen/thick synovium compresses nerve.</li><li>Median nerve: motor, sensory, autonomic to <b>first three fingers + palmar ring finger</b>. Flexion impinges nerve; extension ↑ lower-tunnel pressure.</li><li class="mk"><b>Most common repetitive stress injury (RSI)</b>; RSIs = fastest-growing occupational injury (pinching/grasping with wrist flexion: factory, computer, jackhammer workers; texting; golf, tennis, racquetball).</li><li>Usually chronic; acute rare (excess exercise, edema/hemorrhage, median artery thrombosis; hand burns, <b>Colles fracture</b>).</li><li>Complication of metabolic/connective tissue disease: <b>RA synovitis</b>, <b>diabetes</b> (neuropathy).</li><li class="mk">Women, esp. &gt; <b>50</b>, much more likely (RA prevalence); usually dominant hand, can be bilateral.</li></ul><div class="prof"><span class="alh">📋 Prof. Note (slide 15)</span>Carpal tunnel = <b>chronic problem</b>; complication of metabolic & connective-tissue diseases; <b>synovitis</b> (inflamed synovium) in RA.</div>`},
{t:'Ergonomics & CTS prevention (Box 44.8)',b:`<ul><li><b>Ergonomics</b> = arranging equipment/furniture so work is efficient and comfortable without injury; OSHA requires ergonomic workstations; Joint Commission requires safe work environment; Canada: joint health & safety committees.</li><li>Know workplace laws; wrist rests, geometric keyboards, chair height for good posture.</li><li>Regular <b>short breaks</b> from repetitive tasks (computers, phones); stretch fingers/wrists; stay relaxed.</li></ul>`},
{t:'CTS assessment',hy:true,b:`<ul><li>Often diagnosed from history: hand pain, numbness, <b>"pins and needles"</b> in first 3 fingers; <b>nocturnal burning pain</b> relieved by activity on waking; worse with strenuous hand use.</li><li class="mk"><b>Phalen test/maneuver</b>: relax wrist into flexion or place backs of hands together flexing both wrists → paresthesia in median distribution within <b>60 seconds</b>; positive in most CTS.</li><li>Inspect atrophy, task performance, wrist swelling; autonomic changes: skin discoloration, brittle nails, ↑/↓ sweating.</li></ul>`},
{t:'CTS: nonsurgical & surgical management',hy:true,b:`<ul><li>Conservative first (may recur either way). <b>NSAIDs</b> most prescribed (relief, don't slow progression) — take with/after meals; corticosteroid injections into tunnel (weekly/monthly if responsive).</li><li>Splint/brace in neutral or slight extension (day/night); yoga; wrist extension/flexion stretches.</li><li>Surgery: <b>carpal tunnel release</b> — transverse carpal ligament resected (endoscopic, mini-open, ultrasound-guided — no one best).</li><li class="mk"><b>ECTR</b>: incision <b>&lt; ½ inch (1.2 cm)</b>; less invasive/cheaper but may have longer post-op pain/numbness than open.</li><li>Post-op: VS; dressing drainage/tightness; <b>elevate hand/arm above heart</b> several days; NV checks of fingers <b>hourly</b> initially; move fingers.</li><li class="mk">Discomfort should not last beyond <b>24–72 h</b>; no lifting/restricted hand movement <b>4–6 weeks</b>; weakness for weeks–months; report NV changes, bleeding, infection. May not cure (RA synovitis recurs).</li></ul>`},
{t:'Strains (lecture)',hy:true,b:`<div class="prof"><span class="alh">📋 Prof. Note (slide 14) — degrees are lecture-only</span>Strain = <b>excessive stretching of a muscle or tendon</b>.</div><ul><li class="mk"><b>First degree (mild)</b>: mild inflammation, bleeding, swelling, ecchymosis, tenderness.</li><li class="mk"><b>Second degree (moderate)</b>: tearing of muscle/tendon fibers <b>without complete disruption</b>.</li><li class="mk"><b>Third degree (severe)</b>: <b>ruptured</b> muscle/tendon — muscle from muscle, tendon from muscle, or tendon from bone.</li><li>Textbook management: heat/cold, activity limits, NSAIDs, muscle relaxants, possible tendon repair.</li></ul>`},
{t:'Sprains, dislocations & bursitis (lecture)',b:`<div class="prof"><span class="alh">📋 Prof. Note (slide 14)</span></div><ul><li class="mk"><b>Sprain</b> = excessive stretching of a <b>ligament</b>, from a <b>twisting</b> mechanism. Tx: <b>RICE</b>; immobilization; surgery if severe.</li><li><b>Dislocation</b> = 2 or more bones moved away from each other (displacement from usual position in a synovial joint) → manual relocation, possible surgery.</li><li><b>Bursitis</b> = inflammation of the fluid-filled sacs in joints.</li><li>Sprain = ligament (bone-to-bone); strain = muscle/tendon.</li></ul><div class="mn"><span class="alh">Mnemonic</span>spr<b>A</b>in = lig<b>A</b>ment · s<b>T</b>rain = <b>T</b>endon/muscle</div>`},
{t:'Meniscus injuries & knee derangement',hy:true,b:`<div class="prof"><span class="alh">📋 Prof. Note (slide 15 + voice-over)</span>Medial and lateral menisci = pads that act as <b>shock absorbers</b>. Injury from <b>twisting the leg with the knee flexed and the foot planted</b> firmly on the ground → pain, tenderness, swelling, <b>clicking or snapping</b> sound → <b>arthroscopic surgery</b>. Also listed: <b>muscle spasms</b>.</div><ul><li>Knee = most injured joint → "internal derangement"; arthroscopy preferred; post-op analgesics, PT, bracing/splinting (knee immobilizer), frequent NV checks.</li><li>Meniscus tear (textbook): RICE, bracing, splinting, NSAIDs, arthroscopic surgery.</li><li>ACL/ligament tear: RICE; surgery if severe/unhealed.</li></ul>`},
{t:'Emergency care of sports injuries (Box 44.9) — RICE',hy:true,b:`<ul><li class="mk">Don't move victim until <b>spinal cord injury</b> ruled out.</li><li class="mk"><b>R</b>est — immobilize joint above and below (splint).</li><li class="mk"><b>I</b>ce intermittently for first <b>24–48 h</b> (heat thereafter).</li><li class="mk"><b>C</b>ompression first <b>24–48 h</b> (elastic wrap).</li><li class="mk"><b>E</b>levate to ↓ swelling.</li><li>Assume fracture until x-ray; NV check distal.</li></ul><div class="al green"><span class="alh">🟢 NCLEX pearl</span>Acute football knee injury: elevate, recommend x-ray, elastic wrap, rest — <b>NOT warm compresses</b>.</div>`},
{t:'Acute soft-tissue injuries (Table 44.3)',b:`<div class="tscroll"><table><tr><th>Injury</th><th>Management</th></tr><tr><td>Sprain — ligament overstretched</td><td>Immobilize, RICE, surgery if severe</td></tr><tr><td>Strain — muscle/tendon overstretched</td><td>Heat/cold, limit activity, NSAIDs, muscle relaxants, possible tendon repair</td></tr><tr><td>Ligament tear (ACL)</td><td>RICE, arthroscopic surgery if severe</td></tr><tr><td>Meniscus tear</td><td>RICE, bracing, splinting, NSAIDs, arthroscopy</td></tr><tr><td>Tendon rupture (Achilles) — sports, high heels, <b>fluoroquinolones (ciprofloxacin)</b></td><td>RICE, NSAIDs, orthotics, ultrasound, surgery if severe</td></tr><tr><td>Patellofemoral pain syndrome ("runner's knee")</td><td>Rest, splint, brace, NSAIDs, surgery last resort</td></tr><tr><td>Joint dislocation</td><td>Manual relocation; possible surgery</td></tr></table></div>`},
{t:'Rotator cuff injuries',hy:true,b:`<ul><li>Musculotendinous cuff stabilizes humeral head in glenoid during abduction. Young adults: major trauma (fall, throwing, lifting). Older: small tears (aging, repetition, falls), initially painless.</li><li class="mk">Shoulder pain; can't maintain abduction → arm drops (<b>drop arm test</b>); worse at night and with overhead activity. Partial-thickness = <b>more pain</b>; full-thickness = <b>more weakness</b>/loss of function; atrophy.</li><li>Dx: x-ray, MRI, ultrasound, CT (MRA for tear type/degree).</li><li>Partial: NSAIDs, intermittent steroid injections, PT (ultrasound, e-stim, ice, heat), activity limits.</li><li class="mk">No response in <b>3–6 months</b> or full-thickness → mini-open or arthroscopic repair. <b>Interscalene block</b>: arm numb/immobile up to <b>20+ hours</b>; watch respiratory distress, NV compromise.</li><li class="mk">Arm immobilized several weeks; <b>pendulum exercises POD 3–4</b> → active in ~<b>2 weeks</b>; OT; full function takes months.</li></ul>`}
]};

{id:'qv9',topic:'infect',color:STRIPES[2],title:'Bone Tumors',facts:['Osteochondroma = most common benign (femur/tibia)','Osteosarcoma = most common primary malignant; > 50% distal femur; sunburst on x-ray','Ewing sarcoma = most malignant; fever, leukocytosis, anemia; pelvic = poor prognosis','Bone-seeking cancers: prostate, breast, kidney, thyroid, lung','Primary tumors age 10–30; ↑ ALP; weight bearing progresses to full by 2–3 months after limb salvage']},
{id:'qv10',topic:'handfoot',color:STRIPES[3],title:'Hand & Foot Disorders',facts:['Dupuytren: 4th & 5th fingers; older White men, diabetes; Xiaflex or fasciectomy (OT ≥ 6 wk)','Ganglion: age 15–50; avoid strenuous activity 48 h after removal','Hallux valgus: bunionectomy healing ≥ 12 weeks; lapiplasty boot 2–6 wk, WB in 2–3 days','Plantar fasciitis: pain getting out of bed; rest, ice, stretching, orthotics','Post-bunionectomy cap refill > 5 s → report']},
{id:'qv11',topic:'oa',color:STRIPES[4],title:'Osteoarthritis Essentials',facts:['Stiffness < 30 min after inactivity; pain ↓ with rest','Heberden = DIP; Bouchard = PIP; crepitus','Spine: L3–4 and C4–6','Acetaminophen ceiling 4000 mg/day; liver risk > 3000 mg','Diclofenac gel ≥ 2 weeks to work; no heat on gel site; HA injection: ask egg/poultry allergy']},
{id:'qv12',topic:'oa',color:STRIPES[4],title:'Total Hip Arthroplasty',facts:['Cefazolin within 60 min before incision; vancomycin/clindamycin 2 h before if β-lactam allergy','Mupirocin BID × 1 week; CHG night before + morning of surgery','Posterolateral = highest dislocation risk; anterior = least','Posterior/lateral: no hip flexion > 90°; anterior: no hyperextension; never cross midline','Dislocation: sudden pain, shortening, rotation, "pop" → call 911']},
{id:'qv13',topic:'oa',color:STRIPES[4],title:'TJA Post-op & VTE',facts:['Anticoagulant within 24 h, continue ≥ 14 days','Ambulate ≥ 3×/day; OOB night of surgery / POD 1 with PT','Vitals & incision q4h × 24 h then q8–12h','CFNB: NV checks q2–4h; watch LAST (metallic taste, tinnitus, seizures)','TKA: no pillow under knee; cryotherapy; recovery ≥ 6 weeks']},
{id:'qv14',topic:'ra',color:STRIPES[0],title:'RA Assessment',facts:['Onset 35–45 yr; F:M 2–3:1; bilateral, symmetric; PIP/MCP first; DIP spared','Morning stiffness 45 min to several hours (gel phenomenon)','Single hot swollen joint = infected until proven otherwise','Cervical subluxation C1–C2 → keep neck neutral, call RRT','Sjögren triad: dry eyes, mouth, vagina']},
{id:'qv15',topic:'ra',color:STRIPES[0],title:'RA Labs',facts:['RF positive > 1:80 (not diagnostic)','ANA positive > 1:40','ESR > 20 mm/hr = inflammation; hsCRP more sensitive','Anti-CCP = specific early marker','↓ WBC → Felty (textbook: pulmonary; lecture: hepatosplenomegaly + leukopenia); platelets ↑']},
{id:'qv16',topic:'ra',color:STRIPES[0],title:'RA Drugs',facts:['MTX once weekly; 4–6 wk onset; no alcohol; stop ≥ 3 months before pregnancy; folic acid','Hydroxychloroquine: eye exam before and every 6 months','Biologics: negative PPD first; no MS or TB','Tofacitinib black box: cardiac events, cancer, clots','Gold: 25–50 mg/wk, max 1000 mg (lecture)']},
{id:'qv17',topic:'ra',color:STRIPES[0],title:'Gout',facts:['Uric acid > 6.8 mg/dL deposits crystals; goal < 6 mg/dL','Phases: asymptomatic → acute (great toe MTP) → tophaceous','Acute: NSAID, steroid, or colchicine (with food)','Chronic: allopurinol, febuxostat (CV risk), probenecid; pegloticase IV q2wk over ≥ 2 h','Avoid red/organ meat, shellfish, alcohol (beer), thiazides']},
{id:'qv18',topic:'fx',color:STRIPES[1],title:'Fracture Healing & Complications',facts:['Stages: hematoma 24–72 h → granulation 3 d–2 wk → callus 3–6 wk → ossification 3–8 wk → remodeling up to 1 yr','Adult healing 4–6 weeks; > 70 yr ≥ 3 months','FES 12–48 h: earliest = altered mental status/hypoxemia; petechiae LAST; PaO2 < 60','Delayed union = not healed in 6 months','Pelvic fx: assume a second fracture; check urine for blood']},
{id:'qv19',topic:'fx',color:STRIPES[1],title:'Acute Compartment Syndrome',facts:['Pain out of proportion, ↑ with passive motion, unrelieved by opioids','Paresthesia is often FIRST; pulses rarely disappear','6 Ps: pain, pressure, paralysis, paresthesia, pallor, pulselessness','Loosen dressing; do NOT elevate or ice; notify provider immediately','Treatment = fasciotomy']},
{id:'qv20',topic:'fx',color:STRIPES[1],title:'Cast, Traction & Fixation',facts:['NV checks q1h × 24 h, then q1–4h; elevate + ice 24–48 h','One finger fits between cast and skin; inspect cast q8–12h','Skin traction 5–10 lb; skeletal 15–30 lb; weights hang freely','Ex-fix pin sites q8–12h; don’t remove crusts','Crutches: 2–3 fingerbreadths below axilla; elbow ≤ 30°; cane on UNAFFECTED side']},
{id:'qv21',topic:'fx',color:STRIPES[1],title:'Hip Fracture',facts:['Intracapsular vs extracapsular; displaced femoral neck → AVN','Surgery within 24–48 h; ORIF is treatment of choice','Walk day of surgery / 1–2×/day POD 1; catheter out within 24 h','HOB ≥ 30°; heels off bed; delirium screening daily','Hemiarthroplasty: prevent adduction/rotation; check straps q2h']},
{id:'qv22',topic:'fx',color:STRIPES[1],title:'Vertebroplasty/Kyphoplasty',facts:['Platelets > 100,000/mm³; anticoagulants stopped','Able to lie prone ≥ 1 hour','Flat supine 1–2 h after','No driving 24 h; no soaking bath 1 week','Dressing dry, remove next day']},
{id:'qv23',topic:'amp',color:STRIPES[2],title:'Amputation',facts:['ABI = ankle SBP ÷ brachial SBP; normal ≥ 0.9','Finger: dry gauze → sealed bag → ice water 1:3 (never directly on ice)','Prone 20–30 min every 3–4 h; turn q2h; firm mattress','Rewrap elastic bandage q4–6h, figure-eight, distal→proximal','PLP is real: calcitonin IV, propranolol (dull burning), gabapentin/pregabalin (sharp), baclofen (cramping), mirror therapy']},
{id:'qv24',topic:'soft',color:STRIPES[3],title:'Carpal Tunnel',facts:['Median nerve: thumb, index, middle, half ring finger','Phalen test: paresthesia within 60 seconds','Nocturnal burning pain; most common RSI; women > 50','Post-op: NV checks q1h; elevate; discomfort 24–72 h; no lifting 4–6 weeks','ECTR incision < ½ in (1.2 cm)']},
{id:'qv25',topic:'soft',color:STRIPES[3],title:'Sports & Soft Tissue',facts:['RICE: ice intermittently 24–48 h, then heat','Assume fracture until x-ray','Strain = muscle/tendon (1°–3°); sprain = ligament','Rotator cuff: drop arm test; conservative 3–6 months; pendulum exercises POD 3–4','Fluoroquinolones can cause Achilles tendon rupture']}
