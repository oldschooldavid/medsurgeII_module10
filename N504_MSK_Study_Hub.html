window.bankState=null;window.bankGenerationInProgress=false;
async function startBankQuiz(){
 if(window.bankGenerationInProgress)return;
 if(!getKey()){$('qout-bank').innerHTML='<div class="imsg">Save your Claude API key above first.</div>';return;}
 var flag=$('b_flag').checked,ctx='';if(flag){ctx=getFlaggedContext();if(!ctx){$('qout-bank').innerHTML='<div class="imsg">You haven’t flagged anything yet. Use 🚩 on cards, drugs, or Quick View items.</div>';return;}}
 var tgt=+$('b_n').value;
 window.bankState={live:true,questions:[],angles:[],cur:0,target:tgt,topic:$('b_topic').value,fmt:$('b_fmt').value,adpie:$('b_adpie').value,hy:$('b_hy').checked,flagged:flag,flagCtx:ctx,kw:flag?flaggedKeywords(ctx):[],batch:0,done:false};
 var st=newTrack();for(var k in st)bankState[k]=st[k];
 $('qout-bank').innerHTML='<div id="bank-list"></div><div id="bank-tail"></div>';await genBankBatches();}
function generateRemaining(){if(!window.bankGenerationInProgress)genBankBatches();}
async function genBankBatches(){var B=bankState;window.bankGenerationInProgress=true;$('b_go').disabled=true;B.done=false;var fails=0;
 try{
  while(B.questions.length<Math.min(B.target,150)&&fails<3){
   var n=Math.min(10,B.target-B.questions.length);var start=B.questions.length+1;
   $('bank-progress').innerHTML='<span class="spinner" style="width:12px;height:12px"></span> Generating questions '+start+'–'+(start+n-1)+' of '+B.target+'…';
   var ctx,topicsLine='';var ids=Object.keys(TOPICS);
   if(B.flagged)ctx=B.flagCtx;
   else if(B.topic==='mixed'){var sel=[];for(var i=0;i<n;i++)sel.push(ids[(B.batch*n+i)%ids.length]);topicsLine=sel.map(function(t){return TOPICS[t].name;}).join(', ');
    var uniq=sel.filter(function(t,i){return sel.indexOf(t)===i;});ctx=uniq.map(function(t){return getTopicContext(t,Math.floor(9000/uniq.length));}).join('\n');}
   else ctx=getTopicContext(B.topic,9000);
   if(B.hy&&!B.flagged)ctx='Focus ONLY on 🔥 high-yield facts, numbers, and priority actions.\n'+ctx;
   var prompt=buildQPrompt(ctx,n,B.fmt,B.adpie,'application/analysis level (NCLEX style)',B.angles,topicsLine,B.flagged);
   var got=null;
   for(var att=0;att<2&&!got;att++){try{var raw=await callAIRetry(prompt,4000);var arr=parseAIJson(extractJsonArray(raw));if(!Array.isArray(arr))arr=[arr];
     got=sanitizeQuestions(arr).filter(validateQuestion);if(B.flagged)got=got.filter(function(q){return matchesFlagged(q,B.kw);});if(!got.length)got=null;}
    catch(e){if(e.status===401||e.status===0||e.status===-1){$('bank-tail').innerHTML=errHTML(e);return;}if(att===1)$('bank-tail').innerHTML=errHTML(e,' <span class="small">(batch skipped)</span>');}}
   B.batch++;if(!got){fails++;continue;}fails=0;
   got.forEach(function(q){var ang=(q.topic_angle||q.stem.slice(0,50)).toLowerCase().trim();if(B.angles.indexOf(ang)>=0)return;if(B.questions.length>=B.target)return;B.angles.push(ang);
    if(B.fmt!=='mixed'&&B.fmt!==q.format&&!(B.fmt==='scenario'&&q.format==='mcq'))q.format=q.format;
    var g=B.questions.length;B.questions.push(q);var d=document.createElement('div');d.className='qblock';d.id='bank-q-'+g;d.style.display=g===B.cur?'':'none';
    d.innerHTML='<div class="small" style="margin-bottom:4px">Question '+(g+1)+' of '+B.target+'</div>'+qBlockHTML(q,'b',g,'answerBank','submitBankSATA');$('bank-list').appendChild(d);});
  }
 }finally{window.bankGenerationInProgress=false;$('b_go').disabled=false;B.done=true;
  var c=B.questions.length;$('bank-progress').innerHTML=c+' of '+B.target+' generated'+(c<B.target?(B.target>100&&c>=100?' — content limit reached for unique concepts.':' <button class="mini" onclick="generateRemaining()">Generate remaining</button>'):' ✓');
  var cur=$('bank-q-'+B.cur);var nb=cur&&cur.querySelector('.nextwait');if(nb)nb.outerHTML=nextBankBtn(B.cur);}}
function nextBankBtn(g){var B=bankState;var last=g>=B.questions.length-1&&B.done;return '<button class="btn" style="margin-top:10px" onclick="nextBankQ('+g+')">'+(last?'See Results →':'Next Question →')+'</button>';}
function afterBank(g,ok){var B=bankState,q=B.questions[g];var tid=B.flagged?topicIdFromName(q.topic):(B.topic==='mixed'?topicIdFromName(q.topic):B.topic);recordAnswer(B,q,ok,tid);$('brat'+g).innerHTML=ratHTML(q,ok)+nextBankBtn(g);}
function answerBank(g,i){var q=bankState.questions[g];afterBank(g,markMCQ($('bopts'+g),q,i));}
function submitBankSATA(g){afterBank(g,markSATA('b',g,bankState.questions[g]));}
function nextBankQ(g){var B=bankState;var nx=$('bank-q-'+(g+1));
 if(nx){$('bank-q-'+g).style.display='none';nx.style.display='';B.cur=g+1;nx.scrollIntoView({behavior:'smooth',block:'start'});return;}
 if(window.bankGenerationInProgress){$('brat'+g).insertAdjacentHTML('beforeend','<div class="imsg nextwait">Next question is still generating — it will appear here in a moment.</div>');return;}
 showBankSummary();}

window.aiState=null;
function aiReset(mode){window.aiState={live:true,mode:mode,questions:[],angles:[],recent:[],difficulty:2,lastTopic:null,continuous:false,busy:false};var st=newTrack();for(var k in st)aiState[k]=st[k];}
var DIFF_TXT={1:'Level 1 — recall/understanding of single facts.',2:'Level 2 — application to a straightforward patient situation.',3:'Level 3 — analysis: prioritize, compare, interpret data.',4:'Level 4 — NCLEX-hard: complex multi-step clinical judgment, subtle distractors, priority/delegation.'};
function effectiveDiff(){var sel=$('a_diff').value;if(sel!=='a')return +sel;var r=aiState.recent.slice(-5);var d=aiState.difficulty||2;if(r.length>=5){var p=r.filter(Boolean).length/r.length;if(p>=0.8)d=Math.min(4,d+1);else if(p<0.5)d=Math.max(1,d-1);aiState.recent=[];}aiState.difficulty=d;return d;}
async function genAIBatch(topic,fmt,adpie,count){
 var ctx,flagged=topic==='flagged',kw=[];
 if(flagged){ctx=getFlaggedContext();if(!ctx)throw new Error('Nothing is flagged yet — flag cards, drugs or Quick View items with 🚩 first.');kw=flaggedKeywords(ctx);}
 else if(topic==='mixed'){var ids=shuffle(Object.keys(TOPICS).slice()).slice(0,Math.min(4,count+1));ctx=ids.map(function(t){return getTopicContext(t,2200);}).join('\n');}
 else ctx=getTopicContext(topic,8000);
 var d=effectiveDiff();
 var raw=await callAIRetry(buildQPrompt(ctx,count,fmt,adpie,DIFF_TXT[d],aiState.angles,'',flagged),Math.min(4000,900*count+600));
 var arr=parseAIJson(extractJsonArray(raw));if(!Array.isArray(arr))arr=[arr];
 var qs=sanitizeQuestions(arr).filter(validateQuestion);if(flagged)qs=qs.filter(function(q){return matchesFlagged(q,kw);});
 qs=qs.slice(0,count).filter(function(q){var a=(q.topic_angle||q.stem.slice(0,50)).toLowerCase();if(aiState.angles.indexOf(a)>=0)return false;aiState.angles.push(a);return true;});
 if(!qs.length)throw new Error('The AI returned no usable questions (all failed validation). Try again.');
 qs.forEach(function(q){q._diff=d;q._topic=topic;});renderAIQuestions(qs);return qs.length;}
function renderAIQuestions(qs){var list=$('ai-qlist');qs.forEach(function(q){var g=aiState.questions.length;aiState.questions.push(q);var d=document.createElement('div');d.className='qblock';d.id='ai-q-'+g;
 d.innerHTML='<div class="small" style="margin-bottom:4px">Q'+(g+1)+' · Difficulty '+q._diff+'</div>'+qBlockHTML(q,'a',g,'answerAI','submitAISATA');list.appendChild(d);});}
async function startAIQuiz(){
 if(!getKey()){$('qout-ai').innerHTML='<div class="imsg">Save your Claude API key above first.</div>';return;}
 aiReset('general');aiState.questions=[];var topic=$('a_topic').value,n=$('a_n').value;aiState.lastTopic=topic;aiState.continuous=n==='inf';aiState.fmt=$('a_fmt').value;aiState.adpieF=$('a_adpie').value;
 $('qout-ai').innerHTML='<div id="ai-qlist"></div>'+loaderHTML('ai-load')+'<div id="ai-tail"></div>';var t=cycleLoader('ai-load');
 try{var cnt=aiState.continuous?5:+n;var made=0;while(made<cnt){var k=Math.min(5,cnt-made);made+=await genAIBatch(topic,aiState.fmt,aiState.adpieF,k);}}
 catch(e){$('ai-tail').innerHTML=errHTML(e);}
 finally{clearInterval(t);var l=$('ai-load');if(l)l.remove();aiControls();}}
function aiControls(){var tail=$('ai-tail');if(!tail||!aiState)return;var tot=aiState.questions.length;if(!tot)return;
 if(aiState.continuous){tail.innerHTML='<div class="row" style="margin:10px 0"><button class="btn" id="contMoreBtn" onclick="contMore()">Generate next set →</button><button class="btn ghost" onclick="finishContinuous()">Done — show results</button></div>';}
 else{var answered=aiState.correct+aiState.incorrect;tail.innerHTML=answered>=tot?'<button class="btn" onclick="showAISummary()">See Results →</button>':'<div class="small">Answer all '+tot+' to see results.</div>';}}
async function contMore(){if(aiState.busy)return;aiState.busy=true;var tail=$('ai-tail');tail.innerHTML=loaderHTML('ai-load2','Generating next set…');var t=cycleLoader('ai-load2');
 try{if(aiState.mode==='med')await medBatch(3);else await genAIBatch(aiState.lastTopic,aiState.fmt,aiState.adpieF,5);aiControls();}catch(e){tail.innerHTML=errHTML(e);aiControls();tail.insertAdjacentHTML('afterbegin',errHTML(e));}finally{clearInterval(t);aiState.busy=false;}}
function finishContinuous(){showAISummary();}
function afterAI(g,ok){var q=aiState.questions[g];aiState.recent.push(ok);
 var tid=aiState.mode==='med'?null:(q._topic==='mixed'||q._topic==='flagged'?topicIdFromName(q.topic):q._topic);
 recordAnswer(aiState,q,ok,aiState.mode==='med'?'meds':tid,aiState.mode==='med'?'drug_'+aiState.drug.id:null);
 if(aiState.mode!=='med'&&tid){aiState.topics[topicLabel(tid)]=aiState.topics[topicLabel(tid)];}
 $('arat'+g).innerHTML=ratHTML(q,ok);aiControls();}
function answerAI(g,i){afterAI(g,markMCQ($('aopts'+g),aiState.questions[g],i));}
function submitAISATA(g){var q=aiState.questions[g];q.sataCorrIdx=(q.sataCorrIdx||[]).map(Number).filter(function(n){return !isNaN(n);});afterAI(g,markSATA('a',g,q));}
function showAISummary(){var A=aiState;if(!A||!(A.correct+A.incorrect))return;A.live=false;

async function medBatch(n){var d=aiState.drug,diff=aiState.difficulty,focus=$('m_focus').value;var tok=diff===1?1200:diff===2?1800:2500;
 var drugWords=(d.name+' '+d.gen).toLowerCase().split(/[^a-z]+/).filter(function(w){return w.length>=4&&['oral','with','plus','acid','inhibitor','injection','analgesic','agents','weekly','daily'].indexOf(w)<0;});
 for(var i=0;i<n;i++){
  var fmt=aiState.fmt==='mixed'?(i%3===2?'sata':'mcq'):aiState.fmt;
  var q=null;
  for(var att=0;att<2&&!q;att++){
   var drugName=d.name;
   var DIFF_INSTRUCTIONS={1:'Straight recall about '+drugName+'.',2:'Apply knowledge of '+drugName+' to a patient situation.',3:'Analysis: interpret data/prioritize for a patient receiving '+drugName+'.',4:'NCLEX-hard multi-step clinical judgment for a patient receiving '+drugName+', with subtle distractors.'};
   var p='Write ONE NCLEX-style '+fmt+' question about the drug '+drugName+' for a musculoskeletal nursing course.\n'+MED_FOCUS_PROMPTS[focus]+'\nDIFFICULTY: '+DIFF_INSTRUCTIONS[diff]+'\n'+(att?'The stem MUST contain the exact words "'+drugName+'". ':'The stem must name '+drugName+'. ')+'Do not mention other drugs except as distractors of the same class. Avoid these concepts already tested: '+aiState.angles.join('; ')+'\n'+(fmt==='sata'?'5-6 options, 2-4 correct; indexes in sataCorrIdx.':'Exactly 4 options; "correct" is the 0-based index.')+'\nUse ONLY this reference:\n'+MED_CONTEXT[d.name]+'\nRespond with ONLY one JSON object: '+QTEMPLATE;
   var raw=await callAIRetry(p,tok);var obj;try{obj=parseAIJson(extractJsonObject(raw));}catch(e){continue;}
   var s=sanitizeQuestions([obj]).filter(validateQuestion)[0];if(!s)continue;
   var stem=s.stem.toLowerCase();if(!drugWords.some(function(w){return stem.indexOf(w)>=0;})&&att===0)continue;
   s.format=s.format||fmt;s.topic=d.name;s._diff=diff;q=s;aiState.angles.push((s.topic_angle||s.stem.slice(0,40)).toLowerCase());}
  if(q)renderAIQuestions([q]);}
 if(!aiState.questions.length)throw new Error('No valid drug questions were produced. Try again.');}

function getAnki(){return lsGet('anki_cards',{});}
function deckCounts(dk){var a=getAnki(),n=Date.now(),nw=0,du=0;var cs=deckCards(dk);cs.forEach(function(c){var s=a[c.id];if(!s)nw++;else if(s.due<=n)du++;});return {n:nw,d:du,t:cs.length};}
function buildFlashUI(){return '<div class="tabhead"><h2>🗂 Flashcard Decks</h2><p>Cloze deletions from every ⭐ MUST KNOW fact plus basic cards from mind maps, Quick View and drugs — scheduled with the SM-2 algorithm (Anki-style). Separate from quiz mastery.</p></div><div id="flashBody"></div>';}
var DECK_NAMES=function(){var o=[];Object.keys(TOPICS).forEach(function(t){o.push([t,TOPICS[t].name]);});o.push(['drugs','💊 Drug Cards'],['mustknow','⭐ Must-Know Facts (cloze)'],['all','🌐 Everything']);return o;};
function renderFlashHome(){var b=$('flashBody');if(!b)return;
 b.innerHTML='<div class="tscroll"><table class="rtable"><tr><th>Deck</th><th>New</th><th>Due</th><th>Total</th><th></th></tr>'+DECK_NAMES().map(function(d){var c=deckCounts(d[0]);return '<tr><td><b>'+esc(d[1])+'</b></td><td style="color:var(--blue)">'+c.n+'</td><td style="color:var(--red)">'+c.d+'</td><td>'+c.t+'</td><td><button class="mini on" onclick="studyDeck(\''+d[0]+'\')">Study</button> <button class="mini" onclick="browseDeck(\''+d[0]+'\')">Browse</button></td></tr>';}).join('')+'</table></div><div class="small" style="margin-top:6px">New cards per session are capped at 20. Due cards always come first.</div>';}
function ivlLabel(d){if(d<1)return '<10m';if(d<30)return Math.round(d)+'d';if(d<365)return (d/30).toFixed(1).replace('.0','')+'mo';return (d/365).toFixed(1)+'y';}
function sm2(s,g){s=s?JSON.parse(JSON.stringify(s)):{ef:2.5,ivl:0,reps:0,lapses:0,due:0,state:'new'};
 if(g==='again'){if(s.state==='review')s.lapses++;s.reps=0;s.ef=Math.max(1.3,s.ef-0.2);s.ivl=0;s.state='learning';s.due=Date.now()+600000;return s;}
 var good=s.reps===0?1:s.reps===1?6:Math.round(s.ivl*s.ef);
 if(g==='hard'){s.ef=Math.max(1.3,s.ef-0.15);s.ivl=s.reps===0?1:Math.max(1,Math.round(s.ivl*1.2));}
 else if(g==='good')s.ivl=good;else{s.ivl=Math.round(Math.max(good,1)*1.3)+(s.reps===0?1:0);s.ef+=0.15;}
 s.reps++;s.state='review';s.due=Date.now()+s.ivl*864e5;return s;}
function studyDeck(dk){var a=getAnki(),n=Date.now();var cs=deckCards(dk);
 var due=shuffle(cs.filter(function(c){return a[c.id]&&a[c.id].due<=n;})),nw=shuffle(cs.filter(function(c){return !a[c.id];})).slice(0,20);
 FC={deck:dk,queue:due.concat(nw),i:0,shown:false,done:0};showFlash();}
function showFlash(){var b=$('flashBody');var name=DECK_NAMES().filter(function(d){return d[0]===FC.deck;})[0][1];
 if(FC.i>=FC.queue.length){b.innerHTML='<div class="fcard"><h3>🎉 Session complete</h3><p>'+FC.done+' reviews in <b>'+esc(name)+'</b>. Come back when more cards are due.</p><div class="row"><button class="btn" onclick="studyDeck(\''+FC.deck+'\')">Keep studying</button><button class="btn ghost" onclick="renderFlashHome()">All decks</button></div></div>';return;}
 var c=FC.queue[FC.i],st=getAnki()[c.id];
 b.innerHTML='<div class="row" style="justify-content:space-between;max-width:760px;margin:0 auto 8px"><button class="mini" onclick="renderFlashHome()">← Decks</button><span class="small">'+esc(name)+' · '+(FC.queue.length-FC.i)+' left · '+(st?(st.state==='learning'?'Learning':'Review'):'New')+'</span></div><div class="fcard"><div class="small">'+esc(c.src)+'</div><div class="fcfront" id="fcF">'+(c.type==='cloze'?c.front:c.front)+'</div><div id="fcB"></div><div id="fcBtns" style="margin-top:16px"><button class="btn" onclick="revealFlash()">Show answer (space)</button></div></div>';}
function revealFlash(){if(FC.shown)return;FC.shown=true;var c=FC.queue[FC.i],a=getAnki()[c.id];
 if(c.type==='cloze')$('fcF').innerHTML=c.back;else $('fcB').innerHTML='<div class="fcdiv"></div>'+c.back;
 $('fcBtns').innerHTML='<div class="grades">'+[['again','Again'],['hard','Hard'],['good','Good'],['easy','Easy']].map(function(g,i){var p=sm2(a,g[0]);return '<button class="g-'+g[0]+'" onclick="gradeFlash(\''+g[0]+'\')">'+g[1]+' ('+(i+1)+')<small>'+ivlLabel(g[0]==='again'?0:p.ivl)+'</small></button>';}).join('')+'</div>';}
function gradeFlash(g){var c=FC.queue[FC.i];var a=getAnki();a[c.id]=sm2(a[c.id],g);lsSet('anki_cards',a);FC.done++;if(g==='again')FC.queue.push(c);FC.i++;FC.shown=false;showFlash();}
document.addEventListener('keydown',function(e){if(CURRENT_TAB!=='flash'||!FC.queue.length||FC.i>=FC.queue.length||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;
 if(e.key===' '&&!FC.shown){e.preventDefault();revealFlash();}else if(FC.shown&&'1234'.indexOf(e.key)>=0){gradeFlash(['again','hard','good','easy'][+e.key-1]);}});
function browseDeck(dk){var a=getAnki(),n=Date.now();var name=DECK_NAMES().filter(function(d){return d[0]===dk;})[0][1];
 $('flashBody').innerHTML='<div class="row" style="margin-bottom:8px"><button class="mini" onclick="renderFlashHome()">← Decks</button><b>'+esc(name)+'</b> <span class="small">tap a row to show the answer</span></div>'+deckCards(dk).map(function(c,i){var s=a[c.id];var stt=!s?'New':s.due<=n?'Due':'in '+ivlLabel((s.due-n)/864e5);
  return '<div class="brow" style="cursor:pointer" onclick="var x=this.querySelector(\'.bans\');x.style.display=x.style.display?\'\':\'none\'"><div>'+(c.type==='cloze'?c.back:c.front)+'<div class="bans small" style="display:none;margin-top:4px">'+(c.type==='cloze'?'':c.back)+'</div></div><span class="tag">'+stt+'</span></div>';}).join('');}
// ================= INIT =================
function init(){
 if(lsGet('theme','light')==='dark')document.body.classList.add('dark');
 buildShell();injectTabTemplates();applyFlags();updateSRSBadges();updateDueCount();injectLastViewedBadges();startViewObserver();
 buildSearchIndex();buildTOC();wireSearch();document.addEventListener('selectionchange',function(){clearTimeout(window._selT);window._selT=setTimeout(onSelectionChange,200);});
 var last=lsGet('last_tab',TABS[0].id);showTab(TABS.some(function(t){return t.id===last;})?last:TABS[0].id);
 updateGlobalMasteryFromStorageOnly();renderKeyStatus();updateNavArrows();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();

</script>
</body>
</html>
